<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<title>Studio di oggi v1.11.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: tutta la finestra è il tempo di studio di oggi. L'area sotto la barra
   è divisa a mosaico in un rettangolo per impegno, con l'area proporzionale ai
   minuti previsti; si riempie dal basso mentre il cronometro gira. In fondo la pausa. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1b2333; --muted:#5d6779; --line:#dde2ea; --accent:#2f5bd3; --on-accent:#fff;
  --ok:#2e8b57; --warn:#c2410c; --danger:#c0392b;
  --compiti:#7c3aed; --compiti-bg:#ede4fd; --studio:#0891b2; --studio-bg:#dcf2f7; --pausa:#b45309; --pausa-bg:#fdecd3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f;
  --ok:#5cc48a; --warn:#f0904a; --danger:#ef7a6b;
  --compiti:#b18cf5; --compiti-bg:#2a2140; --studio:#4cc3dc; --studio-bg:#13303a; --pausa:#e5a84a; --pausa-bg:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f;
  --ok:#5cc48a; --warn:#f0904a; --danger:#ef7a6b;
  --compiti:#b18cf5; --compiti-bg:#2a2140; --studio:#4cc3dc; --studio-bg:#13303a; --pausa:#e5a84a; --pausa-bg:#3a2a12; color-scheme:dark}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
html,body{overflow:hidden;overscroll-behavior:none}
.wrap{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 56px - env(safe-area-inset-top,0px));box-sizing:border-box}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
.top{flex:none;padding-inline:4px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 12px}
.top .tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.top .tot b{color:var(--fg)}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px}
/* ✅ Finito prima (v1.10.1): dentro il rettangolo dell'impegno acceso */
.z .fp{flex:none;font:inherit;font-size:.85em;font-weight:600;padding:4px 10px;min-height:32px;border-radius:999px;border:2px solid var(--ok);background:var(--card);color:var(--ok);cursor:pointer}
/* Una pagina per fascia di studio (v1.9.0): si passa dall'una all'altra strisciando */
.pagine{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pagine::-webkit-scrollbar{display:none}
.pagina{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:4px}
.pagina .ph{flex:none;padding-inline:4px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}
.pagina .ph b{color:var(--fg);font-variant-numeric:tabular-nums}
.pagina .vuoto{padding:12px 4px}
.punti{flex:none;display:flex;justify-content:center;gap:8px}
.punti button{width:12px;height:12px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer}
.punti button.on{background:var(--fg);border-color:var(--fg)}
.pagine.gelo{opacity:.5;filter:grayscale(.6)}
.btn{font:inherit;font-weight:600;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pausa{flex:1;min-width:0;justify-content:space-between;border-color:var(--pausa)}
.btn.pausa.on{background:var(--pausa);color:var(--card)}
.btn.pausa small{font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.btn.stop{border-color:#0284c7;max-width:55%;min-width:0}
.btn.stop.gelo{background:#0284c7;color:#fff}
.zone.gelo,.btn.pausa.gelo{opacity:.5;filter:grayscale(.6)}
.zone{position:relative;flex:1;min-height:0}
.z{position:absolute;box-sizing:border-box;border:4px solid #000;border-radius:12px;background:var(--zc);overflow:hidden;cursor:pointer;display:flex;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Ogni impegno ha il suo colore (--zl/--ql chiaro, --zd/--qd scuro): fondo tenue, liquido più pieno. */
.z{--zc:var(--zl);--qc:var(--ql)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .z{--zc:var(--zd);--qc:var(--qd)}}
:root[data-theme="dark"] .z{--zc:var(--zd);--qc:var(--qd)}
/* Il liquido: sale dal basso, e in cima due onde che scorrono mentre il cronometro gira. */
.z .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--qc);transition:height .6s linear}
.z .fill::before,.z .fill::after{content:'';position:absolute;left:0;right:0;height:14px;background:var(--qc);
  -webkit-mask:var(--onda) repeat-x 0 0/90px 14px;mask:var(--onda) repeat-x 0 0/90px 14px;
  animation:onda 2.4s linear infinite;animation-play-state:paused}
.z .fill::before{top:-13px}
.z .fill::after{top:-9px;opacity:.5;animation-duration:3.6s;animation-direction:reverse}
.z.run .fill::before,.z.run .fill::after{animation-play-state:running}
.z .fill.secca::before,.z .fill.secca::after{display:none}
@keyframes onda{to{-webkit-mask-position:90px 0;mask-position:90px 0}}
.z.run{box-shadow:inset 0 0 0 3px #fff}
.z.oltre .fill{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.z.fatto{opacity:.55}
.z.fatto .t{text-decoration:line-through}
.z .in{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:8px 10px}
.z.piccolo .t small,.z.piccolo .tempo .su{display:none}
.z.piccolo .in{padding:5px 7px}
.z .r1{display:flex;align-items:flex-start;gap:8px}
.z .t{flex:1;min-width:0;font-weight:600;line-height:1.25}
.z .t small{display:block;font-weight:400;color:var(--fg);opacity:.75;font-size:.85em}
.z .play{flex:none;font-size:1.2em;line-height:1}
.z .r2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.z .tempo{font-variant-numeric:tabular-nums;font-size:.9em;color:var(--fg);opacity:.8}
.z .tempo b{color:var(--fg);font-size:1.25em;font-family:var(--display)}
.z.oltre .tempo .piu{color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:reduce){.z .fill{transition:none}.z .fill::before,.z .fill::after{animation:none}}
.vuoto,.loading{color:var(--muted)}
.vuoto a{color:var(--accent)}
.nota{font-size:13px;color:var(--muted)}
/* Sposta in un'altra fascia (v1.10.0): si apre tenendo premuto un impegno */
.menu{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.menu-c{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;box-sizing:border-box;display:grid;gap:10px}
.menu-c .nota{margin:0}
.menu-l{display:grid;gap:8px}
.menu-l .btn{justify-content:space-between;width:100%}
.menu-l .btn small{font-weight:500;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-sizing:border-box;z-index:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <div class="top">
    <h1 id="titolo">Studio di oggi</h1>
    <div class="tot" id="tot"></div>
  </div>
  <div class="pagine" id="pagine" title="Tocca un impegno per far partire il tempo; toccane un altro per passare a quello. Ritoccalo per passare alla pausa. Tienilo premuto per spostarlo in un'altra fascia."><p class="loading">Carico…</p></div>
  <div class="punti" id="punti" hidden></div>
  <div class="ctrl">
    <button type="button" class="btn pausa" id="pausa">☕ Pausa <small id="pausa-t"></small></button>
    <button type="button" class="btn stop" id="stop" hidden>❄️ Congela</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="menu" id="menu" hidden><div class="menu-c" role="dialog" aria-labelledby="menu-t">
  <b id="menu-t"></b><p class="nota">Sposta in un'altra fascia di oggi. Se non c'entra tutto, il resto va nelle altre fasce.</p>
  <div class="menu-l" id="menu-l"></div>
  <button type="button" class="btn" id="menu-no">Annulla</button>
</div></div>

<script src="scuola-ada.js"></script>
<script>
var APP_VERSION = 'v1.11.0';
var BUILD_TIME  = '2026-11-15T20:30:00Z';
console.log('%c STUDIO ADA ' + APP_VERSION + ' %c build: ' + BUILD_TIME,
  'background:#0891b2;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',
  'background:#222;color:#aaa;padding:2px 6px;border-radius:0 3px 3px 0');

const MAX_APERTA_MS = 3 * 3600e3; // una sessione dimenticata aperta oltre 3 h si chiude lì
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const oggi = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const piu = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const minuti = t => { const [h, m] = String(t || '').split(':').map(Number); return isNaN(h) ? 0 : h * 60 + (m || 0); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m/60)} h${m % 60 ? ' ' + String(m % 60).padStart(2,'0') : ''}` : `${m} min`; };
const orologio = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const chiave = (tipo, rif) => tipo + ':' + (rif || '');
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 3500); }

// Stato: impegni di oggi, sessioni di oggi (chiuse) e quella in corso.
const S = { voci: [], pagine: [], pagina: null, sessioni: [], aperta: null, congelato: null, pausaMax: 0, liberoMin: 0, avvisati: new Set(), giorno: '' };

// ❄️ Congela (v1.4.0): ferma il tempo e ricorda cosa era acceso (impegno o pausa);
// finché non si tocca Riprendi niente parte. Vale per il giorno in cui è stato
// congelato. Dalla v1.8.0 sta in sc_impostazioni.congelato, quindi vale su tutti
// i dispositivi; prima era in localStorage (la chiave vecchia si toglie).
try { localStorage.removeItem('sc_studio_congelato'); } catch (e) {}
const leggiGelo = g => g && g.giorno === iso(oggi()) ? g : null;
// In fila: una rilettura non deve vedere lo stato di prima della scrittura.
function scriviGelo(g) {
  inFila(() => SC.db('sc_impostazioni?user_id=not.is.null', { method: 'PATCH', body: { congelato: g || null }, prefer: 'return=minimal' })
    .catch(e => toast('Congela non salvato: ' + e.message)));
}

// ── Il piano di oggi ─────────────────────────────────────────────────────
// ⚠️ Gemello del primo giorno di piano() in calendario-ada.html: tempo utile =
// fasce × 60 / (60 + pausa); prima i compiti delle lezioni di domani (non
// spuntati), poi le ore degli argomenti non «studiati», dalla verifica più
// vicina e solo prima del suo giorno. Cambiando una, cambia l'altra.
// Il piano di oggi è il primo giorno di SC.piano (scuola-ada.js), la stessa regola
// del calendario: rimandati e cancellati compresi. Un impegno che compare due volte
// (rimandato più la sua quota normale) diventa un rettangolo solo.
// Una pagina per fascia (v1.9.0): i blocchi del piano (SC.piano ≥ v1.8.0). Un impegno
// spezzato fra due fasce ha un rettangolo per pagina: `min` è il pezzo di quella
// fascia, `prima` i minuti che gli danno le fasce precedenti, `totale` quelli di oggi.
function pianoDiOggi(dati) {
  const g = SC.piano(dati, null, 1).giorni[0], pausa = dati.imp.pausa_minuti || 0;
  const bl = g.blocchi && g.blocchi.length ? g.blocchi : [{ inizio: '', fine: '', cap: g.cap, compiti: g.compiti, studio: g.studio }];
  const tot = new Map(), voci = [], pagine = [];
  // Da dove viene ogni impegno (v1.10.0): la quota normale di oggi e/o le righe di
  // sc_spostamenti. Serve a «Sposta in un'altra fascia», che le sposta tutte.
  const fonti = new Map();
  const fonte = (k, x) => { const l = fonti.get(k) || []; const id = x.sp ? x.sp.id : 'n';
    if (!l.some(f => f.id === id)) l.push({ id, sp: x.sp || null, da: x.da, min: x.intero || x.min }); fonti.set(k, l); };
  bl.forEach(b => { b.compiti.forEach(c => fonte(chiave('compito', c.id), c)); b.studio.forEach(s => fonte(chiave('argomento', s.a.id), s)); });
  bl.forEach((b, p) => {
    const per = new Map(), lista = [];
    const metti = v => {
      const k = chiave(v.tipo, v.rif); v.prima = tot.get(k) || 0; tot.set(k, v.prima + v.min);
      const c = per.get(k); if (c) c.min += v.min; else { per.set(k, v); lista.push(v); }
    };
    // I compiti già spuntati restano a schermo come completati (v1.9.1), con la loro area.
    for (const c of b.compiti) metti({ tipo: 'compito', rif: c.id, da: c.da, titolo: c.nome, sotto: c.sp ? 'Compiti rimandati' : 'Compiti per domani', min: c.min, fatto: !!c.ok });
    for (const s of b.studio) metti({ tipo: 'argomento', rif: s.a.id, titolo: `${s.v.materia} · ${s.a.titolo}`, sotto: `per il ${s.v.data.slice(8)}/${s.v.data.slice(5,7)}`, min: s.min, fatto: false });
    pagine.push({ inizio: b.inizio, fine: b.fine, cap: b.cap, voci: lista });
  });
  // Gli argomenti «Studiati» escono dal piano: si ritrovano dalle sessioni di oggi e
  // restano come completati (v1.9.1), sulla pagina della fascia in cui ci si è lavorato,
  // con l'area dei minuti cronometrati.
  const msDi = new Map(), quando = new Map();
  for (const s of dati.sess || []) if (s.tipo === 'argomento' && s.rif && s.giorno === iso(oggi())) {
    const fine = s.fine ? Date.parse(s.fine) : Date.now();
    msDi.set(s.rif, (msDi.get(s.rif) || 0) + fine - Date.parse(s.inizio)); quando.set(s.rif, new Date(s.inizio));
  }
  const verDi = new Map((dati.ver || []).map(v => [v.id, v]));
  for (const a of dati.args || []) {
    if (!a.studiato || a.annullato || !msDi.has(a.id) || tot.has(chiave('argomento', a.id))) continue;
    const d = quando.get(a.id), m = d.getHours() * 60 + d.getMinutes(), v = verDi.get(a.verifica_id);
    let p = pagine.findIndex(pg => pg.fine && minuti(pg.inizio) <= m && m < minuti(pg.fine));
    if (p < 0) p = Math.max(0, pagine.findIndex(pg => pg.fine && minuti(pg.fine) > m)); if (p < 0) p = 0;
    const min = Math.max(1, Math.round(msDi.get(a.id) / 60e3));
    tot.set(chiave('argomento', a.id), min);
    pagine[p].voci.push({ tipo: 'argomento', rif: a.id, titolo: v ? `${v.materia} · ${a.titolo}` : a.titolo, sotto: v ? `per il ${v.data.slice(8)}/${v.data.slice(5,7)}` : 'Studiato', min, prima: 0, fatto: true });
  }
  pagine.forEach((pg, p) => pg.voci.forEach((v, j) => { v.p = p; v.j = j; v.i = voci.length; voci.push(v); }));
  for (const v of voci) { v.totale = tot.get(chiave(v.tipo, v.rif)); v.fonti = fonti.get(chiave(v.tipo, v.rif)) || []; }
  // Pausa concessa: i minuti di pausa per ogni ora di lavoro previsto.
  const lavoro = [...tot.values()].reduce((a, m) => a + m, 0);
  return { voci, pagine, pausaMax: Math.round(lavoro * pausa / 60) };
}
// La pagina da cui si parte: la fascia in corso, o la prossima; finite tutte, l'ultima.
function paginaDiAdesso() {
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const k = S.pagine.findIndex(p => p.fine && minuti(p.fine) > m);
  return k >= 0 ? k : Math.max(0, S.pagine.length - 1);
}
// ⏳ Tempo libero (v1.9.0): i minuti guadagnati oggi con «Finito prima»,
// in sc_impostazioni.tempo_libero {giorno, minuti}; un altro giorno vale zero.
const leggiLibero = t => t && t.giorno === iso(oggi()) ? Number(t.minuti) || 0 : 0;
// Dalla v1.11.0 il tempo libero è un rettangolo del mosaico, nella pagina della fascia
// in corso (o della prossima), con l'area dei suoi minuti. Si rimette a ogni lettura:
// torna true se è cambiato qualcosa, così si ridisegna solo allora.
function conLibero() {
  const prima = S.voci.find(v => v.tipo === 'libero');
  S.pagine.forEach(pg => { pg.voci = pg.voci.filter(v => v.tipo !== 'libero'); });
  const ms = speso('libero', null), min = Math.max(S.liberoMin, Math.ceil(ms / 60e3));
  let p = null;
  if (min > 0 && S.pagine.length) {
    p = prima ? Math.min(prima.p, S.pagine.length - 1) : paginaDiAdesso();
    S.pagine[p].voci.push({ tipo: 'libero', rif: null, titolo: '⏳ Tempo libero', sotto: 'Guadagnato con «Finito prima»', min: S.liberoMin || min, prima: 0, totale: S.liberoMin || min, fonti: [], fatto: false });
  }
  S.voci = [];
  S.pagine.forEach((pg, k) => pg.voci.forEach((v, j) => { v.p = k; v.j = j; v.i = S.voci.length; S.voci.push(v); }));
  const dopo = S.voci.find(v => v.tipo === 'libero');
  return !prima !== !dopo || (prima && dopo && (prima.min !== dopo.min || prima.p !== dopo.p));
}

async function carica() {
  const t = oggi(), oggiIso = iso(t); S.giorno = oggiIso;
  try {
    const [materie, orario, fatti, ver, args, imp, sess, sposta] = await Promise.all([
      SC.db('sc_materie?select=id,nome,minuti'),
      SC.db('sc_orario?select=id,giorno,ora,materia_id,senza_compiti&order=giorno,ora'),
      SC.db(`sc_compiti_fatti?select=giorno,orario_id,stato&giorno=gte.${iso(piu(t, -60))}`),
      SC.db(`sc_verifiche?select=id,data,materia&data=gt.${oggiIso}&order=data,created_at`),
      SC.db('sc_argomenti?select=id,verifica_id,titolo,ore,studiato,annullato,posizione&order=posizione'),
      SC.db('sc_impostazioni?select=*&limit=1'),
      SC.db(`sc_sessioni?select=*&or=(giorno.eq.${oggiIso},fine.is.null)&order=inizio`),
      SC.db('sc_spostamenti?select=*').catch(() => [])
    ]);
    const p = pianoDiOggi({ materie, orario, fatti, ver, args, imp: imp[0] || { fasce: {}, pausa_minuti: 0 }, sposta, sess });
    S.voci = p.voci; S.pagine = p.pagine; S.pausaMax = p.pausaMax;
    S.liberoMin = leggiLibero((imp[0] || {}).tempo_libero);
    if (S.pagina === null || S.giorno !== oggiIso) S.pagina = paginaDiAdesso();
    // Sessioni aperte: una sola è buona; quelle di altri giorni o dimenticate si chiudono.
    S.aperta = null; S.sessioni = [];
    for (const s of sess) {
      if (s.fine) { S.sessioni.push(s); continue; }
      const vecchia = s.giorno !== oggiIso || Date.now() - Date.parse(s.inizio) > MAX_APERTA_MS || S.aperta;
      if (vecchia) {
        const fine = new Date(Math.min(Date.now(), Date.parse(s.inizio) + MAX_APERTA_MS)).toISOString();
        await SC.db(`sc_sessioni?id=eq.${s.id}`, { method: 'PATCH', body: { fine }, prefer: 'return=minimal' }).catch(() => {});
        if (s.giorno === oggiIso) S.sessioni.push({ ...s, fine });
        toast('Un cronometro era rimasto acceso: l\'ho fermato.');
      } else S.aperta = s;
    }
    const gelo = (imp[0] || {}).congelato;
    S.congelato = S.aperta ? null : leggiGelo(gelo); if (!S.congelato && gelo) scriviGelo(null);
    // Compiti spuntati e argomenti «Studiati» oggi restano a schermo come completati (v1.9.1);
    // il resto che il piano non propone più non si mostra, ma il suo tempo resta nel totale.
    conLibero();
    disegna();
  } catch (e) { document.getElementById('pagine').innerHTML = `<p class="vuoto">Non riesco a leggere i dati: ${esc(e.message)}</p>`; }
}

// Millisecondi passati oggi su un impegno (o sulla pausa), sessione in corso compresa.
function speso(tipo, rif) {
  const k = chiave(tipo, rif), ora = Date.now();
  let ms = 0;
  for (const s of S.sessioni) if (chiave(s.tipo, s.rif) === k) ms += Date.parse(s.fine) - Date.parse(s.inizio);
  if (S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === k) ms += ora - Date.parse(S.aperta.inizio);
  return ms;
}

// Il colore di un impegno è lo stesso su tutte le pagine (numerato per chiave).
function coloreDi(v) {
  if (v.tipo === 'libero') return '--zl:hsl(140 70% 86%);--ql:hsl(140 60% 52%);--zd:hsl(140 45% 22%);--qd:hsl(140 55% 40%)';
  const ks = [...new Set(S.voci.filter(x => x.tipo !== 'libero').map(x => chiave(x.tipo, x.rif)))];
  return colori(ks.indexOf(chiave(v.tipo, v.rif)));
}
function disegna() {
  const pg = document.getElementById('pagine'), dots = document.getElementById('punti');
  if (!S.voci.length) {
    pg.innerHTML = `<p class="vuoto">Oggi non c'è niente in programma. Se ti aspettavi qualcosa, controlla le <a href="impostazioni-ada.html">fasce di studio</a> e il <a href="calendario-ada.html">calendario</a>.</p>`;
    dots.hidden = true;
  } else {
    const piu = S.pagine.length > 1;
    pg.innerHTML = S.pagine.map((p, k) => `<section class="pagina" data-p="${k}">
      ${piu ? `<div class="ph"><b>${esc(p.inizio)}–${esc(p.fine)}</b><span>${k + 1} di ${S.pagine.length} · ${fmtMin(p.voci.reduce((a, v) => a + (v.tipo === 'libero' ? 0 : v.min), 0))} di attività</span></div>` : ''}
      <div class="zone">${p.voci.length ? p.voci.map(v => `<div class="z ${v.tipo}" data-i="${v.i}" role="button" tabindex="0" style="${coloreDi(v)}">
      <div class="fill"></div>
      <div class="in"><div class="r1"><div class="t">${esc(v.titolo)}<small>${esc(v.sotto)}${v.min ? ' · ' + fmtMin(v.min) : ''}${v.min < v.totale ? ' (parte)' : ''}</small></div><span class="play"></span></div>
      <div class="r2"><span class="tempo"></span><button type="button" class="fp" hidden>✅ Finito prima</button></div></div></div>`).join('') : `<p class="vuoto">In questa fascia non c'è niente in programma.</p>`}</div></section>`).join('');
    dots.hidden = !piu;
    dots.innerHTML = piu ? S.pagine.map((p, k) => `<button type="button" data-vai="${k}" aria-label="Fascia ${esc(p.inizio)}–${esc(p.fine)}"></button>`).join('') : '';
  }
  disponi();
  vaiPagina(S.pagina || 0, false);
  aggiorna();
}
function vaiPagina(k, liscio) {
  const pg = document.getElementById('pagine');
  k = Math.max(0, Math.min(k, S.pagine.length - 1)); S.pagina = k;
  pg.scrollTo({ left: k * pg.clientWidth, behavior: liscio ? 'smooth' : 'auto' });
  segnaPunti();
}
function segnaPunti() { document.querySelectorAll('#punti button').forEach(b => b.classList.toggle('on', Number(b.dataset.vai) === S.pagina)); }
document.getElementById('pagine').addEventListener('scroll', () => {
  const pg = document.getElementById('pagine');
  if (!pg.clientWidth) return;
  const k = Math.round(pg.scrollLeft / pg.clientWidth);
  if (k !== S.pagina) { S.pagina = k; segnaPunti(); }
}, { passive: true });

// Un colore diverso per ogni impegno: tinte distanziate dall'angolo aureo, così due vicine non si somigliano.
const ONDA = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="14" viewBox="0 0 90 14"><path d="M0 7 Q22.5 0 45 7 T90 7 V14 H0Z"/></svg>')}")`;
document.documentElement.style.setProperty('--onda', ONDA);
function colori(i) {
  const h = Math.round((i * 137.508 + 205) % 360);
  return `--zl:hsl(${h} 95% 85%);--ql:hsl(${h} 90% 58%);--zd:hsl(${h} 55% 24%);--qd:hsl(${h} 80% 46%)`;
}

// Mosaico (treemap «squarified»): ogni impegno prende un rettangolo con l'area
// proporzionale ai suoi minuti, cercando forme il più possibile quadrate.
// Un pavimento (6 % del totale) tiene leggibili gli impegni molto brevi.
function mosaico(pesi, W, H) {
  const tot = pesi.reduce((a, b) => a + b, 0) || 1;
  let resto = pesi.map((p, i) => ({ i, a: p * W * H / tot })).sort((a, b) => b.a - a.a);
  let x = 0, y = 0, w = W, h = H; const out = [];
  const peggiore = (riga, lato) => { const s = riga.reduce((a, c) => a + c.a, 0), mx = riga[0].a, mn = riga[riga.length - 1].a;
    return Math.max(lato * lato * mx / (s * s), s * s / (lato * lato * mn)); };
  while (resto.length) {
    const lato = Math.min(w, h); let riga = [resto.shift()];
    while (resto.length && peggiore([...riga, resto[0]], lato) <= peggiore(riga, lato)) riga.push(resto.shift());
    const s = riga.reduce((a, c) => a + c.a, 0);
    if (w >= h) { const cw = s / h; let yy = y; for (const c of riga) { const ch = c.a / cw; out[c.i] = { x, y: yy, w: cw, h: ch }; yy += ch; } x += cw; w -= cw; }
    else { const rh = s / w; let xx = x; for (const c of riga) { const cw = c.a / rh; out[c.i] = { x: xx, y, w: cw, h: rh }; xx += cw; } y += rh; h -= rh; }
  }
  return out;
}
function disponi() {
  document.querySelectorAll('.pagina').forEach(pag => {
    const z = pag.querySelector('.zone'), el = z.querySelectorAll('.z'), voci = S.pagine[pag.dataset.p].voci;
    if (!el.length) return;
    const W = z.clientWidth, H = z.clientHeight, G = 3;
    const totMin = voci.reduce((a, v) => a + v.min, 0) || 1;
    const r = mosaico(voci.map(v => Math.max(v.min, totMin * .06, 1)), W, H);
    el.forEach(e => { const q = r[S.voci[e.dataset.i].j], w = q.w - 2 * G, h = q.h - 2 * G;
      Object.assign(e.style, { left: q.x + G + 'px', top: q.y + G + 'px', width: w + 'px', height: h + 'px',
        fontSize: Math.max(12, Math.min(20, Math.sqrt(w * h) / 11)) + 'px' });
      e.classList.toggle('piccolo', w < 130 || h < 100); });
  });
}
new ResizeObserver(() => { disponi(); if (S.pagine.length) vaiPagina(S.pagina || 0, false); }).observe(document.getElementById('pagine'));

// Ridisegna i soli numeri, una volta al secondo.
function aggiorna() {
  // Totale studiato: tutte le sessioni di oggi tranne la pausa, anche di impegni non più a schermo.
  const ora = Date.now();
  const studio = t => t === 'compito' || t === 'argomento';
  let tot = S.sessioni.filter(s => studio(s.tipo)).reduce((a, s) => a + Date.parse(s.fine) - Date.parse(s.inizio), 0)
    + (S.aperta && studio(S.aperta.tipo) ? ora - Date.parse(S.aperta.inizio) : 0);
  document.querySelectorAll('.z').forEach(el => {
    // Il pezzo di questa fascia: il tempo di oggi meno quello delle fasce prima.
    const v = S.voci[el.dataset.i], msTot = speso(v.tipo, v.rif), ms = Math.max(0, msTot - v.prima * 60e3);
    const run = S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === chiave(v.tipo, v.rif);
    const prev = v.min * 60e3, frac = v.fatto ? 1 : prev ? ms / prev : (ms ? 1 : 0), oltre = !v.fatto && prev && ms > prev;
    el.classList.toggle('run', !!run); el.classList.toggle('oltre', !!oltre); el.classList.toggle('fatto', !!v.fatto);
    const fill = el.querySelector('.fill'); fill.style.height = Math.min(100, frac * 100) + '%'; fill.classList.toggle('secca', !ms && !v.fatto);
    el.querySelector('.fp').hidden = !run || !!v.fatto || !studio(v.tipo) || !!S.congelato;
    el.querySelector('.play').textContent = v.fatto ? '✅' : run ? '⏸' : '▶️';
    el.querySelector('.tempo').innerHTML = `<b>${orologio(ms)}</b>${prev ? '<span class="su"> / ' + fmtMin(v.min) + '</span>' : ''}${oltre ? ` <span class="piu">+${fmtMin((ms - prev) / 60e3)}</span>` : ''}`;
    // Tempo previsto raggiunto: un suono, il cronometro si ferma e si passa alla
    // pagina dei compiti o delle verifiche, dove la voce si spunta a mano.
    // Un pezzo che non è l'ultimo: finita la sua parte si passa alla pausa e basta.
    const k = chiave(v.tipo, v.rif) + '@' + v.p;
    if (run && !v.fatto && v.tipo !== 'libero' && prev && ms >= prev && !S.avvisati.has(k)) {
      S.avvisati.add(k);
      if (msTot >= v.totale * 60e3) finito(v);
      else { bip(); toast(`Finita la parte di questa fascia per «${v.titolo}»: il resto è nella fascia dopo.`); inFila(async () => { await chiudi(); await apri('pausa', null, 'Pausa'); aggiorna(); }); }
    }
  });
  // ⏳ Tempo libero (un rettangolo del mosaico): quando finisce il cronometro si ferma.
  const lms = speso('libero', null), liberoOn = S.aperta && S.aperta.tipo === 'libero';
  if (liberoOn && lms >= S.liberoMin * 60e3 && !S.avvisati.has('libero')) {
    S.avvisati.add('libero'); bip(); toast('Il tempo libero di oggi è finito.');
    inFila(async () => { await chiudi(); aggiorna(); });
  }
  if (!liberoOn || lms < S.liberoMin * 60e3) S.avvisati.delete('libero');
  const pms = speso('pausa', null), pausaOn = S.aperta && S.aperta.tipo === 'pausa';
  const pb = document.getElementById('pausa');
  pb.classList.toggle('on', !!pausaOn);
  pb.firstChild.textContent = pausaOn ? '☕ In pausa ' : '☕ Pausa ';
  document.getElementById('pausa-t').textContent = `${orologio(pms)} / ${fmtMin(S.pausaMax)}`;
  if (pausaOn && S.pausaMax && pms >= S.pausaMax * 60e3 && !S.avvisati.has('pausa')) { S.avvisati.add('pausa'); bip(); toast('La pausa di oggi è finita: si riparte!'); }
  const sb = document.getElementById('stop'), g = S.congelato;
  sb.hidden = !S.aperta && !g;
  sb.classList.toggle('gelo', !!g);
  sb.textContent = g ? '▶️ Riprendi ' + (g.tipo === 'pausa' ? 'la pausa' : g.titolo) : '❄️ Congela';
  document.getElementById('pagine').classList.toggle('gelo', !!g);
  pb.classList.toggle('gelo', !!g); lb.classList.toggle('gelo', !!g);
  const prev = S.voci.filter(v => !v.fatto && v.tipo !== 'libero').reduce((a, v) => a + v.min, 0);
  document.getElementById('tot').innerHTML = `studiato <b>${fmtMin(tot / 60e3)}</b>${prev ? ` su ${fmtMin(prev)} previsti` : ''}`;
}
setInterval(() => { if (document.visibilityState === 'visible' && S.voci) aggiorna(); }, 1000);

// 🔄 Sincronizzazione fra dispositivi (v1.7.0): le sessioni di oggi si rileggono
// ogni 15 secondi a pagina visibile, e tornando sulla pagina si ricarica tutto
// (anche il piano: un compito spuntato altrove sparisce). Passa da inFila, così
// non si incrocia con un tocco che sta ancora scrivendo.
const OGNI_MS_SYNC = 15e3;
function sincronizza() {
  if (document.visibilityState !== 'visible' || !S.giorno) return;
  if (S.giorno !== iso(oggi())) { S.pagina = null; inFila(carica); return; } // dopo mezzanotte il piano è un altro
  inFila(async () => {
    let sess, imp;
    try { [sess, imp] = await Promise.all([SC.db(`sc_sessioni?select=*&giorno=eq.${S.giorno}&order=inizio`), SC.db('sc_impostazioni?select=congelato,tempo_libero&limit=1')]); } catch (e) { return; }
    S.liberoMin = leggiLibero((imp[0] || {}).tempo_libero);
    const aperte = sess.filter(s => !s.fine);
    S.sessioni = sess.filter(s => s.fine);
    S.aperta = aperte.length ? aperte[aperte.length - 1] : null;
    // Congela e Riprendi da un altro dispositivo; un cronometro acceso vince sul gelo.
    const gelo = leggiGelo((imp[0] || {}).congelato);
    S.congelato = S.aperta ? null : gelo;
    if (S.aperta && gelo) scriviGelo(null);
    if (conLibero()) disegna(); else aggiorna();
  });
}
setInterval(sincronizza, OGNI_MS_SYNC);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.giorno) inFila(carica);
});

let audio;
function bip() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => { const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .15); });
  } catch (e) {}
}

// ── Cronometro: una sessione aperta alla volta ───────────────────────────
let lavoro = Promise.resolve();
const inFila = f => (lavoro = lavoro.then(f, f));

async function chiudi() {
  const s = S.aperta; if (!s) return;
  S.aperta = null;
  const fine = new Date().toISOString();
  S.sessioni.push({ ...s, fine });
  if (s.id) await SC.db(`sc_sessioni?id=eq.${s.id}`, { method: 'PATCH', body: { fine }, prefer: 'return=minimal' })
    .catch(e => toast('Tempo non salvato: ' + e.message));
}
async function apri(tipo, rif, titolo) {
  const s = { tipo, rif: rif || null, titolo, giorno: iso(oggi()), inizio: new Date().toISOString(), fine: null };
  S.aperta = s;
  try { const [r] = await SC.db('sc_sessioni', { method: 'POST', body: s }); if (S.aperta === s) s.id = r.id; else if (r) await SC.db(`sc_sessioni?id=eq.${r.id}`, { method: 'PATCH', body: { fine: new Date().toISOString() }, prefer: 'return=minimal' }); }
  catch (e) { toast('Tempo non salvato: ' + e.message); }
}
function tocca(tipo, rif, titolo) {
  if (audio && audio.state === 'suspended') audio.resume();
  if (S.congelato) { toast('Congelato: tocca Riprendi per ripartire.'); return; }
  const stessa = S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === chiave(tipo, rif);
  // Spegnere un impegno fa partire la pausa (v1.5.0), anche oltre i minuti concessi.
  // Il tempo libero spento non porta a niente.
  const poi = !stessa ? [tipo, rif, titolo] : (tipo === 'compito' || tipo === 'argomento' ? ['pausa', null, 'Pausa'] : null);
  inFila(async () => { await chiudi(); if (poi) await apri(...poi); aggiorna(); });
  // Risposta immediata a schermo, prima della rete.
  aggiorna();
}

// Tempo finito: si salva il tempo e si va alla voce (stesse ancore del calendario).
function finito(v) {
  bip();
  toast(`Tempo finito per «${v.titolo}»: ti porto ${v.tipo === 'compito' ? 'ai compiti' : 'alle verifiche'} per spuntarlo.`);
  const dove = v.tipo === 'compito' ? `compiti-ada.html#c-${v.da || iso(oggi())}-${v.rif}` : `verifiche-ada.html#arg-${v.rif}`;
  inFila(async () => { await chiudi(); await apri('pausa', null, 'Pausa'); aggiorna(); }).then(() => setTimeout(() => { location.href = dove; }, 2500));
}

// ✅ Finito prima (v1.9.0): l'impegno acceso si segna fatto — il compito spuntato,
// l'argomento «Studiato» — e i minuti che il piano gli dava oggi e non sono stati
// usati vanno nel ⏳ tempo libero di oggi.
function finitoPrima() {
  const a = S.aperta; if (!a) return;
  const v = S.voci.find(x => chiave(x.tipo, x.rif) === chiave(a.tipo, a.rif)); if (!v) return;
  const resto = Math.max(0, Math.floor(v.totale - speso(v.tipo, v.rif) / 60e3));
  const cosa = v.tipo === 'compito' ? 'spunto il compito' : 'segno l\'argomento «Studiato»';
  if (!confirm(`Hai finito «${v.titolo}»? Ne ${cosa}${resto ? ` e metto ${fmtMin(resto)} nel tempo libero` : ''}.`)) return;
  S.voci.filter(x => chiave(x.tipo, x.rif) === chiave(v.tipo, v.rif)).forEach(x => S.avvisati.add(chiave(x.tipo, x.rif) + '@' + x.p));
  inFila(async () => {
    await chiudi();
    try {
      if (v.tipo === 'compito')
        await SC.db('sc_compiti_fatti?on_conflict=user_id,giorno,orario_id', { method: 'POST', body: { giorno: v.da || iso(oggi()), orario_id: v.rif, stato: 'fatto' }, prefer: 'resolution=merge-duplicates,return=minimal' });
      else await SC.db(`sc_argomenti?id=eq.${v.rif}`, { method: 'PATCH', body: { studiato: true }, prefer: 'return=minimal' });
      if (resto) {
        // Si rilegge prima di sommare: un altro dispositivo può averne aggiunto.
        const [r] = await SC.db('sc_impostazioni?select=tempo_libero&limit=1');
        const nuovo = { giorno: iso(oggi()), minuti: leggiLibero(r && r.tempo_libero) + resto };
        await SC.db('sc_impostazioni?user_id=not.is.null', { method: 'PATCH', body: { tempo_libero: nuovo }, prefer: 'return=minimal' });
      }
      toast(resto ? `Fatto! +${fmtMin(resto)} di tempo libero.` : 'Fatto!');
    } catch (err) { toast('Non salvato: ' + err.message); }
    await carica();
  });
  aggiorna();
}

// 🧱 Sposta in un'altra fascia (v1.10.0): tenendo premuto un impegno (o col tasto
// destro) si sceglie una fascia di oggi. Si spostano tutte le sue fonti di oggi:
// le righe di sc_spostamenti già esistenti prendono la fascia, la quota normale
// ne diventa una nuova («rimandato» con a = oggi). Il piano (SC.piano) la mette
// lì per prima e passa il resto alle altre fasce.
let menuVoce = null;
function apriMenu(v) {
  if (menuVoce) return;
  if (v.fatto) { toast(`«${v.titolo}» è già fatto ✅`); return; }
  if (v.tipo === 'libero') { toast('Il tempo libero sta nella fascia in corso: non si sposta.'); return; }
  const fasce = S.pagine.filter(p => p.fine);
  if (fasce.length < 2) { toast('Oggi c\'è una fascia sola: non c\'è dove spostarlo.'); return; }
  menuVoce = v;
  document.getElementById('menu-t').textContent = v.titolo;
  document.getElementById('menu-l').innerHTML = S.pagine.map((p, k) => {
    if (!p.fine) return '';
    const qui = p.voci.find(x => chiave(x.tipo, x.rif) === chiave(v.tipo, v.rif));
    const tutto = qui && qui.min >= v.totale;
    return `<button type="button" class="btn" data-fascia="${esc(p.inizio)}-${esc(p.fine)}"${tutto ? ' disabled' : ''}>${esc(p.inizio)}–${esc(p.fine)} <small>${tutto ? 'è già qui' : qui ? 'in parte qui' : ''}</small></button>`;
  }).join('');
  document.getElementById('menu').hidden = false;
}
function chiudiMenu() { menuVoce = null; document.getElementById('menu').hidden = true; }
function spostaInFascia(v, fascia) {
  const g = iso(oggi());
  inFila(async () => {
    try {
      for (const f of v.fonti) {
        if (f.sp) await SC.db(`sc_spostamenti?id=eq.${f.sp.id}`, { method: 'PATCH', body: { stato: 'rimandato', a: g, fascia }, prefer: 'return=minimal' });
        else await SC.db('sc_spostamenti', { method: 'POST', prefer: 'return=minimal',
          body: { tipo: v.tipo, rif: v.rif, da: f.da || g, min: Math.round(f.min), stato: 'rimandato', a: g, fascia } });
      }
      toast(`Spostato nella fascia ${fascia.replace('-', '–')}.`);
    } catch (err) { toast('Non spostato: ' + err.message); }
    S.pagina = null; await carica();
  });
}
// Pressione lunga: 500 ms fermi sul rettangolo; muovendo il dito (per strisciare) si annulla.
const LUNGA = { t: null, x: 0, y: 0, fatta: false };
document.addEventListener('pointerdown', e => {
  const z = e.target.closest('.z'); LUNGA.fatta = false; clearTimeout(LUNGA.t);
  if (!z || e.button > 0 || e.target.closest('.fp')) return;
  LUNGA.x = e.clientX; LUNGA.y = e.clientY;
  LUNGA.t = setTimeout(() => { LUNGA.fatta = true; if (navigator.vibrate) try { navigator.vibrate(20); } catch (x) {} apriMenu(S.voci[z.dataset.i]); }, 500);
});
document.addEventListener('pointermove', e => { if (LUNGA.t && Math.hypot(e.clientX - LUNGA.x, e.clientY - LUNGA.y) > 10) { clearTimeout(LUNGA.t); LUNGA.t = null; } });
document.addEventListener('pointerup', () => { clearTimeout(LUNGA.t); LUNGA.t = null; });
document.addEventListener('pointercancel', () => { clearTimeout(LUNGA.t); LUNGA.t = null; });
document.addEventListener('contextmenu', e => {
  const z = e.target.closest('.z'); if (!z) return;
  e.preventDefault(); LUNGA.fatta = true; clearTimeout(LUNGA.t); apriMenu(S.voci[z.dataset.i]);
});

document.addEventListener('click', e => {
  if (e.target.closest('#menu')) {
    const b = e.target.closest('[data-fascia]'), v = menuVoce;
    if (b && !b.disabled && v) { chiudiMenu(); spostaInFascia(v, b.dataset.fascia); }
    else if (e.target.closest('#menu-no') || e.target.id === 'menu') chiudiMenu();
    return;
  }
  if (e.target.closest('.fp')) { finitoPrima(); return; }   // dentro il rettangolo: non tocca il cronometro
  const z = e.target.closest('.z');
  if (z && LUNGA.fatta) { LUNGA.fatta = false; return; }   // era una pressione lunga: niente cronometro
  if (z) { const v = S.voci[z.dataset.i]; if (v.fatto) { toast(`«${v.titolo}» è già fatto ✅`); return; }
    if (v.tipo === 'libero' && !(S.aperta && S.aperta.tipo === 'libero') && speso('libero', null) >= S.liberoMin * 60e3) { toast('Il tempo libero di oggi è già finito.'); return; }
    tocca(v.tipo, v.rif, v.titolo); return; }
  if (e.target.closest('#pausa')) { tocca('pausa', null, 'Pausa'); return; }
  const d = e.target.closest('[data-vai]'); if (d) { vaiPagina(Number(d.dataset.vai), true); return; }
  if (e.target.closest('#stop')) {
    if (S.congelato) { const g = S.congelato; S.congelato = null; scriviGelo(null); tocca(g.tipo, g.rif, g.titolo); return; }
    const a = S.aperta; if (!a) return;
    S.congelato = { tipo: a.tipo, rif: a.rif || null, titolo: a.titolo, giorno: iso(oggi()) }; scriviGelo(S.congelato);
    inFila(async () => { await chiudi(); aggiorna(); }); aggiorna();
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('z')) { e.preventDefault(); e.target.click(); } });

SC.avvia('studio-ada.html', carica);
</script>
