<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<title>Studio di oggi v1.3.3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: tutta la finestra è il tempo di studio di oggi. L'area sotto la barra
   è divisa a mosaico in un rettangolo per impegno, con l'area proporzionale ai
   minuti previsti; si riempie dal basso mentre il cronometro gira. In fondo la pausa. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1b2333; --muted:#5d6779; --line:#dde2ea; --accent:#2f5bd3; --on-accent:#fff;
  --ok:#2e8b57; --warn:#c2410c; --danger:#c0392b;
  --compiti:#7c3aed; --compiti-bg:#ede4fd; --studio:#0891b2; --studio-bg:#dcf2f7; --pausa:#b45309; --pausa-bg:#fdecd3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f;
  --ok:#5cc48a; --warn:#f0904a; --danger:#ef7a6b;
  --compiti:#b18cf5; --compiti-bg:#2a2140; --studio:#4cc3dc; --studio-bg:#13303a; --pausa:#e5a84a; --pausa-bg:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f;
  --ok:#5cc48a; --warn:#f0904a; --danger:#ef7a6b;
  --compiti:#b18cf5; --compiti-bg:#2a2140; --studio:#4cc3dc; --studio-bg:#13303a; --pausa:#e5a84a; --pausa-bg:#3a2a12; color-scheme:dark}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
html,body{overflow:hidden;overscroll-behavior:none}
.wrap{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 56px - env(safe-area-inset-top,0px));box-sizing:border-box}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
.top{flex:none;padding-inline:4px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 12px}
.top .tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.top .tot b{color:var(--fg)}
.ctrl{flex:none;display:flex;gap:8px}
.btn{font:inherit;font-weight:600;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pausa{flex:1;min-width:0;justify-content:space-between;border-color:var(--pausa)}
.btn.pausa.on{background:var(--pausa);color:var(--card)}
.btn.pausa small{font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.btn.stop{border-color:var(--muted)}
.zone{position:relative;flex:1;min-height:0}
.z{position:absolute;box-sizing:border-box;border:4px solid #000;border-radius:12px;background:var(--zc);overflow:hidden;cursor:pointer;display:flex;user-select:none;-webkit-user-select:none}
/* Ogni impegno ha il suo colore (--zl/--ql chiaro, --zd/--qd scuro): fondo tenue, liquido più pieno. */
.z{--zc:var(--zl);--qc:var(--ql)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .z{--zc:var(--zd);--qc:var(--qd)}}
:root[data-theme="dark"] .z{--zc:var(--zd);--qc:var(--qd)}
/* Il liquido: sale dal basso, e in cima due onde che scorrono mentre il cronometro gira. */
.z .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--qc);transition:height .6s linear}
.z .fill::before,.z .fill::after{content:'';position:absolute;left:0;right:0;height:14px;background:var(--qc);
  -webkit-mask:var(--onda) repeat-x 0 0/90px 14px;mask:var(--onda) repeat-x 0 0/90px 14px;
  animation:onda 2.4s linear infinite;animation-play-state:paused}
.z .fill::before{top:-13px}
.z .fill::after{top:-9px;opacity:.5;animation-duration:3.6s;animation-direction:reverse}
.z.run .fill::before,.z.run .fill::after{animation-play-state:running}
.z .fill.secca::before,.z .fill.secca::after{display:none}
@keyframes onda{to{-webkit-mask-position:90px 0;mask-position:90px 0}}
.z.run{box-shadow:inset 0 0 0 3px #fff}
.z.oltre .fill{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.z.fatto{opacity:.55}
.z.fatto .t{text-decoration:line-through}
.z .in{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:8px 10px}
.z.piccolo .t small,.z.piccolo .tempo .su{display:none}
.z.piccolo .in{padding:5px 7px}
.z .r1{display:flex;align-items:flex-start;gap:8px}
.z .t{flex:1;min-width:0;font-weight:600;line-height:1.25}
.z .t small{display:block;font-weight:400;color:var(--fg);opacity:.75;font-size:.85em}
.z .play{flex:none;font-size:1.2em;line-height:1}
.z .r2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.z .tempo{font-variant-numeric:tabular-nums;font-size:.9em;color:var(--fg);opacity:.8}
.z .tempo b{color:var(--fg);font-size:1.25em;font-family:var(--display)}
.z.oltre .tempo .piu{color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:reduce){.z .fill{transition:none}.z .fill::before,.z .fill::after{animation:none}}
.vuoto,.loading{color:var(--muted)}
.vuoto a{color:var(--accent)}
.nota{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-sizing:border-box;z-index:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <div class="top">
    <h1 id="titolo">Studio di oggi</h1>
    <div class="tot" id="tot"></div>
  </div>
  <div class="zone" id="zone" title="Tocca un impegno per far partire il tempo; toccane un altro per passare a quello. Ritoccalo per fermarti."><p class="loading">Carico…</p></div>
  <div class="ctrl">
    <button type="button" class="btn pausa" id="pausa">☕ Pausa <small id="pausa-t"></small></button>
    <button type="button" class="btn stop" id="stop" hidden>⏹ Fermo</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="scuola-ada.js"></script>
<script>
var APP_VERSION = 'v1.3.3';
var BUILD_TIME  = '2026-11-11T22:20:00Z';
console.log('%c STUDIO ADA ' + APP_VERSION + ' %c build: ' + BUILD_TIME,
  'background:#0891b2;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',
  'background:#222;color:#aaa;padding:2px 6px;border-radius:0 3px 3px 0');

const MAX_APERTA_MS = 3 * 3600e3; // una sessione dimenticata aperta oltre 3 h si chiude lì
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const oggi = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const piu = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const minuti = t => { const [h, m] = String(t || '').split(':').map(Number); return isNaN(h) ? 0 : h * 60 + (m || 0); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m/60)} h${m % 60 ? ' ' + String(m % 60).padStart(2,'0') : ''}` : `${m} min`; };
const orologio = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const chiave = (tipo, rif) => tipo + ':' + (rif || '');
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 3500); }

// Stato: impegni di oggi, sessioni di oggi (chiuse) e quella in corso.
const S = { voci: [], sessioni: [], aperta: null, pausaMax: 0, avvisati: new Set(), giorno: '' };

// ── Il piano di oggi ─────────────────────────────────────────────────────
// ⚠️ Gemello del primo giorno di piano() in calendario-ada.html: tempo utile =
// fasce × 60 / (60 + pausa); prima i compiti delle lezioni di domani (non
// spuntati), poi le ore degli argomenti non «studiati», dalla verifica più
// vicina e solo prima del suo giorno. Cambiando una, cambia l'altra.
function pianoDiOggi({ materie, orario, fatti, ver, args, imp }) {
  const t = oggi(), giornoIso = iso(t), domani = piu(t, 1).getDay(), mat = new Map(materie.map(m => [m.id, m]));
  const fatto = new Set(fatti.filter(f => f.giorno === giornoIso).map(f => f.orario_id));
  const pausa = imp.pausa_minuti || 0, lf = (imp.fasce || {})[t.getDay()] || [];
  const lordo = lf.reduce((a, f) => a + Math.max(0, minuti(f[1]) - minuti(f[0])), 0);
  const cap = Math.floor(lordo * 60 / (60 + pausa));
  const voci = [];
  if (domani >= 1 && domani <= 6) for (const o of orario) {
    const m = mat.get(o.materia_id);
    if (o.giorno !== domani || o.senza_compiti || !m || !(m.minuti > 0)) continue;
    // I compiti già spuntati non si mostrano (v1.3.2): il loro tempo resta nel totale «studiato».
    if (fatto.has(o.id)) continue;
    voci.push({ tipo: 'compito', rif: o.id, titolo: m.nome, sotto: 'Compiti per domani', min: m.minuti, fatto: false });
  }
  let libero = Math.max(0, cap - voci.filter(v => !v.fatto).reduce((a, v) => a + v.min, 0));
  for (const v of ver) {
    if (v.data <= giornoIso) continue;
    for (const a of args.filter(a => a.verifica_id === v.id).sort((x, y) => x.posizione - y.posizione)) {
      if (libero <= 0) break;
      if (a.studiato || !(Number(a.ore) > 0)) continue;
      const q = Math.min(Number(a.ore) * 60, libero); libero -= q;
      voci.push({ tipo: 'argomento', rif: a.id, titolo: `${v.materia} · ${a.titolo}`, sotto: `per il ${v.data.slice(8)}/${v.data.slice(5,7)}`, min: q, fatto: false });
    }
  }
  // Pausa concessa: i minuti di pausa per ogni ora di lavoro previsto.
  const lavoro = voci.filter(v => !v.fatto).reduce((a, v) => a + v.min, 0);
  return { voci, pausaMax: Math.round(lavoro * pausa / 60) };
}

async function carica() {
  const t = oggi(), oggiIso = iso(t); S.giorno = oggiIso;
  try {
    const [materie, orario, fatti, ver, args, imp, sess] = await Promise.all([
      SC.db('sc_materie?select=id,nome,minuti'),
      SC.db('sc_orario?select=id,giorno,ora,materia_id,senza_compiti&order=giorno,ora'),
      SC.db(`sc_compiti_fatti?select=giorno,orario_id&giorno=eq.${oggiIso}`),
      SC.db(`sc_verifiche?select=id,data,materia&data=gt.${oggiIso}&order=data,created_at`),
      SC.db('sc_argomenti?select=id,verifica_id,titolo,ore,studiato,posizione&order=posizione'),
      SC.db('sc_impostazioni?select=*&limit=1'),
      SC.db(`sc_sessioni?select=*&or=(giorno.eq.${oggiIso},fine.is.null)&order=inizio`)
    ]);
    const p = pianoDiOggi({ materie, orario, fatti, ver, args, imp: imp[0] || { fasce: {}, pausa_minuti: 0 } });
    S.voci = p.voci; S.pausaMax = p.pausaMax;
    // Sessioni aperte: una sola è buona; quelle di altri giorni o dimenticate si chiudono.
    S.aperta = null; S.sessioni = [];
    for (const s of sess) {
      if (s.fine) { S.sessioni.push(s); continue; }
      const vecchia = s.giorno !== oggiIso || Date.now() - Date.parse(s.inizio) > MAX_APERTA_MS || S.aperta;
      if (vecchia) {
        const fine = new Date(Math.min(Date.now(), Date.parse(s.inizio) + MAX_APERTA_MS)).toISOString();
        await SC.db(`sc_sessioni?id=eq.${s.id}`, { method: 'PATCH', body: { fine }, prefer: 'return=minimal' }).catch(() => {});
        if (s.giorno === oggiIso) S.sessioni.push({ ...s, fine });
        toast('Un cronometro era rimasto acceso: l\'ho fermato.');
      } else S.aperta = s;
    }
    // Un impegno che il piano non propone più non si mostra, anche se oggi ci si è lavorato:
    // il suo tempo resta comunque nel totale «studiato» (vedi aggiorna()).
    disegna();
  } catch (e) { document.getElementById('zone').innerHTML = `<p class="vuoto">Non riesco a leggere i dati: ${esc(e.message)}</p>`; }
}

// Millisecondi passati oggi su un impegno (o sulla pausa), sessione in corso compresa.
function speso(tipo, rif) {
  const k = chiave(tipo, rif), ora = Date.now();
  let ms = 0;
  for (const s of S.sessioni) if (chiave(s.tipo, s.rif) === k) ms += Date.parse(s.fine) - Date.parse(s.inizio);
  if (S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === k) ms += ora - Date.parse(S.aperta.inizio);
  return ms;
}

function disegna() {
  const z = document.getElementById('zone');
  if (!S.voci.length) {
    z.innerHTML = `<p class="vuoto">Oggi non c'è niente in programma. Se ti aspettavi qualcosa, controlla le <a href="impostazioni-ada.html">fasce di studio</a> e il <a href="calendario-ada.html">calendario</a>.</p>`;
  } else {
    z.innerHTML = S.voci.map((v, i) => `<div class="z ${v.tipo}" data-i="${i}" role="button" tabindex="0" style="${colori(i)}">
      <div class="fill"></div>
      <div class="in"><div class="r1"><div class="t">${esc(v.titolo)}<small>${esc(v.sotto)}${v.min ? ' · ' + fmtMin(v.min) : ''}</small></div><span class="play"></span></div>
      <div class="r2"><span class="tempo"></span></div></div></div>`).join('');
  }
  disponi();
  aggiorna();
}

// Un colore diverso per ogni impegno: tinte distanziate dall'angolo aureo, così due vicine non si somigliano.
const ONDA = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="14" viewBox="0 0 90 14"><path d="M0 7 Q22.5 0 45 7 T90 7 V14 H0Z"/></svg>')}")`;
document.documentElement.style.setProperty('--onda', ONDA);
function colori(i) {
  const h = Math.round((i * 137.508 + 205) % 360);
  return `--zl:hsl(${h} 95% 85%);--ql:hsl(${h} 90% 58%);--zd:hsl(${h} 55% 24%);--qd:hsl(${h} 80% 46%)`;
}

// Mosaico (treemap «squarified»): ogni impegno prende un rettangolo con l'area
// proporzionale ai suoi minuti, cercando forme il più possibile quadrate.
// Un pavimento (6 % del totale) tiene leggibili gli impegni molto brevi.
function mosaico(pesi, W, H) {
  const tot = pesi.reduce((a, b) => a + b, 0) || 1;
  let resto = pesi.map((p, i) => ({ i, a: p * W * H / tot })).sort((a, b) => b.a - a.a);
  let x = 0, y = 0, w = W, h = H; const out = [];
  const peggiore = (riga, lato) => { const s = riga.reduce((a, c) => a + c.a, 0), mx = riga[0].a, mn = riga[riga.length - 1].a;
    return Math.max(lato * lato * mx / (s * s), s * s / (lato * lato * mn)); };
  while (resto.length) {
    const lato = Math.min(w, h); let riga = [resto.shift()];
    while (resto.length && peggiore([...riga, resto[0]], lato) <= peggiore(riga, lato)) riga.push(resto.shift());
    const s = riga.reduce((a, c) => a + c.a, 0);
    if (w >= h) { const cw = s / h; let yy = y; for (const c of riga) { const ch = c.a / cw; out[c.i] = { x, y: yy, w: cw, h: ch }; yy += ch; } x += cw; w -= cw; }
    else { const rh = s / w; let xx = x; for (const c of riga) { const cw = c.a / rh; out[c.i] = { x: xx, y, w: cw, h: rh }; xx += cw; } y += rh; h -= rh; }
  }
  return out;
}
function disponi() {
  const z = document.getElementById('zone'), el = z.querySelectorAll('.z');
  if (!el.length) return;
  const W = z.clientWidth, H = z.clientHeight, G = 3;
  const totMin = S.voci.reduce((a, v) => a + v.min, 0) || 1;
  const r = mosaico(S.voci.map(v => Math.max(v.min, totMin * .06, 1)), W, H);
  el.forEach(e => { const q = r[e.dataset.i], w = q.w - 2 * G, h = q.h - 2 * G;
    Object.assign(e.style, { left: q.x + G + 'px', top: q.y + G + 'px', width: w + 'px', height: h + 'px',
      fontSize: Math.max(12, Math.min(20, Math.sqrt(w * h) / 11)) + 'px' });
    e.classList.toggle('piccolo', w < 130 || h < 100); });
}
new ResizeObserver(() => disponi()).observe(document.getElementById('zone'));

// Ridisegna i soli numeri, una volta al secondo.
function aggiorna() {
  // Totale studiato: tutte le sessioni di oggi tranne la pausa, anche di impegni non più a schermo.
  const ora = Date.now();
  let tot = S.sessioni.filter(s => s.tipo !== 'pausa').reduce((a, s) => a + Date.parse(s.fine) - Date.parse(s.inizio), 0)
    + (S.aperta && S.aperta.tipo !== 'pausa' ? ora - Date.parse(S.aperta.inizio) : 0);
  document.querySelectorAll('.z').forEach(el => {
    const v = S.voci[el.dataset.i], ms = speso(v.tipo, v.rif), run = S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === chiave(v.tipo, v.rif);
    const prev = v.min * 60e3, frac = prev ? ms / prev : (ms ? 1 : 0), oltre = prev && ms > prev;
    el.classList.toggle('run', !!run); el.classList.toggle('oltre', !!oltre); el.classList.toggle('fatto', !!v.fatto);
    const fill = el.querySelector('.fill'); fill.style.height = Math.min(100, frac * 100) + '%'; fill.classList.toggle('secca', !ms);
    el.querySelector('.play').textContent = v.fatto ? '✅' : run ? '⏸' : '▶️';
    el.querySelector('.tempo').innerHTML = `<b>${orologio(ms)}</b>${prev ? '<span class="su"> / ' + fmtMin(v.min) + '</span>' : ''}${oltre ? ` <span class="piu">+${fmtMin((ms - prev) / 60e3)}</span>` : ''}`;
    // Tempo previsto raggiunto: un suono, il cronometro si ferma e si passa alla
    // pagina dei compiti o delle verifiche, dove la voce si spunta a mano.
    const k = chiave(v.tipo, v.rif);
    if (run && prev && ms >= prev && !S.avvisati.has(k)) { S.avvisati.add(k); finito(v); }
  });
  const pms = speso('pausa', null), pausaOn = S.aperta && S.aperta.tipo === 'pausa';
  const pb = document.getElementById('pausa');
  pb.classList.toggle('on', !!pausaOn);
  pb.firstChild.textContent = pausaOn ? '☕ In pausa ' : '☕ Pausa ';
  document.getElementById('pausa-t').textContent = `${orologio(pms)} / ${fmtMin(S.pausaMax)}`;
  if (pausaOn && S.pausaMax && pms >= S.pausaMax * 60e3 && !S.avvisati.has('pausa')) { S.avvisati.add('pausa'); bip(); toast('La pausa di oggi è finita: si riparte!'); }
  document.getElementById('stop').hidden = !S.aperta;
  const prev = S.voci.filter(v => !v.fatto).reduce((a, v) => a + v.min, 0);
  document.getElementById('tot').innerHTML = `studiato <b>${fmtMin(tot / 60e3)}</b>${prev ? ` su ${fmtMin(prev)} previsti` : ''}`;
}
setInterval(() => { if (document.visibilityState === 'visible' && S.voci) aggiorna(); }, 1000);
document.addEventListener('visibilitychange', () => {
  // Rientrando dopo mezzanotte il piano è un altro.
  if (document.visibilityState === 'visible' && S.giorno && S.giorno !== iso(oggi())) carica();
});

let audio;
function bip() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => { const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .15); });
  } catch (e) {}
}

// ── Cronometro: una sessione aperta alla volta ───────────────────────────
let lavoro = Promise.resolve();
const inFila = f => (lavoro = lavoro.then(f, f));

async function chiudi() {
  const s = S.aperta; if (!s) return;
  S.aperta = null;
  const fine = new Date().toISOString();
  S.sessioni.push({ ...s, fine });
  if (s.id) await SC.db(`sc_sessioni?id=eq.${s.id}`, { method: 'PATCH', body: { fine }, prefer: 'return=minimal' })
    .catch(e => toast('Tempo non salvato: ' + e.message));
}
async function apri(tipo, rif, titolo) {
  const s = { tipo, rif: rif || null, titolo, giorno: iso(oggi()), inizio: new Date().toISOString(), fine: null };
  S.aperta = s;
  try { const [r] = await SC.db('sc_sessioni', { method: 'POST', body: s }); if (S.aperta === s) s.id = r.id; else if (r) await SC.db(`sc_sessioni?id=eq.${r.id}`, { method: 'PATCH', body: { fine: new Date().toISOString() }, prefer: 'return=minimal' }); }
  catch (e) { toast('Tempo non salvato: ' + e.message); }
}
function tocca(tipo, rif, titolo) {
  if (audio && audio.state === 'suspended') audio.resume();
  const stessa = S.aperta && chiave(S.aperta.tipo, S.aperta.rif) === chiave(tipo, rif);
  inFila(async () => { await chiudi(); if (!stessa) await apri(tipo, rif, titolo); aggiorna(); });
  // Risposta immediata a schermo, prima della rete.
  aggiorna();
}

// Tempo finito: si salva il tempo e si va alla voce (stesse ancore del calendario).
function finito(v) {
  bip();
  toast(`Tempo finito per «${v.titolo}»: ti porto ${v.tipo === 'compito' ? 'ai compiti' : 'alle verifiche'} per spuntarlo.`);
  const dove = v.tipo === 'compito' ? `compiti-ada.html#c-${iso(oggi())}-${v.rif}` : `verifiche-ada.html#arg-${v.rif}`;
  inFila(async () => { await chiudi(); aggiorna(); }).then(() => setTimeout(() => { location.href = dove; }, 2500));
}

document.addEventListener('click', e => {
  const z = e.target.closest('.z');
  if (z) { const v = S.voci[z.dataset.i]; tocca(v.tipo, v.rif, v.titolo); return; }
  if (e.target.closest('#pausa')) { tocca('pausa', null, 'Pausa'); return; }
  if (e.target.closest('#stop')) { inFila(async () => { await chiudi(); aggiorna(); }); aggiorna(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('z')) { e.preventDefault(); e.target.click(); } });

SC.avvia('studio-ada.html', carica);
</script>
