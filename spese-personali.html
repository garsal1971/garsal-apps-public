// Modifica di una regola. Il campo mostra in tempo reale quanti movimenti in archivio
// aggancerebbe: accorciare "AMAZON.IT *MK7HG2LO3" a "AMAZON.IT" è utile solo se si vede subito
// che passa da 1 a 14, e che non sta agganciando mezzo estratto conto.
function openMerchantModal(id = null) {
  // Senza id è una regola nuova, scritta a mano da Attribuzione: stesso form, stesso conteggio
  // dal vivo. È l'unico modo per scrivere una regola prima di avere il movimento che la insegna.
  const rule = id ? S.merchants.find(m => m.id === id) : null;
  if (id && !rule) return;
  // Una regola non cambia elenco: quello di una che esiste è il suo, quello di una nuova è
  // l'elenco aperto. Spostarla vorrebbe dire una chiave scritta per una fonte messa a valere
  // su descrizioni fatte in un altro modo, cioè una regola che non aggancia più niente.
  const fonte = rule ? (rule.source || 'bank') : S.ruleSource;
  openModal(rule ? 'Modifica regola' : `Nuova regola ${labelSource(fonte)}`, `
    <form id="modal-form">
      <div class="form-group">
        <label class="form-label">Se la descrizione contiene… *</label>
        <input name="key" id="rule-key" class="form-input mono" required value="${esc(rule?.merchant_key || '')}" placeholder="es. ESSELUNGA" />
        <p class="import-note mt-8">Elenco <strong>${labelSource(fonte)}</strong>: vale solo sui movimenti arrivati da questa fonte.
        Jolly <span class="mono">%</span> = qualsiasi cosa, come nel <span class="mono">LIKE</span> di SQL.</p>
        <p class="import-note mt-8" id="rule-count"></p>
      </div>
      <div class="form-group">
        <label class="form-label">Categoria *</label>
        <select name="category_id" class="form-input form-select" required>${catOptions(rule?.category_id || '', '— scegli —')}</select>
      </div>
      <p class="import-note">La regola vale sui movimenti <strong>senza categoria</strong>: quelli che hai già categorizzato
      a mano restano come sono.</p>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-action="close-modal">Annulla</button>
        <button type="submit" class="btn btn-primary">${rule ? 'Salva' : 'Crea'}</button>
      </div>
    </form>
  `);
  const input = $('rule-key');
  const info = $('rule-count');
  const refresh = () => {
    const k = input.value.trim().toUpperCase();
    if (pesoRegola(k) < 3) { info.innerHTML = '<span style="color:var(--c-warning)">⚠️ Servono almeno 3 caratteri veri (il jolly % non conta): una regola più corta aggancia troppo.</span>'; return; }
    const n = merchantMatchCount(k, fonte);
    const senzaCat = S.transactions.filter(t => !t.category_id && sourceOf(t) === fonte && regolaAggancia(k, normalizeMerchant(t.description))).length;
    info.textContent = `Aggancia ${n} movimenti ${labelSource(fonte)}${senzaCat ? ` (${senzaCat} ancora senza categoria)` : ''}.`;
  };
  input.addEventListener('input', refresh);
  refresh();

  $('modal-form').addEventListener('submit', async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const key = (d.key || '').trim().toUpperCase();
    if (pesoRegola(key) < 3) { alert('La regola deve avere almeno 3 caratteri veri: il jolly % non conta.'); return; }
    if (!d.category_id) { alert('Scegli una categoria.'); return; }
    try {
      let id = rule?.id;
      if (rule) {
        await sbUpd('sal_merchant_map', `id=eq.${rule.id}`, { merchant_key: key, category_id: d.category_id, updated_at: new Date().toISOString() });
      } else {
        id = (await saveMerchantRule(key, d.category_id, fonte))?.id;
      }
      closeModal();
      await loadData();
      const n = id ? await applyLearnedMerchants(id) : 0;
      if (n) showToast(`✨ ${plur(n, 'Categorizzato 1 movimento', 'Categorizzati {n} movimenti')} con la regola ${rule ? 'aggiornata' : 'nuova'}`);
      render();
    } catch (err) {
      alert(/duplicate|uq_sal_merchant_map/i.test(err.message)
        ? `Esiste già una regola «${key}» nell'elenco ${labelSource(fonte)}. Modifica quella, o cancella questa.`
        : 'Errore: ' + err.message);
    }
  });
}

/* ── Nuova voce al volo, dal movimento ──────────────────────── */
// «➕ Nuova voce…» nella tendina di un movimento: si crea la voce e, nella stessa finestra, si
// scrive la regola che d'ora in poi ci manderà i movimenti dello stesso negozio. Le due cose
// nascono insieme perché è lì che si sa qual è il negozio: creare la voce da Categorie e poi
// tornare sul movimento significa scrivere la regola a memoria, o non scriverla affatto.
// La chiave è quella che si imparerebbe da sola (la descrizione intera normalizzata), ma qui è
// modificabile subito — con il conteggio di quanti movimenti aggancia, come in Modifica regola.
function nuovaVoceFormHtml(descrizione, source = 'bank') {
  return `
    <form id="newcat-form">
      <p class="import-note">Movimento: <strong>${esc(merchantText(descrizione))}</strong></p>
      <div class="form-group mt-12">
        <label class="form-label">Nome della voce *</label>
        <input name="name" id="newcat-name" class="form-input" required placeholder="es. Ristoranti" />
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label">Icona</label>
          <input name="icon" class="form-input" placeholder="es. 🍝" maxlength="4" />
        </div>
        <div class="form-group">
          <label class="form-label">Super-categoria</label>
          <select name="super_id" class="form-input form-select">${superOptions('')}</select>
        </div>
      </div>
      <div class="form-group">
        <label class="hstack gap-8 text-sm"><input type="checkbox" id="newcat-with-rule" checked /> Impara anche la regola (elenco <strong>${labelSource(source)}</strong>): se la descrizione contiene…</label>
        <input id="newcat-key" class="form-input mono mt-8" value="${esc(normalizeMerchant(descrizione))}" />
        <p class="import-note mt-8">Accorciala al nome del negozio; <span class="mono">%</span> è il jolly.</p>
        <p class="import-note mt-8" id="newcat-count"></p>
      </div>
      <p class="import-note">Il colore della voce è quello della sua super-categoria.</p>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="newcat-cancel">Annulla</button>
        <button type="submit" class="btn btn-primary">Crea e assegna</button>
      </div>
    </form>`;
}

// onDone riceve la voce creata e la regola scritta (null se la spunta era tolta): cosa farne
// cambia fra la lista movimenti e l'anteprima di import, ed è il chiamante a saperlo.
function wireNuovaVoceForm({ onDone, onCancel, source = 'bank' }) {
  const form = $('newcat-form');
  const keyInput = $('newcat-key');
  const chk = $('newcat-with-rule');
  const info = $('newcat-count');

  const refresh = () => {
    keyInput.disabled = !chk.checked;
    if (!chk.checked) { info.textContent = 'Senza regola: la voce vale solo per questo movimento.'; return; }
    const k = keyInput.value.trim().toUpperCase();
    if (pesoRegola(k) < 3) { info.innerHTML = '<span style="color:var(--c-warning)">⚠️ Servono almeno 3 caratteri veri (il jolly % non conta): una regola più corta aggancia troppo.</span>'; return; }
    const n = merchantMatchCount(k, source);
    const senzaCat = S.transactions.filter(t => !t.category_id && sourceOf(t) === source && regolaAggancia(k, normalizeMerchant(t.description))).length;
    info.textContent = `Aggancia ${n} movimenti ${labelSource(source)}${senzaCat ? ` (${senzaCat} ancora senza categoria)` : ''}.`;
  };
  keyInput.addEventListener('input', refresh);
  chk.addEventListener('change', refresh);
  refresh();
  $('newcat-name').focus();
  $('newcat-cancel').addEventListener('click', () => onCancel && onCancel());

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const name = (d.name || '').trim();
    if (!name) return;
    const key = chk.checked ? keyInput.value.trim().toUpperCase() : '';
    if (chk.checked && key.length < 3) { alert('La regola deve avere almeno 3 caratteri veri (il jolly % non conta), oppure togli la spunta.'); return; }
    // Stessa chiave di una regola che c'è già: il salvataggio la riscriverebbe in silenzio sulla
    // voce nuova. Si può fare — è quello che uno vuole quando corregge — ma va detto prima.
    const esistente = key && S.merchants.find(x => x.merchant_key === key && (x.source || 'bank') === source);
    if (esistente && !confirm(`Esiste già una regola «${key}», che manda a «${catById(esistente.category_id)?.name || '—'}».\n\nLa faccio puntare alla voce nuova?`)) return;
    const submit = form.querySelector('button[type="submit"]');
    submit.disabled = true;
    try {
      const [cat] = await sbIns('sal_categories', {
        user_id: S.session.user.id,
        name,
        icon: (d.icon || '').trim() || null,
        super_id: d.super_id || null,
      });
      S.categories = await sbQ('sal_categories', 'select=*&order=name.asc');
      const rule = key ? await saveMerchantRule(key, cat.id, source) : null;
      await onDone(cat, rule);
    } catch (err) {
      submit.disabled = false;
      alert(/duplicate|uq_sal_categories/i.test(err.message)
        ? `Esiste già una voce che si chiama «${name}».`
        : 'Errore: ' + err.message);
    }
  });
}

// Dalla lista movimenti: modale a sé, il movimento è già in archivio.
function openNuovaVoceModal(tx) {
  openModal('Nuova voce', nuovaVoceFormHtml(tx.description, sourceOf(tx)));
  wireNuovaVoceForm({
    source: sourceOf(tx),
    onCancel: closeModal,
    onDone: async (cat, rule) => {
      closeModal();
      // Niente popup della regola: l'ha appena scritta l'utente nel form qui sopra.
      await setTxCategory(tx, cat.id);
      const altri = rule ? await applyLearnedMerchants(rule.id) : 0;
      showToast(altri
        ? `✅ Voce «${cat.name}» creata · ✨ ${plur(altri, 'categorizzato un altro movimento', 'categorizzati altri {n} movimenti')}`
        : `✅ Voce «${cat.name}» creata e assegnata`);
      render();
    },
  });
}

// Dall'anteprima di import: niente secondo modale, il form prende il posto dell'elenco e poi
// l'elenco torna. Aprire un modale sopra l'altro qui vorrebbe dire buttare via l'anteprima —
// #modal-body è uno solo — e con lei le spunte e le categorie già scelte.
function openNuovaVoceImport(idx) {
  if (!_import) return;
  syncImportSelections();
  const it = _import.items[idx];
  if (!it) return;
  const indietro = () => {
    $('modal-title').textContent = _import.source === 'excel' ? 'Importa da Excel' : 'Importa dal conto';
    renderImportList(_import.cardFilter);
  };
  $('modal-title').textContent = 'Nuova voce';
  $('modal-body').innerHTML = nuovaVoceFormHtml(it.descrizione, _import.source || 'bank');
  wireNuovaVoceForm({
    source: _import.source || 'bank',
    onCancel: indietro,
    onDone: async (cat, rule) => {
      it.categoryId = cat.id;
      // La regola vale anche per le altre righe dell'anteprima rimaste senza categoria: è lo
      // stesso negozio, e farsele una per una sarebbe assurdo avendo appena scritto la regola.
      if (rule) _import.items.forEach(x => { if (!x.categoryId) x.categoryId = merchantCategory(x.descrizione, _import.source || 'bank'); });
      indietro();
      showToast(`✅ Voce «${cat.name}» creata`);
    },
  });
}

// Le due cancellazioni della zona pericolosa passano dalla stessa finestra: cambia cosa si
// cancella, non il modo in cui lo si conferma. Si fa scrivere CANCELLA invece di un confirm()
// con l'OK a portata di clic: qui non si torna indietro, e premere dev'essere un gesto
// deliberato e non un riflesso.
function openCancellazione({ titolo, riepilogo, etichetta, esegui, fatto }) {
  openModal(titolo, `
    ${riepilogo}
    <p class="import-note mt-8">L'operazione non si può annullare.</p>
    <form id="modal-form" class="mt-12">
      <div class="form-group">
        <label class="form-label">Scrivi CANCELLA per confermare</label>
        <input id="wipe-word" class="form-input mono" autocomplete="off" placeholder="CANCELLA" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-action="close-modal">Annulla</button>
        <button type="submit" class="btn btn-danger" id="wipe-go" disabled>${etichetta}</button>
      </div>
    </form>
  `);
  const parola = $('wipe-word'), go = $('wipe-go');
  const giusta = () => parola.value.trim().toUpperCase() === 'CANCELLA';
  parola.addEventListener('input', () => { go.disabled = !giusta(); });
  parola.focus();
  $('modal-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!giusta()) return;
    go.disabled = true;
    $('modal-body').innerHTML = '<p class="import-note">Cancello…</p>';
    try {
      await esegui();
      closeModal();
      showToast(fatto);
      await reload();
    } catch (err) {
      $('modal-body').innerHTML = `<p class="text-sm neg">Errore: ${esc(err.message)}</p>
        <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
    }
  });
}

/* ── Import dal conto ───────────────────────────────────────────
   enable-banking-transactions legge e basta. Che cosa è "del conto personale" lo decide questa
   pagina: uscite ed entrate — qui il saldo conta, quindi gli accrediti non si buttano via —
   filtrate per carta quando la banca la espone, che su un conto con più carte è l'unico modo per
   non spuntare a mano duecento righe ogni mese. La carta scelta resta nel browser, così il giro
   dopo è già impostata.  */
const CARD_FILTER_KEY = 'sal_card_filter';
let _import = null;

/* ── Doppioni ───────────────────────────────────────────────────
   Lo stesso movimento può entrare da due strade — il conto e il foglio Excel — e le due strade
   non lo scrivono uguale: la banca gli mette accanto l'external_id e cuce nella descrizione il
   nome della controparte, il foglio nessuna delle due cose. Una rete sola non basta, e fino alla
   v1.0.3 non bastava davvero: un movimento già entrato da Excel (external_id NULL) tornava dal
   sync col suo external_id, il controllo guardava solo quello, e la spesa entrava due volte.

   Tre reti, dalla più stretta alla più larga:
     external_id              → la stessa riga della stessa banca. Certezza.
     data + importo + descrizione → la stessa riga arrivata dall'altra strada con lo stesso testo.
     importo + data vicina    → ⚠️ QUI IL TESTO NON ENTRA AFFATTO, ed è voluto: la descrizione è
                                proprio la cosa che le due strade scrivono in modo diverso — la
                                banca ci cuce accanto il nome della controparte, il foglio no —
                                quindi confrontarla non aggiungerebbe niente e toglierebbe
                                aggancio. Restano l'importo, che la stessa spesa ha identico, e la
                                data, che invece balla: il foglio porta la data di registrazione,
                                la banca quella contabile, e su una carta le due si scostano di
                                qualche giorno. Da qui il MARGINE (dupMargine(), 3 giorni di
                                default, si cambia in Impostazioni).
   L'ultima non è una certezza — due spese uguali a pochi giorni di distanza esistono — quindi si
   SEGNALA come sospetta invece di nasconderla, mostrando accanto il movimento in archivio che le
   somiglia e di quanti giorni si scosta: il confronto delle descrizioni lo fa l'occhio, che è
   l'unico che può farlo. In tutt'e tre i casi la riga arriva DESELEZIONATA: qui un doppione
   raddoppia una spesa, e ricontrollare due righe costa meno che accorgersene fra sei mesi. */
const chiaveEsatta = (data, importo, desc) =>
  `${data}|${(+importo).toFixed(2)}|${(desc || '').replace(/\s+/g, ' ').trim().toLowerCase()}`;

// Il margine è una preferenza di lettura, non un dato della contabilità: sta nel browser, come
// il filtro per carta. 0 = solo lo stesso giorno.
const DUP_MARGIN_KEY = 'sal_dup_margin';
const DUP_MARGIN_DEFAULT = 3;
function dupMargine() {
  const n = parseInt(localStorage.getItem(DUP_MARGIN_KEY), 10);
  return isNaN(n) ? DUP_MARGIN_DEFAULT : Math.max(0, Math.min(15, n));
}
// Giorno assoluto, per differenze in giorni che non inciampano nei fusi né nell'ora legale.
const numeroGiorno = d => Math.round(new Date(`${(d || '').slice(0, 10)}T00:00:00Z`).getTime() / 86400000);

function indiceDoppioni() {
  const margine = dupMargine();
  const perExternal = new Set();
  const esatti = new Set();
  const perImporto = new Map();
  S.transactions.forEach(t => {
    if (t.external_id) perExternal.add(t.external_id);
    const d = (t.date || '').slice(0, 10);
    esatti.add(chiaveEsatta(d, t.amount, t.description));
    const k = (+t.amount).toFixed(2);
    if (!perImporto.has(k)) perImporto.set(k, []);
    perImporto.get(k).push(t);
  });
  return (data, importo, descrizione, externalId = null) => {
    if (externalId && perExternal.has(externalId)) return { livello: 'esatto', simile: null, giorni: 0 };
    if (esatti.has(chiaveEsatta(data, importo, descrizione))) return { livello: 'esatto', simile: null, giorni: 0 };
    const g = numeroGiorno(data);
    // Fra più candidati vince il più vicino nel tempo: è quello che ha più probabilità di essere
    // la stessa spesa, ed è quello che ha senso mostrare accanto alla riga.
    const vicini = (perImporto.get((+importo).toFixed(2)) || [])
      .map(t => ({ t, scarto: Math.abs(numeroGiorno(t.date) - g) }))
      .filter(x => x.scarto <= margine)
      .sort((a, b) => a.scarto - b.scarto);
    return vicini.length
      ? { livello: 'sospetto', simile: vicini[0].t, giorni: vicini[0].scarto }
      : { livello: null, simile: null, giorni: 0 };
  };
}

async function readMovements() {
  const bankConnectionId = $('imp-conn').value;
  const dateFrom = $('imp-from').value || undefined;
  const soloUscite = $('imp-solo-uscite').checked;
  $('modal-body').innerHTML = '<p class="import-note">Leggo i movimenti dalla banca…</p>';
  try {
    const res = await sbFn('enable-banking-transactions', { bankConnectionId, dateFrom });
    const tutti = (res.transactions || []).filter(t => t.amount !== 0 && (t.bookingDate || t.valueDate));
    const movimenti = soloUscite ? tutti.filter(t => t.amount < 0) : tutti;
    if (!movimenti.length) {
      $('modal-body').innerHTML = `<p class="text-sm">Nessun movimento nel periodo scelto.</p>
        <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
      return;
    }
    // Rileggere un periodo già letto è la normalità, non l'eccezione — e il periodo può essere
    // già entrato da un foglio Excel, non solo da un sync precedente: vedi indiceDoppioni().
    const doppione = indiceDoppioni();
    const carte = [...new Set(movimenti.map(t => t.card?.identification || cardFromDescription(t.description)).filter(Boolean))].sort();
    const cardFilter = localStorage.getItem(CARD_FILTER_KEY) || '';

    const items = movimenti.map(t => {
      const data = (t.bookingDate || t.valueDate).slice(0, 10);
      const descrizione = [t.description, t.counterpartyName].map(s => (s || '').trim()).filter(Boolean)
        .filter((p, i, arr) => !arr.slice(0, i).some(q => q.toLowerCase().includes(p.toLowerCase())))
        .join(' · ') || t.bankTransactionCode || 'Movimento';
      const dup = doppione(data, t.amount, descrizione, t.externalId);
      return {
        data, descrizione,
        importo: t.amount,
        currency: t.currency || null,
        externalId: t.externalId || null,
        card: t.card?.identification || cardFromDescription(t.description) || null,
        type: t.bankTransactionCode || null,
        categoryId: merchantCategory(descrizione, 'bank'),
        gia: !!dup.livello, dupLivello: dup.livello, dupSimile: dup.simile, dupGiorni: dup.giorni,
        raw: t,
      };
    }).sort((a, b) => a.data.localeCompare(b.data));

    _import = { source: 'bank', items, bankConnectionId, account: res.account, carte, truncated: !!res.truncated };
    renderImportList(cardFilter && carte.includes(cardFilter) ? cardFilter : '');
  } catch (e) {
    $('modal-body').innerHTML = `<p class="text-sm neg">Errore: ${esc(e.message)}</p>
      <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
  }
}

async function confirmImport() {
  if (!_import) return;
  const scelti = [];
  document.querySelectorAll('#modal-body input[data-imp-idx]').forEach(cb => {
    if (!cb.checked) return;
    const i = parseInt(cb.dataset.impIdx, 10);
    const catSel = document.querySelector(`#modal-body [data-imp-cat="${i}"]`);
    scelti.push({ ..._import.items[i], categoryId: catSel ? (catSel.value || null) : _import.items[i].categoryId });
  });
  if (!scelti.length) { alert('Nessun movimento selezionato.'); return; }
  $('modal-body').innerHTML = '<p class="import-note">Importo…</p>';

  const rows = scelti.map(it => ({
    user_id: S.session.user.id,
    bank_connection_id: _import.bankConnectionId || null,
    external_id: it.externalId,
    date: it.data,
    amount: it.importo,
    currency: it.currency,
    description: it.descrizione,
    category_id: it.categoryId,
    card_identification: it.card,
    type: it.type,
    import_source: _import.source || 'bank',
    raw: it.raw,
  }));
  try {
    // ON CONFLICT DO NOTHING sull'indice unico (bank_connection_id, external_id): se una riga è
    // già dentro non entra due volte nemmeno spuntandola per sbaglio.
    const r = await fetch(`${SUPABASE_URL}/rest/v1/sal_transactions?on_conflict=bank_connection_id,external_id`, {
      method: 'POST',
      headers: sbH({ 'Prefer': 'resolution=ignore-duplicates,return=representation' }),
      body: JSON.stringify(rows),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
    const inserted = await r.json();
    // Quello che l'utente ha categorizzato a mano in anteprima diventa una regola: la prossima
    // volta quel negozio si riconosce da solo.
    for (const it of scelti) {
      const fonte = _import.source || 'bank';
      if (it.categoryId && merchantCategory(it.descrizione, fonte) !== it.categoryId) await learnMerchant(it.descrizione, it.categoryId, fonte);
    }
    closeModal();
    alert(`✅ Importazione completata\n\nMovimenti caricati: ${inserted.length}` +
      (inserted.length < scelti.length ? `\nGià presenti, saltati: ${scelti.length - inserted.length}` : ''));
    await loadData();
    // I negozi imparati durante questo import valgono anche per le righe entrate prima che li
    // imparassimo, dentro lo stesso giro.
    const auto = await applyLearnedMerchants();
    if (auto) showToast(`✨ ${plur(auto, 'Categorizzato 1 movimento', 'Categorizzati {n} movimenti')} con i negozi imparati`);
    render();
  } catch (e) {
    $('modal-body').innerHTML = `<p class="text-sm neg">Errore: ${esc(e.message)}</p>
      <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
  }
}

/* ── Import da file Excel ───────────────────────────────────────
   La banca via PSD2 espone solo gli ultimi mesi: per lo storico più vecchio l'unica strada è
   l'estratto conto scaricato dal sito (.xlsx, .xls o .csv). Il file entra nella STESSA anteprima
   dell'import dal conto — spunte, doppioni, categorie, «➕ Nuova voce…», filtro per carta —
   perché quello che si fa dopo aver letto le righe non cambia a seconda di dove sono nate.
   Cambia solo come si leggono, ed è tutto quello che sta qui sotto.

   ⚠️ Un foglio non porta l'external_id, cioè la chiave con cui la banca identifica la riga:
   l'indice unico (bank_connection_id, external_id) quindi non protegge — in Postgres due NULL
   sono distinti — e i doppioni si riconoscono per data + importo + descrizione, come già si fa
   per i movimenti della banca che quella chiave non ce l'hanno. Rileggere due volte lo stesso
   file è la normalità, non l'eccezione.  */

// SheetJS pesa quasi un mega e serve solo a chi apre questa finestra: si carica al primo uso,
// non all'apertura della pagina.
let _xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!_xlsxPromise) {
    _xlsxPromise = new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = () => ok(window.XLSX);
      // Al fallimento si azzera la promessa, altrimenti un buco di rete di un secondo
      // renderebbe l'import impossibile fino al ricarico della pagina.
      s.onerror = () => { _xlsxPromise = null; ko(new Error('Non riesco a caricare il lettore di file Excel: serve la rete.')); };
      document.head.appendChild(s);
    });
  }
  return _xlsxPromise;
}

const normHdr = s => String(s ?? '').toLowerCase().replace(/\s+/g, ' ').trim();

// Un CSV scaricato dalla banca non è quasi mai in UTF-8: UniCredit lo scrive in Windows-1252, e
// letto come UTF-8 «CAFFÈ» diventa illeggibile — il che vuol dire anche una chiave diversa per lo
// stesso negozio. Si prova prima l'UTF-8 in modo severo: se il file non lo è, la decodifica
// fallisce invece di produrre caratteri sbagliati, e si ripiega su Windows-1252.
async function testoDelFile(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('windows-1252').decode(buf); }
}

// L'importo può arrivare come numero (cella numerica) o come testo, e in due notazioni:
// «1.234,56» all'italiana e «1,234.56» all'inglese. A decidere è l'ULTIMO separatore che
// compare — quello è il decimale — invece di dare per scontata la lingua del foglio.
function parseImporto(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').replace(/[€\s ]/g, '').trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }        // (1.234,56) = negativo
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  else if (s.startsWith('+')) s = s.slice(1);
  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if (c > p) s = s.replace(/\./g, '').replace(',', '.');
  else if (p > c) s = s.replace(/,/g, '');
  const n = parseFloat(s);
  if (isNaN(n)) return NaN;
  return neg ? -n : n;
}

// La data è un numero seriale Excel, una Date o una stringa gg/mm/aaaa (o già ISO). Il seriale
// si tronca al giorno prima di convertirlo: con l'ora dentro, un arrotondamento in avanti
// sposterebbe di un giorno i movimenti registrati a fine giornata.
function parseDataCella(v) {
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  }
  // 20000 è il 1954: sotto quella soglia non è una data ma un numero finito lì per sbaglio (un
  // progressivo, un contatore), e convertirlo darebbe un movimento datato 1899 — una riga che
  // nella dashboard si porta dietro un anno intero che non esiste.
  if (typeof v === 'number' && isFinite(v) && v >= 20000) {
    return new Date(Math.floor(v - 25569) * 86400000).toISOString().slice(0, 10);
  }
  const s = String(v ?? '').trim();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[0];
  const it = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
  if (!it) return null;
  const anno = it[3].length === 2 ? '20' + it[3] : it[3];
  return `${anno}-${it[2].padStart(2, '0')}-${it[1].padStart(2, '0')}`;
}

// Le intestazioni non sono nella prima riga: l'estratto conto di UniCredit apre con una decina
// di righe di preambolo (intestatario, IBAN, saldi). Si cerca la riga che porta insieme una data,
// una descrizione e un importo — o la coppia entrate/uscite, che alcune banche usano al posto
// dell'importo con segno.
function trovaIntestazioni(rows) {
  for (let i = 0; i < Math.min(rows.length, 60); i++) {
    const h = (rows[i] || []).map(normHdr);
    if (!h.length) continue;
    const trova = (...test) => h.findIndex(c => c && test.some(t => t(c)));
    const cols = {
      rowIdx: i,
      data: trova(c => /^data (registrazione|contabile|operazione|movimento)/.test(c)),
      descrizione: trova(c => c.includes('descrizione'), c => c.includes('dettagli'), c => c === 'operazione'),
      importo:  trova(c => c.includes('importo')),
      entrate:  trova(c => c.includes('entrate'), c => c.includes('accrediti'), c => c === 'avere'),
      uscite:   trova(c => c.includes('uscite'),  c => c.includes('addebiti'),  c => c === 'dare'),
      causale:  trova(c => c.includes('causale')),
      divisa:   trova(c => c.includes('divisa'), c => c === 'valuta'),
    };
    // Ripiego sulla data valuta solo se non c'è una data di registrazione: sono due date
    // diverse, e quella che conta per l'estratto conto è la prima.
    if (cols.data === -1) cols.data = h.findIndex(c => c.includes('data'));
    const impCol = cols.importo !== -1 ? cols.importo : (cols.entrate !== -1 ? cols.entrate : cols.uscite);
    // Le tre colonne devono anche essere tre colonne DIVERSE. Un CSV col separatore sbagliato
    // finisce tutto in una cella sola, e quella cella contiene per forza «data», «descrizione» e
    // «importo»: senza questo controllo passerebbe per un'intestazione buona e l'import
    // proseguirebbe leggendo spezzoni di riga come importi — plausibili e falsi.
    if (cols.data !== -1 && cols.descrizione !== -1 && impCol !== -1
        && new Set([cols.data, cols.descrizione, impCol]).size === 3) return cols;
  }
  return null;
}

// Dalle righe del foglio ai movimenti dell'anteprima. Sta fuori dalla funzione che disegna il
// modale perché è l'unica parte che può sbagliare in silenzio — una data letta male sposta un
// movimento di un giorno e non se ne accorge nessuno — e così si può provare da sola.
function righeAMovimenti({ rows, cols, name }, { soloUscite = false, fileName = '' } = {}) {
  // Stesso riconoscimento dei doppioni dell'import dal conto: un foglio riletto due volte, ma
  // anche un movimento già entrato dal sync della banca, che qui arriva scritto altrimenti.
  const doppione = indiceDoppioni();
  const cella = (row, i) => (i === -1 ? '' : row[i]);
  const items = [];
  let scartate = 0;

  for (let r = cols.rowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const data = parseDataCella(cella(row, cols.data));
    // Righe senza una data valida: preamboli, totali in fondo, righe vuote. Si contano e basta —
    // dirlo è utile, fermarsi no: un totale in coda non deve far fallire l'import.
    if (!data) { if (row.some(c => String(c ?? '').trim())) scartate++; continue; }

    let importo;
    if (cols.importo !== -1) {
      importo = parseImporto(cella(row, cols.importo));
    } else {
      // Colonne separate: quello che sta in «uscite» è un'uscita anche se scritto senza segno.
      const e = parseImporto(cella(row, cols.entrate));
      const u = parseImporto(cella(row, cols.uscite));
      importo = !isNaN(e) && e !== 0 ? Math.abs(e) : (!isNaN(u) && u !== 0 ? -Math.abs(u) : NaN);
    }
    if (isNaN(importo) || importo === 0) { scartate++; continue; }
    if (soloUscite && importo > 0) continue;

    const causale = String(cella(row, cols.causale) ?? '').replace(/\s+/g, ' ').trim();
    // La descrizione si tiene com'è, senza cucirci davanti la causale: è quella che i negozi
    // imparati leggono, e cambiandola normalizeMerchant darebbe una chiave diversa da quella
    // delle righe entrate dalla banca — lo stesso negozio verrebbe imparato due volte.
    const descrizione = String(cella(row, cols.descrizione) ?? '').replace(/\s+/g, ' ').trim() || causale;
    if (!descrizione) { scartate++; continue; }

    const dup = doppione(data, importo, descrizione);
    items.push({
      data, descrizione, importo,
      currency: String(cella(row, cols.divisa) ?? '').trim() || null,
      externalId: null,
      card: cardFromDescription(descrizione),
      type: causale || null,
      categoryId: merchantCategory(descrizione, 'excel'),
      gia: !!dup.livello, dupLivello: dup.livello, dupSimile: dup.simile, dupGiorni: dup.giorni,
      raw: { source: 'excel', file: fileName, sheet: name, row },
    });
  }

  items.sort((a, b) => a.data.localeCompare(b.data));
  return { items, scartate };
}

async function readExcelFile() {
  const file = $('imp-file')?.files?.[0];
  if (!file) { alert('Scegli prima un file.'); return; }
  const soloUscite = $('imp-solo-uscite').checked;
  $('modal-body').innerHTML = '<p class="import-note">Leggo il file…</p>';
  try {
    const XLSXlib = await loadXLSX();
    // ⚠️ Il CSV va letto diversamente dall'xlsx, e non è un dettaglio: leggendo un CSV SheetJS
    // prova a interpretare i numeri all'americana, e «-12,90» diventa -1290 mentre «1.850,00»
    // diventa 1,85 — importi plausibili e sbagliati, che nessuno vedrebbe in anteprima.
    // raw:true glielo impedisce: i valori restano testo, e a leggerli è parseImporto, che la
    // notazione italiana la conosce. In un xlsx il numero è già un numero e il problema non c'è.
    const wb = /\.(csv|txt)$/i.test(file.name)
      ? XLSXlib.read(await testoDelFile(file), { type: 'string', raw: true })
      : XLSXlib.read(await file.arrayBuffer());

    // Il foglio giusto non è per forza il primo: si prende il primo che ha delle intestazioni
    // riconoscibili, invece di fallire su un foglio di riepilogo messo davanti.
    let foglio = null;
    for (const name of wb.SheetNames) {
      const rows = XLSXlib.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', blankrows: false });
      const cols = trovaIntestazioni(rows);
      if (cols) { foglio = { rows, cols, name }; break; }
    }
    if (!foglio) {
      $('modal-body').innerHTML = `
        <p class="text-sm">Non ho trovato le intestazioni in nessun foglio di <strong>${esc(file.name)}</strong>.</p>
        <p class="import-note mt-8">Cerco una riga che porti insieme una colonna <strong>data</strong>, una
        <strong>descrizione</strong> e un <strong>importo</strong> (o due colonne entrate/uscite). Se il file è stato
        rimaneggiato, rimetti quella riga e riprova.</p>
        <div class="modal-footer"><button class="btn btn-outline" data-action="import-excel">Indietro</button></div>`;
      return;
    }

    const { items, scartate } = righeAMovimenti(foglio, { soloUscite, fileName: file.name });

    if (!items.length) {
      $('modal-body').innerHTML = `
        <p class="text-sm">Nessun movimento utilizzabile in <strong>${esc(file.name)}</strong>${soloUscite ? ' fra le sole uscite' : ''}.</p>
        ${scartate ? `<p class="import-note mt-8">${scartate} righe saltate: senza una data valida o senza importo.</p>` : ''}
        <div class="modal-footer"><button class="btn btn-outline" data-action="import-excel">Indietro</button></div>`;
      return;
    }

    const carte = [...new Set(items.map(it => it.card).filter(Boolean))].sort();
    const cardFilter = localStorage.getItem(CARD_FILTER_KEY) || '';
    _import = { source: 'excel', items, bankConnectionId: null, fileName: file.name, carte, truncated: false, scartate };
    $('modal-title').textContent = 'Importa da Excel';
    renderImportList(cardFilter && carte.includes(cardFilter) ? cardFilter : '');
  } catch (e) {
    console.error('Import Excel:', e);
    $('modal-body').innerHTML = `<p class="text-sm neg">Errore: ${esc(e.message)}</p>
      <div class="modal-footer"><button class="btn btn-outline" data-action="import-excel">Indietro</button></div>`;
  }
}

/* ── Statistica di una categoria ─────────────────────────────────
   Si apre cliccando il nome di una voce (o di una super-categoria) in Categorie. Risponde alla
   domanda che una tabella di totali non risponde: non «quanto ho speso qui», ma «come è andata
   nel tempo» — se una voce sta crescendo, se è stagionale, se è ferma da mesi.

   Due tagli, come si guardano davvero: per ANNO, che dice la tendenza, e per MESE-ANNO, che dice
   quando. Non un taglio per «mese» qualunque: gennaio 2024 e gennaio 2026 sommati sarebbero lo
   stesso errore delle dodici colonne della dashboard con «tutti gli anni» selezionato.

   ⚠️ Questo blocco è identico in spese-ada.html e spese-personali.html — gli importi si leggono
   con due helper locali invece che con quelli della pagina, che nelle due app hanno nomi diversi.
   Se lo modifichi in una, riportalo nell'altra.  */
function openStatCategoria(id, tipo = 'voce') {
  const isSuper = tipo === 'super';
  const nome = isSuper ? (superById(id)?.name || '—') : (catById(id)?.name || '—');
  const icona = (isSuper ? superById(id)?.icon : catById(id)?.icon) || '';
  const colore = isSuper ? (superById(id)?.color || NO_SUPER_COLOR) : colorOfCat(id);
  const txs = S.transactions.filter(t => (isSuper ? catById(t.category_id)?.super_id === id : t.category_id === id));

  const usc = t => (+t.amount < 0 ? -(+t.amount) : 0);
  const ent = t => (+t.amount > 0 ? +t.amount : 0);
  const totU = txs.reduce((s, t) => s + usc(t), 0);
  const totE = txs.reduce((s, t) => s + ent(t), 0);

  if (!txs.length) {
    openModal(`${icona} ${nome}`, `
      <div class="empty-state"><div class="empty-icon">📊</div><p>Nessun movimento in questa ${isSuper ? 'super-categoria' : 'voce'}.</p></div>
      <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`);
    return;
  }

  // Un raggruppamento solo, usato due volte: cambia la chiave, non il conto.
  const raggruppa = chiave => {
    const m = new Map();
    txs.forEach(t => {
      const k = chiave(t);
      if (!m.has(k)) m.set(k, { u: 0, e: 0, n: 0 });
      const r = m.get(k);
      r.u += usc(t); r.e += ent(t); r.n++;
    });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  };
  const perAnno = raggruppa(t => (t.date || '').slice(0, 4));
  const perMese = raggruppa(t => (t.date || '').slice(0, 7));

  const date = txs.map(t => t.date).filter(Boolean).sort();
  const conEntrate = totE > 0;
  // Una voce di sole entrate (uno stipendio, un rimborso) esiste: graficarne la spesa vorrebbe
  // dire disegnare una fila di zeri e chiamarla statistica. In quel caso la serie diventa quella
  // delle entrate — dichiarata nell'etichetta, non scambiata di nascosto.
  const soloEntrate = totU === 0 && conEntrate;
  const valore = v => (soloEntrate ? v.e : v.u);
  const totSerie = soloEntrate ? totE : totU;
  const etichettaSerie = soloEntrate ? 'Entrate' : 'Spesa';
  const media = totSerie / (perMese.length || 1);
  const nomeMese = k => `${MESI[parseInt(k.slice(5, 7), 10) - 1]} ${k.slice(0, 4)}`;

  openModal(`${icona} ${nome}`, `
    <div class="kpi-grid">
      ${soloEntrate ? '' : `<div class="kpi-card"><div class="kpi-label">Spesa totale</div><div class="kpi-value mono neg">${fmtEUR(totU)}</div></div>`}
      ${conEntrate ? `<div class="kpi-card"><div class="kpi-label">Entrate</div><div class="kpi-value mono pos">${fmtEUR(totE)}</div></div>` : ''}
      <div class="kpi-card"><div class="kpi-label">Movimenti</div><div class="kpi-value mono">${txs.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">${soloEntrate ? 'Entrata media' : 'Media al mese'}</div><div class="kpi-value mono">${fmtEUR(media)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Ultimo</div><div class="kpi-value mono" style="font-size:1rem">${fmtDate(date[date.length - 1])}</div></div>
    </div>
    <p class="import-note">Dal ${fmtDate(date[0])} a oggi, su ${plur(perMese.length, '1 mese', '{n} mesi')} con movimenti.
    La media al mese conta i soli mesi in cui questa ${isSuper ? 'super-categoria' : 'voce'} è comparsa, non tutti quelli del calendario.</p>

    <div class="card mt-12" style="box-shadow:none">
      <div class="card-title">Per anno</div>
      <div class="chart-wrap"><canvas id="stat-anni"></canvas></div>
      <div class="table-wrap mt-12"><table class="table">
        <thead><tr><th>Anno</th><th class="text-right">Movimenti</th>${soloEntrate ? '' : '<th class="text-right">Spesa</th>'}${conEntrate ? '<th class="text-right">Entrate</th>' : ''}<th class="text-right">% del totale</th></tr></thead>
        <tbody>${perAnno.map(([k, v]) => `<tr>
          <td class="mono">${k}</td>
          <td class="text-right mono text-muted">${v.n}</td>
          ${soloEntrate ? '' : `<td class="text-right mono fw-600">${fmtEUR(v.u)}</td>`}
          ${conEntrate ? `<td class="text-right mono pos">${v.e ? fmtEUR(v.e) : '—'}</td>` : ''}
          <td class="text-right mono text-muted">${totSerie ? Math.round(valore(v) / totSerie * 100) : 0}%</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="card" style="box-shadow:none">
      <div class="card-title">Per mese</div>
      <div class="chart-wrap"><canvas id="stat-mesi"></canvas></div>
      <div class="table-wrap mt-12" style="max-height:34vh;overflow-y:auto"><table class="table">
        <thead><tr><th>Mese</th><th class="text-right">Movimenti</th>${soloEntrate ? '' : '<th class="text-right">Spesa</th>'}${conEntrate ? '<th class="text-right">Entrate</th>' : ''}</tr></thead>
        <tbody>${perMese.slice().reverse().map(([k, v]) => `<tr>
          <td>${nomeMese(k)}</td>
          <td class="text-right mono text-muted">${v.n}</td>
          ${soloEntrate ? '' : `<td class="text-right mono fw-600">${fmtEUR(v.u)}</td>`}
          ${conEntrate ? `<td class="text-right mono pos">${v.e ? fmtEUR(v.e) : '—'}</td>` : ''}
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="import-note mt-8">I mesi senza nemmeno un movimento non compaiono: qui si guarda quando si è speso,
      e una fila di zeri direbbe soltanto che il calendario ha dodici mesi.</p>
    </div>

    <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>
  `, true);

  const barre = (id, etichette, valori) => drawChart(id, {
    type: 'bar',
    data: { labels: etichette, datasets: [{ label: etichettaSerie, data: valori.map(v => Math.round(v * 100) / 100), backgroundColor: colore + 'b0', borderColor: colore, borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => '€' + v.toLocaleString('it-IT') } } },
    },
  });
  barre('stat-anni', perAnno.map(([k]) => k), perAnno.map(([, v]) => valore(v)));
  barre('stat-mesi', perMese.map(([k]) => nomeMese(k)), perMese.map(([, v]) => valore(v)));
}

/* ── Modale ─────────────────────────────────────────────────── */
function openModal(title, bodyHtml, wide = false) {
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-card').classList.toggle('modal-wide', wide);
  $('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  $('modal-overlay').classList.add('hidden');
  $('modal-card').classList.remove('modal-wide');
  $('modal-body').innerHTML = '';
  _import = null;
}

/* ── Nav / render ───────────────────────────────────────────── */
function navigate(view) {
  S.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
  $(`view-${view}`)?.classList.add('active');
  document.querySelector(`.nav-item[data-view="${view}"]`)?.classList.add('active');
  $('sidebar')?.classList.remove('open');
  $('mobile-nav-overlay')?.classList.remove('open');
  history.pushState({ view }, '');
  render();
}
window.addEventListener('popstate', e => {
  if (!e.state) return;
  S.view = e.state.view || 'dashboard';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
  $(`view-${S.view}`)?.classList.add('active');
  document.querySelector(`.nav-item[data-view="${S.view}"]`)?.classList.add('active');
  render();
});

function render() {
  switch (S.view) {
    case 'dashboard': renderDashboard(); break;
    case 'transazioni': renderTransazioni(); break;
    case 'categorie': renderCategorie(); break;
    case 'regole': renderRegole(); break;
    case 'impostazioni': renderImpostazioni(); break;
  }
  // La versione nella barra in fondo la scrive APP_VERSION e non l'HTML: scritta a mano restava
  // indietro di una release senza che si vedesse da nessuna parte.
  $('footer-version').textContent = APP_VERSION;
  $('footer-info').textContent = `${S.transactions.length} movimenti · ${S.supers.length} super · ${S.categories.length} voci`;
}

async function reload() {
  await loadData();
  render();
}

/* ── Eventi ─────────────────────────────────────────────────── */
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'nav') navigate(btn.dataset.view);
  else if (action === 'close-modal') closeModal();
  else if (action === 'import') openImport();
  else if (action === 'assegna-massa') openAssegnaMassa();
  else if (action === 'stat-cat') openStatCategoria(btn.dataset.id, btn.dataset.tipo || 'voce');
  else if (action === 'import-excel') openExcelImport();
  else if (action === 'imp-read') readMovements();
  else if (action === 'imp-read-file') readExcelFile();
  else if (action === 'imp-confirm') confirmImport();
  else if (action === 'imp-all' || action === 'imp-none') {
    document.querySelectorAll('#modal-body input[data-imp-idx]').forEach(cb => { cb.checked = action === 'imp-all'; });
  } else if (action === 'apply-rules') {
    try {
      const n = await applyLearnedMerchants();
      showToast(n ? `✨ ${plur(n, 'Categorizzato 1 movimento', 'Categorizzati {n} movimenti')}` : 'Nessun movimento da categorizzare con i negozi imparati');
      render();
    } catch (err) { alert('Errore: ' + err.message); }
  } else if (action === 'new-cat') openCatModal();
  else if (action === 'edit-cat') openCatModal(btn.dataset.id);
  else if (action === 'new-super') openSuperModal();
  else if (action === 'edit-super') openSuperModal(btn.dataset.id);
  else if (action === 'del-super') {
    const s = superById(btn.dataset.id);
    const voci = S.categories.filter(c => c.super_id === btn.dataset.id).length;
    if (!confirm(`Eliminare la super-categoria «${s?.name}»?`
      + (voci ? `\n\n${voci} voci restano, senza super-categoria: nessun movimento perde la sua voce.` : ''))) return;
    try { await sbDel('sal_super_categories', `id=eq.${btn.dataset.id}`); await reload(); }
    catch (err) { alert('Errore: ' + err.message); }
  }
  else if (action === 'del-cat') {
    const c = catById(btn.dataset.id);
    const uso = S.transactions.filter(t => t.category_id === btn.dataset.id).length;
    if (!confirm(`Eliminare la voce «${c?.name}»?` + (uso ? `\n\n${uso} movimenti resteranno senza categoria.` : ''))) return;
    try { await sbDel('sal_categories', `id=eq.${btn.dataset.id}`); await reload(); }
    catch (err) { alert('Errore: ' + err.message); }
  } else if (action === 'edit-merchant') {
    openMerchantModal(btn.dataset.id);
  } else if (action === 'rule-source') {
    S.ruleSource = btn.dataset.source;
    renderRegole();
  } else if (action === 'new-merchant') {
    openMerchantModal();
  } else if (action === 'apply-merchant') {
    try {
      const n = await applyLearnedMerchants(btn.dataset.id);
      showToast(n ? `✨ ${plur(n, 'Categorizzato 1 movimento', 'Categorizzati {n} movimenti')}` : 'Nessun movimento senza categoria per questa regola');
      render();
    } catch (err) { alert('Errore: ' + err.message); }
  } else if (action === 'align-merchant') {
    // Riallineare tocca movimenti già categorizzati, che le regole non toccano mai da sole:
    // è un'eccezione chiesta a mano, quindi si dice esattamente quanti e verso dove.
    const rule = S.merchants.find(m => m.id === btn.dataset.id);
    if (!rule) return;
    const { conflitti } = regolaStats(rule);
    if (!conflitti.length) return;
    if (!confirm(`${conflitti.length} movimenti che questa regola vince hanno un'altra categoria, messa a mano.\n\n`
      + `Li sposto tutti su «${catById(rule.category_id)?.name || '—'}»?`)) return;
    try {
      await sbUpd('sal_transactions', `id=in.(${conflitti.map(t => t.id).join(',')})`, { category_id: rule.category_id });
      showToast(`⚖️ ${plur(conflitti.length, 'Riallineato 1 movimento', 'Riallineati {n} movimenti')}`);
      await reload();
    } catch (err) { alert('Errore: ' + err.message); }
  } else if (action === 'del-merchant') {
    const rule = S.merchants.find(m => m.id === btn.dataset.id);
    const st = rule ? regolaStats(rule) : null;
    if (!confirm(`Dimenticare la regola «${rule?.merchant_key}»?`
      + (st?.vince ? `\n\n${st.vince} movimenti la stanno usando: quelli già categorizzati restano come sono, ma i prossimi movimenti di questo negozio arriveranno senza categoria.` : ''))) return;
    try { await sbDel('sal_merchant_map', `id=eq.${btn.dataset.id}`); await reload(); }
    catch (err) { alert('Errore: ' + err.message); }
  } else if (action === 'wipe-tx') {
    openWipeModal();
  } else if (action === 'wipe-rules') {
    openWipeRulesModal(btn.dataset.source);
  } else if (action === 'del-tx') {
    if (!confirm('Eliminare questo movimento?')) return;
    try { await sbDel('sal_transactions', `id=eq.${btn.dataset.id}`); await reload(); }
    catch (err) { alert('Errore: ' + err.message); }
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches('[data-action="year-filter"]')) {
    S.selectedYear = el.value === '' ? '' : parseInt(el.value, 10);
    render();
  } else if (el.matches('[data-action="dup-margin"]')) {
    localStorage.setItem(DUP_MARGIN_KEY, el.value);
    showToast(el.value === '0' ? '📅 Doppioni: solo lo stesso giorno' : `📅 Doppioni: ± ${el.value} giorni`);
  } else if (el.matches('[data-filter]')) {
    S.filters[el.dataset.filter] = el.value;
    renderTransazioni();
  } else if (el.matches('[data-filter-rules]')) {
    // Si ridisegna la sola tabella: ridisegnare la pagina svuoterebbe il banco di prova, che è
    // esattamente quello che si sta usando mentre si spulciano le regole.
    S.ruleFilter = el.value;
    renderRegoleTabella();
  } else if (el.matches('[data-set-cat]')) {
    const tx = S.transactions.find(t => t.id === el.dataset.setCat);
    if (!tx) return;
    if (el.value === NEW_CAT_OPTION) {
      // La tendina torna com'era: la voce non esiste ancora, e se si annulla il movimento non
      // deve restare con «➕ Nuova voce…» selezionato.
      el.value = tx.category_id || '';
      openNuovaVoceModal(tx);
      return;
    }
    try {
      await setTxCategory(tx, el.value || null);
      render();
      // Il popup si apre solo se c'è davvero una regola da scrivere: se una regola manda già
      // questa descrizione in questa categoria non c'è niente da imparare, e chiederlo sarebbe
      // una finestra che si apre per dire «va tutto bene». Togliere la categoria non ne apre
      // nessuna: «senza categoria» non è una regola.
      if (el.value && merchantCategory(tx.description, sourceOf(tx)) !== el.value) openRegolaDaMovimento(tx, el.value);
    } catch (err) { alert('Errore: ' + err.message); }
  } else if (el.matches('[data-imp-cat]')) {
    const it = _import?.items[parseInt(el.dataset.impCat, 10)];
    if (!it) return;
    if (el.value === NEW_CAT_OPTION) {
      el.value = it.categoryId || '';
      openNuovaVoceImport(parseInt(el.dataset.impCat, 10));
      return;
    }
    it.categoryId = el.value || null;
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-filter="testo"]')) {
    S.filters.testo = e.target.value;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => {
      renderTransazioni();
      const input = document.querySelector('[data-filter="testo"]');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }, 250);
  }
});

});
$('mobile-nav-overlay').addEventListener('click', () => {

/* ── Avvio ──────────────────────────────────────────────────── */
async function init() {
  let session = null;
  const sbToken = localStorage.getItem('sb_token');
  if (sbToken) session = await initFromSbToken(sbToken);
  if (!session) {
    session = loadSession();
    if (session && session.expires_at < Date.now()) session = await refreshSession(session);
  }
  if (!session) { location.href = 'finanza.html'; return; }
  S.session = session;

  const _authChannel = new BroadcastChannel('appsphere_auth');
  _authChannel.onmessage = ev => {
    if (!ev.data) return;
    if (ev.data.type === 'LOGOUT') { localStorage.removeItem('sb_token'); location.href = 'finanza.html'; }
    else if (ev.data.type === 'TOKEN_REFRESH' && ev.data.sbToken) {
      localStorage.setItem('sb_token', ev.data.sbToken);
      if (S.session) S.session.access_token = ev.data.sbToken;
    }
  };

  try {
    await loadData();
  } catch (err) {
    console.error('Errore caricamento dati:', err);
    alert('Errore nel caricamento dei dati: ' + err.message);
  }

  $('screen-app').style.display = 'flex';
  $('loading-overlay').classList.add('hidden');
  navigate('dashboard');
  history.replaceState({ view: 'dashboard' }, '');
}

init();

/* ── Il tasto «indietro» di Android e i popup ──────────────────────────────
   ⚠️ Dentro un popup l'indietro usciva dalla PAGINA: la WebView non ha niente in cronologia,
   quindi tornava ad AppSphere buttando via quel che si stava scrivendo. Un popup non è una
   pagina, ma su Android deve comportarsi come tale — l'indietro è il gesto con cui si chiude
   qualunque cosa si sia aperta.

   Aprendo un popup si spinge una voce di cronologia; l'indietro la consuma e qui sotto si chiude
   il popup invece di lasciare la pagina. Chiudendolo col ✕ la voce si consuma da sé, o ogni
   apri-e-chiudi ne lascerebbe una dietro e dopo cinque popup servirebbero cinque indietro per
   uscire.

   ⚠️ L'apertura NON si intercetta avvolgendo le funzioni che aprono i popup: in queste pagine
   sono decine, alcune sono `onclick` scritti nell'HTML e altre non hanno nemmeno un nome. Si
   guarda invece quando l'overlay diventa visibile — l'unica cosa che tutti i popup hanno in
   comune, comunque siano stati aperti — e si riconosce dallo stile calcolato, non dal nome della
   classe, che in queste pagine è ora `hidden`, ora `active`, ora `open`.

   ⚠️ La voce si spinge UNA SOLA VOLTA anche con più popup aperti uno sopra l'altro: sono
   contenuti nella stessa finestra, non schermate, e due voci vorrebbero dire due indietro per
   chiudere una cosa sola. L'indietro chiude l'ultimo aperto.

   ⚠️ Il consumo controlla `history.state`: se nel frattempo la pagina ha spinto una voce sua (un
   cambio di vista) la nostra non è più in cima, e un `history.back()` cieco tornerebbe indietro
   di una schermata invece di togliere la voce del popup.

   ⚠️ Questo blocco è UGUALE in tutte le app della suite: se lo correggi qui, portalo anche
   nelle altre (l'elenco dei popup è l'unica cosa che cambia). */
(function guardiaIndietroPopup(elenco) {
  const visibile = el => el && getComputedStyle(el).display !== 'none';
  const aperti = () => elenco.flatMap(p =>
    [...document.querySelectorAll(p.sel)].filter(visibile).map(el => ({ el, chiudi: p.chiudi })));

  let spinta = false;

  function controlla() {
    const n = aperti().length;
    if (n && !spinta) { spinta = true; history.pushState({ __popup: true }, ''); }
    else if (!n && spinta) {
      spinta = false;
      if (history.state && history.state.__popup) history.back();
    }
  }

  function avvia() {
    const osservatore = new MutationObserver(controlla);
    elenco.forEach(p => document.querySelectorAll(p.sel).forEach(el =>
      osservatore.observe(el, { attributes: true, attributeFilter: ['class', 'style'] })));
    controlla();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia);
  else avvia();

  window.addEventListener('popstate', () => {
    const a = aperti();
    if (!a.length) return;          // nessun popup: l'indietro fa quel che ha sempre fatto
    spinta = false;
    const ultimo = a[a.length - 1];
    try { ultimo.chiudi(ultimo.el); } catch (err) { console.warn('indietro:', err); }
  });
})([
  { sel: '#modal-overlay', chiudi: () => closeModal() },
]);
</script>
