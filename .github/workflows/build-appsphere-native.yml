name: Build AppSphere Native APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'android-app/appsphere-native/**'
      - '.github/workflows/build-appsphere-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort | tail -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>&1 || true
          fi

      - name: Prepara keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
              > android-app/appsphere-native/an.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
            echo "✅ Keystore dai secrets — firma stabile, gli aggiornamenti si installano sopra"
          else
            KS_PASS="AppSphereNative2026"
            keytool -genkeypair -v \
              -keystore android-app/appsphere-native/an.keystore \
              -alias appspherenative \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=AppSphereNative, O=Garsal, C=IT"
            echo "KEYSTORE_PASSWORD=$KS_PASS"    >> $GITHUB_ENV
            echo "KEY_ALIAS=appspherenative"     >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KS_PASS"         >> $GITHUB_ENV
            echo "⚠️  KEYSTORE_BASE64 non configurato: keystore usa-e-getta, ogni aggiornamento richiederà di disinstallare l'APK precedente. Configura i 4 secrets condivisi (già usati da GarsalApps/SmartBlocker) per una firma stabile."
          fi

      - name: Make gradlew executable
        run: chmod +x android-app/appsphere-native/gradlew

      - name: Build APK release
        working-directory: android-app/appsphere-native
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android-app/appsphere-native/an.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Salva APK e versione
        run: |
          VERSION=$(grep versionName android-app/appsphere-native/app/build.gradle \
            | grep -o '"[^"]*"' | tr -d '"' | head -1)
          VERSION_CODE=$(grep versionCode android-app/appsphere-native/app/build.gradle \
            | grep -o '[0-9]\+' | head -1)
          cp android-app/appsphere-native/app/build/outputs/apk/release/app-release.apk \
            /tmp/AppSphereNative-latest.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      # Il peso è una cosa da guardare, non da scoprire dopo. Un APK gonfio si
      # installa male: la verifica della firma e l'ottimizzazione costano un
      # multiplo del pacchetto, e su un telefono pieno o in risparmio
      # energetico l'installazione fallisce senza spiegare perché. L'impronta
      # serve invece a riconoscere un download incompleto.
      - name: Peso e impronta dell'APK
        run: |
          BYTES=$(stat -c%s /tmp/AppSphereNative-latest.apk)
          MB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1048576}")
          SHA=$(sha256sum /tmp/AppSphereNative-latest.apk | cut -d' ' -f1)
          echo "📦 AppSphereNative v$VERSION — ${MB} MB (${BYTES} byte)"
          echo "🔑 SHA-256: $SHA"
          echo "--- le voci più pesanti dentro l'APK ---"
          unzip -l /tmp/AppSphereNative-latest.apk | sort -rn -k1 | head -8
          if [ "$BYTES" -gt 26214400 ]; then
            echo "::warning::APK oltre i 25 MB (${MB} MB): quasi sempre è una dipendenza che si porta dietro mezzo mondo — la prima da guardare è material-icons-extended."
          fi
          echo "BYTES=$BYTES" >> $GITHUB_ENV
          echo "SHA=$SHA"     >> $GITHUB_ENV

      # Il nome del file è fisso (`-latest.apk`), quindi da fuori un APK vale
      # l'altro: chi lo scarica non ha modo di sapere se sta prendendo la build
      # di prima o quella appena pubblicata. È già costato un giro — la 1.0.4
      # scaricata al posto della 1.0.5 si comportava esattamente come il difetto
      # che la 1.0.5 aveva appena chiuso. Questo file dice cosa c'è dentro
      # quello lì accanto, e `comandi.html` lo mostra sul pulsante.
      - name: Scheda della build
        run: |
          cat > /tmp/AppSphereNative-latest.json <<EOF
          {
            "app": "AppSphere nativa",
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$GITHUB_SHA",
            "bytes": $BYTES,
            "sha256": "$SHA"
          }
          EOF
          cat /tmp/AppSphereNative-latest.json

      # ⚠️ L'APK NON si carica più come artifact di Actions (20 settembre 2026).
      # Era una TERZA copia — le due che contano sono R2 (da cui si scarica) e
      # il commit su master (da cui si legge in archivio) — durava 30 giorni e
      # non la scaricava nessuno. Da quando la repo è privata lo spazio degli
      # artifact è contato, si è riempito, e `upload-artifact` ha cominciato a
      # rispondere «Artifact storage quota has been hit» facendo morire il job:
      # stando PRIMA del caricamento su R2 e del commit, si portava dietro
      # tutt'e due — l'APK compilata restava non pubblicata e la scheda
      # `-latest.json` continuava ad annunciare la versione di prima.
      # ⚠️ Prima su R2, poi il commit — è lo stesso ordine di «prima Drive,
      # poi la riga» del Forziere: il commit pubblica la scheda
      # `-latest.json`, che ANNUNCIA questa versione, e annunciarla prima che
      # il pacchetto sia scaricabile vuol dire un aggiornamento che si offre
      # e poi dà 404. Le APK non stanno più sul sito: Cloudflare Pages
      # rifiuta i file oltre i 25 MiB (vedi `scripts/build-sito.sh`).
      - name: Carica l'APK su R2 (apk.garsal.men)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/apk-su-r2.sh /tmp/AppSphereNative-latest.apk

      - name: Pubblica APK su master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ⚠️ Il push su master va rifatto se master si muove sotto i piedi.
          # Le build Android della repo scattano insieme (toccare settings.gradle o
          # il build.gradle di root le sveglia tutte) e finiscono a pochi secondi
          # l'una dall'altra: la prima che arriva sposta master e le altre si
          # prendono un "cannot lock ref", con l'APK già compilato e buttato via.
          # Si rilegge master e si riprova.
          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            git reset --hard origin/master

            mkdir -p releases
            cp /tmp/AppSphereNative-latest.apk releases/AppSphereNative-latest.apk

            # La scheda si aggiorna solo se si aggiorna l'APK: `builtAt` cambia a
            # ogni run, e commetterla da sola vorrebbe dire annunciare una build
            # nuova per un pacchetto identico a quello di prima.
            git add releases/AppSphereNative-latest.apk
            if git diff --staged --quiet && [ -f releases/AppSphereNative-latest.json ]; then
              echo "APK non cambiato, skip commit"
              exit 0
            fi

            cp /tmp/AppSphereNative-latest.json releases/AppSphereNative-latest.json
            git add releases/AppSphereNative-latest.json

            git commit -m "build: aggiorna AppSphereNative APK v${{ env.VERSION }} [skip actions]"
            if git push origin master; then
              echo "✅ pubblicati al tentativo $i"
              exit 0
            fi

            echo "⚠️  master si è mosso, riprovo ($i/5)"
            sleep $((i * 5))
          done

          echo "❌ master continua a muoversi: APK non pubblicato"
          exit 1
