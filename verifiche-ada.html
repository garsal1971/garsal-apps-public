<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verifiche di Ada v2.4.1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica — prossima verifica in evidenza, elenco per data, form per aggiungere */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1b2333; --muted:#5d6779; --line:#dde2ea; --accent:#2f5bd3; --on-accent:#ffffff; --ok:#2e8b57; --danger:#c0392b;
  --compito:#2f5bd3; --interr:#c4527a; --soon:#b36b0a;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f; --ok:#5cc48a; --danger:#ef7a6b;
  --compito:#7d9ff0; --interr:#e88aaa; --soon:#e5a84a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f; --ok:#5cc48a; --danger:#ef7a6b; --compito:#7d9ff0; --interr:#e88aaa; --soon:#e5a84a; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.sub a{color:var(--accent)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
section{display:grid;gap:12px}
.next{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;border-left:6px solid var(--accent)}
.next .when{font-family:var(--display);font-size:clamp(24px,6vw,32px);font-weight:800}
.next .what{font-size:17px;font-weight:600}
.next .meta{color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row.past{opacity:.55}
.evid{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;animation:evid 1.2s ease-in-out 3}
@keyframes evid{50%{outline-color:transparent}}

.date{flex:none;min-width:58px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.date b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.date span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info{flex:1;min-width:0}
.info .mat{font-weight:600}
.info .note{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.badge{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.badge.compito{color:var(--compito)}
.badge.interrogazione{color:var(--interr)}
.badge.soon{color:var(--soon)}
.badge.muted{color:var(--muted)}
.del{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;min-width:40px;min-height:40px;padding:0 8px;cursor:pointer;flex:none}
.del.arm{color:var(--danger);border-color:var(--danger)}
form.add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
button.primary{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;justify-self:start;min-height:36px}
.empty,.loading{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none;align-self:flex-start}
.edit{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;min-width:40px;min-height:40px;padding:0 8px;cursor:pointer}
.row{align-items:flex-start}
.argbox{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.argbox>summary{list-style:none;cursor:pointer;padding:8px 10px;display:grid;gap:6px}
.argbox>summary::-webkit-details-marker{display:none}
.argbox>summary .recap{margin-top:0}
.argbox>summary .apri{font-size:12px;color:var(--accent);font-weight:600}
.argbox[open]>summary .apri::before{content:'▾ Chiudi gli argomenti'}
.argbox:not([open])>summary .apri::before{content:'▸ Apri gli argomenti'}
.barre{display:grid;gap:4px}
.barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:12px;color:var(--muted)}
.barra .tr{grid-column:1/-1;grid-row:2;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.barra .tr i{display:block;height:100%;background:var(--ok);border-radius:999px}
.barra b{color:var(--fg);font-variant-numeric:tabular-nums}
.args{display:grid;gap:8px;padding:0 10px 10px}
.arg{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.arg .t{font-weight:500}
.arg .t small{color:var(--muted);font-weight:400}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{font:inherit;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;min-height:34px;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.recap{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.recap b{color:var(--fg);font-variant-numeric:tabular-nums}
.form-args{grid-column:1/-1;display:grid;gap:8px}
.form-args .hd{font-size:13px;color:var(--muted);font-weight:600}
.farg{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem 5.5rem 40px;gap:6px;align-items:end}
@media (max-width:520px){.farg{grid-template-columns:1fr 1fr 40px}.farg .ft{grid-column:1/-1}}
.farg button{font:inherit;min-height:40px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--muted);cursor:pointer}
.form-btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ghost{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.form-recap{grid-column:1/-1;margin:0}
.fin{font:inherit;font-size:12px;font-weight:600;margin-top:8px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;min-height:36px;width:100%;padding:2px 4px;cursor:pointer;line-height:1.2}
.fin.done{border-color:var(--line);color:var(--fg);font-size:14px}
.fin-txt{font-size:13px;color:var(--muted);margin-top:4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:18px;width:min(420px,calc(100% - 32px));box-sizing:border-box}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:14px}
dialog h2{font-size:18px}
.facce{display:flex;gap:8px;flex-wrap:wrap}
.faccia{font:inherit;font-size:30px;line-height:1;background:var(--bg);border:2px solid var(--line);border-radius:12px;min-width:64px;min-height:64px;cursor:pointer;display:grid;place-items:center;gap:2px;padding:6px}
.faccia small{font-size:11px;color:var(--muted)}
.faccia[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <header class="head">
    <div>
      <h1>Verifiche di Ada</h1>
      <p class="sub">Compiti in classe e interrogazioni.</p>
    </div>
  </header>

  <section id="next-wrap"><p class="loading">Carico…</p></section>

  <section>
    <h2>Calendario</h2>
    <div class="list" id="list"></div>
    <button class="toggle" type="button" id="toggle-past" hidden></button>
  </section>

  <section>
    <h2 id="form-title">Aggiungi</h2>
    <form class="add" id="add">
      <label>Data<input type="date" id="f-data" required></label>
      <label>Materia<input id="f-mat" list="materie" placeholder="es. Matematica" required></label>
      <label>Tipo<select id="f-tipo"><option value="compito">Compito</option><option value="interrogazione">Interrogazione</option></select></label>
      <label>Note<input id="f-note" placeholder="facoltative"></label>
      <div class="form-args">
        <div class="hd">Argomenti da studiare</div>
        <div id="f-args"></div>
        <div><button class="ghost" type="button" id="f-add-arg">➕ Argomento</button></div>
      </div>
      <div class="recap form-recap" id="f-recap"></div>
      <div class="form-btns">
        <button class="primary" type="submit" id="f-submit">Aggiungi</button>
        <button class="ghost" type="button" id="f-cancel" hidden>Annulla</button>
      </div>
    </form>
    <datalist id="materie"></datalist>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<dialog id="dlg-fin">
  <form method="dialog" id="fin-form">
    <h2 id="fin-titolo">Finalizza</h2>
    <label>Voto<input id="fin-voto" inputmode="decimal" placeholder="es. 7,5" autocomplete="off"></label>
    <div><div class="eyebrow" style="margin-bottom:6px">Com'è andata la programmazione dello studio?</div>
      <div class="facce" id="fin-facce">
        <button type="button" class="faccia" data-g="triste" aria-pressed="false">😞<small>Triste</small></button>
        <button type="button" class="faccia" data-g="indifferente" aria-pressed="false">😐<small>Indifferente</small></button>
        <button type="button" class="faccia" data-g="contenta" aria-pressed="false">😊<small>Contenta</small></button>
      </div></div>
    <label>Commento<textarea id="fin-comm" placeholder="Cosa ha funzionato, cosa cambiare la prossima volta"></textarea></label>
    <div class="form-btns">
      <button class="primary" type="button" id="fin-salva">Salva</button>
      <button class="ghost" type="button" id="fin-annulla">Annulla</button>
      <button class="ghost" type="button" id="fin-togli" hidden>Togli finalizzazione</button>
    </div>
  </form>
</dialog>

<script src="scuola-ada.js"></script>
<script>
var APP_VERSION = 'v2.4.1';
var BUILD_TIME  = '2026-11-12T12:20:00Z';
console.log('%c VERIFICHE ADA ' + APP_VERSION + ' %c build: ' + BUILD_TIME,
  'background:#c4527a;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',
  'background:#222;color:#aaa;padding:2px 6px;border-radius:0 3px 3px 0');

const GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'], MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
let ver = [], args = [], showPast = false, inModifica = null;

const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const oggi = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const diff = s => Math.round((parse(s) - oggi()) / 864e5);
const quando = n => n === 0 ? 'Oggi' : n === 1 ? 'Domani' : n === 2 ? 'Dopodomani' : n > 0 ? `Fra ${n} giorni` : `${-n} giorni fa`;
const tipoTxt = t => t === 'interrogazione' ? 'Interrogazione' : 'Compito';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }

async function carica() {
  try {
    const [v, m, a] = await Promise.all([
      SC.db('sc_verifiche?select=*&order=data,created_at'),
      SC.db('sc_materie?select=nome&order=posizione,nome'),
      SC.db('sc_argomenti?select=*&order=posizione,created_at')
    ]);
    ver = v; args = a;
    document.getElementById('materie').innerHTML = m.map(x => `<option value="${esc(x.nome)}">`).join('');
    evidenzia();
  } catch (e) { toast('Non riesco a leggere le verifiche: ' + e.message); }
}

// Dal calendario si arriva con #ver-<id> o #arg-<id>: si evidenzia quella voce
// (mostrando anche le passate, se serve). Una volta sola.
function evidenzia() {
  const h = location.hash.match(/^#(ver|arg)-(.+)$/);
  const vid = h && (h[1] === 'ver' ? h[2] : (args.find(a => a.id === h[2]) || {}).verifica_id);
  const v = vid && ver.find(x => x.id === vid);
  if (v && diff(v.data) < 0) showPast = true;
  if (h && h[1] === 'arg') aperti.add(vid);
  render();
  const el = h && document.getElementById(h[1] + '-' + h[2]); if (!el) return;
  history.replaceState(null, '', location.pathname);
  el.classList.add('evid'); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

const argsDi = id => args.filter(a => a.verifica_id === id).sort((x, y) => x.posizione - y.posizione);
const num = n => String(Math.round(n * 10) / 10).replace('.', ',');
const FACCE = { triste: '😞', indifferente: '😐', contenta: '😊' };
const finalizzata = v => v.voto != null || v.giudizio || v.commento;
const SPUNTE = [['studiato', 'Studiato'], ['ripetuto', 'Ripetuto'], ['tranquillo', 'Mi sento tranquillo']];
// Recap: argomenti, pagine, ore e quanti hanno ciascuna spunta.
function recapHtml(lista, spunte) {
  if (!lista.length) return '';
  const pag = lista.reduce((t, a) => t + (Number(a.pagine) || 0), 0), ore = lista.reduce((t, a) => t + (Number(a.ore) || 0), 0);
  let h = `<span><b>${lista.length}</b> argoment${lista.length === 1 ? 'o' : 'i'}</span><span><b>${pag}</b> pagine</span><span><b>${num(ore)}</b> ore</span>`;
  if (spunte) h += SPUNTE.map(([k, l]) => `<span>${l}: <b>${lista.filter(a => a[k]).length}/${lista.length}</b></span>`).join('');
  return h;
}

function render() {
  ver.sort((a, b) => a.data.localeCompare(b.data));
  const future = ver.filter(v => diff(v.data) >= 0), past = ver.filter(v => diff(v.data) < 0);
  const n = future[0];
  document.getElementById('next-wrap').innerHTML = n ? `
    <div class="eyebrow">Prossima</div>
    <div class="next" style="border-left-color:var(--${n.tipo === 'interrogazione' ? 'interr' : 'compito'})">
      <div class="when">${quando(diff(n.data))}</div>
      <div class="what">${tipoTxt(n.tipo)} di ${esc(n.materia)}</div>
      <div class="meta">${GIORNI[parse(n.data).getDay()]} ${parse(n.data).getDate()} ${MESI[parse(n.data).getMonth()]}${n.note ? ' · ' + esc(n.note) : ''}</div>
    </div>` : `<p class="empty">Nessuna verifica in programma.</p>`;
  const rows = (showPast ? ver : future).map(v => {
    const d = parse(v.data), g = diff(v.data);
    const b = g >= 0 && g <= 3 ? `<span class="badge soon">${quando(g)}</span>` : g < 0 ? `<span class="badge muted">fatta</span>` : `<span class="badge muted">${quando(g)}</span>`;
    return `<div class="row${g < 0 ? ' past' : ''}" id="ver-${v.id}">
      <div class="date"><span>${GG[d.getDay()]}</span><b>${d.getDate()}</b><span>${MESI[d.getMonth()]}</span>
        <button type="button" class="fin${finalizzata(v) ? ' done' : ''}" data-fin="${v.id}" aria-label="Finalizza ${esc(v.materia)}">${finalizzata(v) ? `${v.voto != null ? num(v.voto) : '–'} ${FACCE[v.giudizio] || ''}` : '🏁 Finalizza'}</button></div>
      <div class="info"><div class="mat">${esc(v.materia)}</div>${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}
        <div class="badges"><span class="badge ${v.tipo}">${tipoTxt(v.tipo)}</span>${b}</div>
        ${v.commento ? `<div class="fin-txt">💬 ${esc(v.commento)}</div>` : ''}
        ${argomentiHtml(v.id)}</div>
      <div class="acts"><button class="edit" type="button" data-edit="${v.id}" aria-label="Modifica ${esc(v.materia)}">✏️</button>
      <button class="del" type="button" data-id="${v.id}" aria-label="Elimina ${esc(v.materia)}">✕</button></div></div>`;
  }).join('');
  document.getElementById('list').innerHTML = rows || `<p class="empty">Niente in calendario.</p>`;
  const t = document.getElementById('toggle-past');
  t.hidden = past.length === 0;
  t.textContent = showPast ? 'Nascondi le passate' : `Mostra le passate (${past.length})`;
}

// Gli argomenti stanno chiusi: si vede il riepilogo con una barra per spunta,
// e toccandolo si aprono. Quali sono aperti lo ricorda `aperti` fra un disegno e l'altro.
const aperti = new Set();
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('argbox')) return;
  d.open ? aperti.add(d.dataset.ver) : aperti.delete(d.dataset.ver);
}, true);
function barreHtml(lista) {
  const n = lista.length;
  return `<div class="barre">${SPUNTE.map(([k, l]) => { const f = lista.filter(a => a[k]).length;
    return `<div class="barra"><span>${l}</span><b>${f}/${n}</b><span class="tr"><i style="width:${n ? f / n * 100 : 0}%"></i></span></div>`; }).join('')}</div>`;
}
function argomentiHtml(id) {
  const lista = argsDi(id); if (!lista.length) return '';
  return `<details class="argbox" data-ver="${id}"${aperti.has(id) ? ' open' : ''}><summary>
    <div class="recap">${recapHtml(lista, false)}</div>${barreHtml(lista)}<span class="apri"></span></summary>
    <div class="args">${lista.map(a => {
    const det = [a.pagine != null ? `${a.pagine} pag.` : '', a.ore != null ? `${num(a.ore)} h` : ''].filter(Boolean).join(' · ');
    return `<div class="arg" id="arg-${a.id}"><div class="t">${esc(a.titolo)}${det ? ` <small>· ${det}</small>` : ''}</div>
      <div class="checks">${SPUNTE.map(([k, l]) => `<button type="button" class="chk" data-arg="${a.id}" data-k="${k}" aria-pressed="${a[k] ? 'true' : 'false'}">${a[k] ? '☑' : '☐'} ${l}</button>`).join('')}</div></div>`;
  }).join('')}</div></details>`;
}

// ── Form: argomenti in modifica ────────────────────────────────────────────
function rigaArg(a = {}) {
  const d = document.createElement('div'); d.className = 'farg'; if (a.id) d.dataset.id = a.id;
  d.innerHTML = `<label class="ft">Argomento<input class="a-t" value="${esc(a.titolo || '')}" placeholder="es. Equazioni di 2° grado"></label>
    <label>Pagine<input class="a-p" inputmode="numeric" value="${a.pagine ?? ''}"></label>
    <label>Ore<input class="a-o" inputmode="decimal" value="${a.ore != null ? num(a.ore) : ''}"></label>
    <button type="button" class="a-del" aria-label="Togli argomento">🗑</button>`;
  document.getElementById('f-args').appendChild(d);
  return d;
}
function leggiArgs() {
  return [...document.querySelectorAll('#f-args .farg')].map((d, i) => {
    const p = d.querySelector('.a-p').value.trim(), o = d.querySelector('.a-o').value.trim().replace(',', '.');
    return { id: d.dataset.id || null, titolo: d.querySelector('.a-t').value.trim(),
      pagine: p === '' ? null : Math.max(0, parseInt(p, 10) || 0), ore: o === '' ? null : Math.max(0, Number(o) || 0), posizione: i };
  }).filter(a => a.titolo);
}
function aggiornaRecapForm() { document.getElementById('f-recap').innerHTML = recapHtml(leggiArgs(), false); }
function apriForm(v) {
  const f = document.getElementById('add'); f.reset();
  document.getElementById('f-args').innerHTML = '';
  inModifica = v ? v.id : null;
  if (v) {
    document.getElementById('f-data').value = v.data; document.getElementById('f-mat').value = v.materia;
    document.getElementById('f-tipo').value = v.tipo; document.getElementById('f-note').value = v.note || '';
    argsDi(v.id).forEach(rigaArg);
  }
  document.getElementById('form-title').textContent = v ? `Modifica: ${v.materia}` : 'Aggiungi';
  document.getElementById('f-submit').textContent = v ? 'Salva' : 'Aggiungi';
  document.getElementById('f-cancel').hidden = !v;
  aggiornaRecapForm();
}
document.getElementById('f-add-arg').addEventListener('click', () => { rigaArg().querySelector('.a-t').focus(); });
document.getElementById('f-cancel').addEventListener('click', () => apriForm(null));
document.getElementById('f-args').addEventListener('input', aggiornaRecapForm);
document.getElementById('f-args').addEventListener('click', e => {
  const b = e.target.closest('.a-del'); if (b) { b.closest('.farg').remove(); aggiornaRecapForm(); }
});

// Argomenti salvati: si aggiornano quelli rimasti (le spunte restano), si aggiungono i nuovi, si tolgono i tolti.
async function salvaArgs(verificaId, lista) {
  const prima = argsDi(verificaId), tenuti = new Set(lista.filter(a => a.id).map(a => a.id));
  const via = prima.filter(a => !tenuti.has(a.id)).map(a => a.id);
  if (via.length) await SC.db(`sc_argomenti?id=in.(${via.join(',')})`, { method: 'DELETE', prefer: 'return=minimal' });
  for (const a of lista.filter(a => a.id))
    await SC.db(`sc_argomenti?id=eq.${a.id}`, { method: 'PATCH', body: { titolo: a.titolo, pagine: a.pagine, ore: a.ore, posizione: a.posizione }, prefer: 'return=minimal' });
  const nuovi = lista.filter(a => !a.id).map(a => ({ verifica_id: verificaId, titolo: a.titolo, pagine: a.pagine, ore: a.ore, posizione: a.posizione }));
  if (nuovi.length) await SC.db('sc_argomenti', { method: 'POST', body: nuovi, prefer: 'return=minimal' });
  args = args.filter(a => a.verifica_id !== verificaId)
    .concat(await SC.db(`sc_argomenti?select=*&verifica_id=eq.${verificaId}&order=posizione`));
}

// ── Finalizza: voto, faccina sulla programmazione, commento ───────────────
const dlg = document.getElementById('dlg-fin');
let finId = null, finG = null;
function segnaFaccia(g) { finG = g; document.querySelectorAll('#fin-facce .faccia').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === g ? 'true' : 'false')); }
function apriFin(v) {
  finId = v.id;
  document.getElementById('fin-titolo').textContent = `Finalizza: ${tipoTxt(v.tipo)} di ${v.materia}`;
  document.getElementById('fin-voto').value = v.voto != null ? num(v.voto) : '';
  document.getElementById('fin-comm').value = v.commento || '';
  document.getElementById('fin-togli').hidden = !finalizzata(v);
  segnaFaccia(v.giudizio || null);
  dlg.showModal();
}
document.getElementById('fin-facce').addEventListener('click', e => { const f = e.target.closest('.faccia'); if (f) segnaFaccia(finG === f.dataset.g ? null : f.dataset.g); });
document.getElementById('fin-annulla').addEventListener('click', () => dlg.close());
async function scriviFin(corpo) {
  const [riga] = await SC.db(`sc_verifiche?id=eq.${finId}`, { method: 'PATCH', body: corpo });
  ver = ver.map(v => v.id === finId ? riga : v); render();
}
document.getElementById('fin-salva').addEventListener('click', async () => {
  const t = document.getElementById('fin-voto').value.trim().replace(',', '.');
  const voto = t === '' ? null : Number(t);
  if (voto != null && !(voto >= 1 && voto <= 10)) { toast('Il voto va da 1 a 10.'); return; }
  const commento = document.getElementById('fin-comm').value.trim() || null;
  if (voto == null && !finG && !commento) { toast('Scrivi almeno il voto, una faccina o un commento.'); return; }
  const btn = document.getElementById('fin-salva'); btn.disabled = true;
  const t0 = new Date(), oggiIso = `${t0.getFullYear()}-${String(t0.getMonth() + 1).padStart(2, '0')}-${String(t0.getDate()).padStart(2, '0')}`;
  try { await scriviFin({ voto, giudizio: finG, commento, finalizzata_il: oggiIso }); dlg.close(); toast('Verifica finalizzata.'); }
  catch (err) { toast('Non salvata: ' + err.message); }
  finally { btn.disabled = false; }
});
document.getElementById('fin-togli').addEventListener('click', async () => {
  try { await scriviFin({ voto: null, giudizio: null, commento: null, finalizzata_il: null }); dlg.close(); toast('Finalizzazione tolta.'); }
  catch (err) { toast('Non tolta: ' + err.message); }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.closest('dialog')) return;
  if (b.dataset.fin) { apriFin(ver.find(v => v.id === b.dataset.fin)); return; }
  if (b.id === 'toggle-past') { showPast = !showPast; render(); return; }
  if (b.dataset.edit) { apriForm(ver.find(v => v.id === b.dataset.edit)); document.getElementById('form-title').scrollIntoView({ behavior: 'smooth' }); return; }
  if (b.dataset.arg) {
    const a = args.find(x => x.id === b.dataset.arg), k = b.dataset.k; if (!a) return;
    a[k] = !a[k]; render();
    try { await SC.db(`sc_argomenti?id=eq.${a.id}`, { method: 'PATCH', body: { [k]: a[k] }, prefer: 'return=minimal' }); }
    catch (err) { a[k] = !a[k]; render(); toast('Spunta non salvata: ' + err.message); }
    return;
  }
  if (!b.dataset.id) return;
  // Primo tocco: chiede conferma; secondo tocco entro 4 secondi: elimina.
  if (!b.classList.contains('arm')) {
    b.classList.add('arm'); b.textContent = 'Elimina?';
    setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = '✕'; } }, 4000);
    return;
  }
  const prima = ver;
  ver = ver.filter(v => v.id !== b.dataset.id); render();
  if (inModifica === b.dataset.id) apriForm(null);
  try { await SC.db(`sc_verifiche?id=eq.${b.dataset.id}`, { method: 'DELETE', prefer: 'return=minimal' }); }
  catch (err) { ver = prima; render(); toast('Non eliminata: ' + err.message); }
});

document.getElementById('add').addEventListener('submit', async e => {
  e.preventDefault();
  const data = document.getElementById('f-data').value, materia = document.getElementById('f-mat').value.trim();
  if (!data || !materia) return;
  const note = document.getElementById('f-note').value.trim();
  const btn = document.getElementById('f-submit'); btn.disabled = true;
  const corpo = { data, materia, tipo: document.getElementById('f-tipo').value, note: note || null };
  const lista = leggiArgs(), modifica = inModifica;
  try {
    let riga;
    if (modifica) {
      [riga] = await SC.db(`sc_verifiche?id=eq.${modifica}`, { method: 'PATCH', body: corpo });
      ver = ver.map(v => v.id === modifica ? riga : v);
    } else {
      [riga] = await SC.db('sc_verifiche', { method: 'POST', body: corpo });
      ver.push(riga);
    }
    try { await salvaArgs(riga.id, lista); }
    catch (err) { render(); toast('Verifica salvata, argomenti no: ' + err.message); return; }
    apriForm(null); render(); toast(modifica ? 'Salvata.' : 'Aggiunta.');
  } catch (err) { toast((modifica ? 'Non salvata: ' : 'Non aggiunta: ') + err.message); }
  finally { btn.disabled = false; }
});

SC.avvia('verifiche-ada.html', carica);
</script>
