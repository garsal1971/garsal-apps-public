[build]
  publish = "."
  base = "."

[[redirects]]
  from = "/tests/dashboard"
  to = "/test-dashboard.html"
  status = 200

# HTML mai in cache: l'app (WebView) carica la root "/" (servita da index.html,
# un file fisico ha precedenza sui redirect) e deve sempre ricevere l'ultima
# versione, altrimenti resta su una versione vecchia (login rotto).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/releases/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"

# La scheda della build (versione, data, peso, impronta dell'APK lì accanto)
# non va mai in cache: se resta indietro la pagina annuncia una versione e ne
# fa scaricare un'altra, che è esattamente il modo di sbagliare che questa
# scheda esiste per togliere di mezzo.
[[headers]]
  for = "/releases/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Le regole e la vista di Spese Famiglia, condivise da tre pagine: cambiano col
# codice come l'HTML che le carica, quindi come l'HTML non vanno in cache — o una
# pagina nuova girerebbe sulle regole vecchie.
[[headers]]
  for = "/spese-famiglia.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# ── Le librerie del Forziere ──────────────────────────────────────────────────
# OpenPGP.js e 7-Zip in WebAssembly stanno qui e non su un CDN: `forziere.html`
# maneggia le 24 parole, e una libreria servita da terzi può essere sostituita a
# runtime e portarsele via senza che nessuno se ne accorga. Cambiano solo quando
# le aggiorniamo a mano, quindi possono restare in cache a lungo — ed è anche
# quello che tiene leggera l'apertura della pagina.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# `WebAssembly.instantiateStreaming` rifiuta un tipo diverso da application/wasm,
# e senza 7-Zip l'export .7z non parte.
[[headers]]
  for = "/vendor/7zz.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=604800"

# ── Branch deploy per dev/** ──────────────────────────────────────────────────
# I branch dev/** ottengono un URL preview: dev--<branch>--<sitename>.netlify.app
# NON vengono auto-mergiati su master (workflow separato deploy-dev.yml).
# Attivare in Netlify dashboard → Site configuration → Build & deploy →
#   Branch deploys → Branch deploy controls → aggiungere pattern: dev/*
[context.branch-deploy]
  command = ""
  publish = "."
