<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modifiche v1.13.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Darker+Grotesque:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --c-bg:        #f4f6fb;
      --c-surface:   #ffffff;
      --c-border:    #e2e8f0;
      --c-text:      #1e293b;
      --c-muted:     #64748b;
      --c-primary:   #0f766e;
      --c-primary-h: #115e59;
      --c-success:   #16a34a;
      --c-danger:    #dc2626;
      --c-warning:   #d97706;
      --radius-sm: 6px;
      --radius:    12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow:    0 4px 16px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
    }
    /* ⚠️ `overflow-wrap: anywhere` sul body: coi caratteri di sistema grandi una
       parola sola (un nome di file, un percorso) può essere più larga del
       riquadro — spezzarla è meglio che tagliarla, e a carattere normale non
       cambia niente. Stessa scelta di obiettivi.html. */
    body { font-family: var(--font-sans); background: var(--c-bg); color: var(--c-text);
           min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .text-muted { color: var(--c-muted); }
    .text-sm { font-size: .84rem; }

    /* ⚠️ `min-height` e non `height`: la barra contiene del testo, e col
       carattere di sistema ingrandito una altezza fissa lo ritaglia. */
    #barra { position: sticky; top: 0; z-index: 100; min-height: 56px; background: var(--c-primary);
             display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #fff; }
    #barra .titolo { font-family: 'Darker Grotesque', sans-serif; font-size: 1.3rem; font-weight: 700;
                     line-height: 1.1; flex: 1; min-width: 0; }
    /* ⚠️ Nessun collegamento a «/»: questa pagina è anche un'APK a sé, e lì
       AppSphere aprirebbe un login che quella WebView non sa fare. */
    .btn-barra { background: rgba(255,255,255,.18); border: none; color: #fff; cursor: pointer;
                 border-radius: var(--radius-sm); padding: 8px 10px; font-size: 1rem; flex-shrink: 0; }

    main { max-width: 760px; margin: 0 auto; padding: 16px 16px 96px; }

    .filtri { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .chip { flex-shrink: 0; border: 1.5px solid var(--c-border); background: var(--c-surface);
            border-radius: 999px; padding: 7px 14px; font: inherit; font-size: .86rem; cursor: pointer;
            color: var(--c-muted); }
    .chip.on { background: var(--c-primary); border-color: var(--c-primary); color: #fff; font-weight: 600; }

    .scheda { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius);
              box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 12px; }
    .scheda h3 { font-size: 1rem; line-height: 1.3; margin-bottom: 6px; }
    .scheda .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
    .badge { font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
    .badge.aperta   { background: #ccfbf1; color: #0f766e; }
    .badge.inviata  { background: #dbeafe; color: #1e40af; }
    .badge.in_corso { background: #fef3c7; color: #92400e; }
    .badge.fatta    { background: #dcfce7; color: #166534; }
    .badge.verificato { background: #bbf7d0; color: #14532d; }
    .badge.rigettato  { background: #fee2e2; color: #991b1b; }
    .badge.scartata { background: #f1f5f9; color: var(--c-muted); }
    .badge.app     { background: #ede9fe; color: #5b21b6; }
    /* ⚠️ Va a capo e non scorre: qui le pillole sono quel che si è scelto e
       vanno viste tutte, mentre una riga scorrevole ne nasconderebbe una
       dietro il bordo proprio mentre si decide. */
    .pillole-app { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .scheda .testo { white-space: pre-wrap; font-size: .9rem; color: #334155; }
    .esito-fix { margin-top: 10px; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: 8px 10px; background: #f8fafc; }
    .esito-fix summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
    .esito-fix .esito-testo { margin: 6px 0 8px; overflow-wrap: anywhere; }
    .esito-fix code { background: #e2e8f0; border-radius: 4px; padding: 0 4px; font-size: .85em; }
    .scheda.scartata h3, .scheda.fatta h3 { text-decoration: line-through; color: var(--c-muted); }

    .strisciaFoto { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; }
    .strisciaFoto img { height: 84px; border-radius: var(--radius-sm); border: 1px solid var(--c-border);
                        flex-shrink: 0; cursor: pointer; }
    .foto-box { position: relative; flex-shrink: 0; }
    .foto-box .togli { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.65); color: #fff;
                       border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: .8rem; }

    /* ⚠️ Le righe di pulsanti scorrono e non vanno a capo: coi caratteri di
       sistema grandi tre pulsanti andati a capo diventano tre righe, e in uno
       schermo ci sta una scheda sola. Quel che conta di più sta a sinistra. */
    .azioni { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
    .btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
           border-radius: var(--radius-sm); font: inherit; font-size: .86rem; font-weight: 500;
           cursor: pointer; border: 1.5px solid transparent; white-space: nowrap; }
    .btn-primary { background: var(--c-primary); color: #fff; }
    .btn-primary:hover { background: var(--c-primary-h); }
    .btn-outline { background: var(--c-surface); color: var(--c-text); border-color: var(--c-border); }
    .btn-danger  { background: #fee2e2; color: var(--c-danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .fab { position: fixed; right: 18px; bottom: 18px; z-index: 90; background: var(--c-primary); color: #fff;
           border: none; border-radius: 999px; padding: 15px 22px; font: inherit; font-size: 1rem;
           font-weight: 600; box-shadow: var(--shadow); cursor: pointer; }

    .vuoto { text-align: center; color: var(--c-muted); padding: 48px 16px; }

    /* popup */
    #velo { position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.55); display: none;
            align-items: flex-start; justify-content: center; padding: 12px; overflow-y: auto; }
    #velo.on { display: flex; }
    .popup { background: var(--c-surface); border-radius: var(--radius); width: 100%; max-width: 620px;
             box-shadow: var(--shadow); padding: 18px; margin: auto 0; }
    .popup h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
    .popup h2 span { flex: 1; min-width: 0; }
    .popup h2 button { flex-shrink: 0; }
    .campo { display: block; margin-bottom: 12px; }
    .campo > span { display: block; font-size: .82rem; font-weight: 600; color: var(--c-muted); margin-bottom: 5px; }
    input[type=text], input[type=email], input[type=password], textarea, select {
      width: 100%; padding: 11px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm);
      font: inherit; font-size: .95rem; background: #f9fafb; color: var(--c-text); }
    textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
    .aiuto { font-size: .78rem; color: var(--c-muted); margin-top: 4px; }

    /* login */
    #login { position: fixed; inset: 0; z-index: 300; background: var(--c-bg); display: flex;
             align-items: center; justify-content: center; padding: 20px; }
    #login .box { background: var(--c-surface); border-radius: var(--radius); box-shadow: var(--shadow);
                  padding: 24px; width: 100%; max-width: 380px; }
    #login h1 { font-size: 1.25rem; margin-bottom: 4px; }

    .sez { border-top: 1px solid var(--c-border); margin-top: 18px; padding-top: 14px; }
    .sez h3 { font-size: .95rem; margin-bottom: 8px; }
    .riga-dato { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between;
                 font-size: .86rem; padding: 3px 0; }
    .riga-dato b { font-weight: 600; }
    pre.sql { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: var(--radius-sm);
              font-size: .74rem; line-height: 1.45; overflow-x: auto; white-space: pre; margin-top: 8px; }
    .esito { font-size: .84rem; margin-top: 10px; padding: 10px; border-radius: var(--radius-sm);
             background: var(--c-bg); }
    .esito.ko { background: #fee2e2; color: #7f1d1d; }
    .esito.ok { background: #dcfce7; color: #14532d; }

    #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 400;
             background: #1e293b; color: #fff; padding: 12px 18px; border-radius: var(--radius);
             font-size: .88rem; max-width: 90vw; text-align: center; display: none; }
    #toast.on { display: block; }
  </style>
</head>

<script>
// ============================================================

var APP_VERSION = 'v1.13.0';

const SUPABASE_URL = _IS_DEV
    ? 'https://hcmmywitrbmcsmytjbaf.supabase.co'
    : 'https://jajlmmdsjlvzgcxiiypk.supabase.co';
const SUPABASE_KEY = _IS_DEV
    ? 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbW15d2l0cmJtY3NteXRqYmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODE1NDUsImV4cCI6MjA4OTM1NzU0NX0.pAtj6THjWXibrMulU1IVGH-BFx4YkjkNT_x07lNUfWE'
    : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphamxtbWRzamx2emdjeGlpeXBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTU0NjYsImV4cCI6MjA4NTUzMTQ2Nn0.ikaipwxOvIn43epayQ4mSZQkXtin3aaGEPouafwJFxU';

const BUCKET = 'mod-immagini';

// ⚠️ Due indirizzi, e la divisione è quella di tutte le altre APK: la
// **scheda** dice quale versione c'è e sta sul sito, il **pacchetto** si
// scarica da R2 — Cloudflare Pages rifiuta i file oltre i 25 MiB, quindi
// sul sito le APK non ci stanno affatto. La scheda si chiede in relativo,
// così la pagina funziona anche da un'anteprima.
const SCHEDA_APK = '/releases/Modifiche-latest.json';
const PACCHETTO  = 'https://apk.garsal.men/Modifiche-latest.apk';

// Il SQL che crea il bucket e le sue policy. Sta qui perché la migration lo
// prova e **avvisa senza fallire** se non ci riesce (un deploy fermo su una
// riga di storage si porterebbe dietro tutto il resto): quando non ci riesce,
// questo è il rimedio, da incollare nel SQL editor di Supabase. È la stessa
// scelta del SQL mostrato in ⚙️ da memo.html.
const SQL_BUCKET = `insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
values ('mod-immagini', 'mod-immagini', false, 8388608,
        array['image/jpeg', 'image/png', 'image/webp'])
on conflict (id) do nothing;

drop policy if exists "mod-immagini scrive" on storage.objects;
create policy "mod-immagini scrive" on storage.objects for insert
  with check (bucket_id = 'mod-immagini' and auth.uid()::text = (storage.foldername(name))[1]);

drop policy if exists "mod-immagini legge" on storage.objects;
create policy "mod-immagini legge" on storage.objects for select
  using (bucket_id = 'mod-immagini' and auth.uid()::text = (storage.foldername(name))[1]);

drop policy if exists "mod-immagini cancella" on storage.objects;
create policy "mod-immagini cancella" on storage.objects for delete
  using (bucket_id = 'mod-immagini' and auth.uid()::text = (storage.foldername(name))[1]);`;
const LATO_MAX = 1600;      // ⚠️ come «Spese in giro»: una schermata ridotta a
const QUALITA  = 0.82;      // 1600 px resta leggibile e pesa ~300 KB — e quel
                            // peso è anche quello che passa dal ponte della
                            // condivisione, dove un megabyte per foto sarebbe
                            // la memoria dell'app.

const STATI = {
  aperta:   { nome: 'Da fare',   emoji: '📌' },
  inviata:  { nome: 'Inviata',   emoji: '📨' },   // mandata con 🐙, nessuno ci lavora ancora
  in_corso: { nome: 'In corso',  emoji: '🔧' },
  fatta:    { nome: 'Fatta',     emoji: '✅' },
  verificato: { nome: 'Verificato', emoji: '🔎' },   // a mano, dopo «fatta»
  rigettato:  { nome: 'Rigettato',  emoji: '↩️' },   // a mano: crea la nuova richiesta
  scartata: { nome: 'Scartata',  emoji: '🚫' }
};

// Le app che si possono nominare. È un elenco di suggerimenti, non un vincolo:
// il campo resta testo libero, come `item_key` in Finanza — aggiungerne una è
// una riga di JavaScript e non una migration.
// ⚠️ Dalla v1.6.0 (issue #23) se ne sceglie **più d'una**: una richiesta tocca
// spesso la pagina e la sua gemella nativa. Stanno in `mod_richieste.apps`
// (`text[]`), e `app` continua a portare la **prima**: la legge la Edge
// Function per l'intestazione della issue, e le issue già aperte la citano.
const APP_SUGGERITE = [
  'AppSphere (home)', 'Tasks', 'Abituati', 'Events Log', 'Ti pisasti?', 'Calorie',
  'Memo', 'Obiettivi', 'Spuntiamola', 'Ta Firi?', 'Finanza', 'Spese Famiglia',
  'Spese Ada', 'Spese Personali', 'Contribuzione', 'Conto Risparmio', 'Casa Rosa',
  'Forziere', 'SOS', 'Spese in giro', 'Smart Blocker',
  'APK AppSphere (nativa)', 'APK AppSfera Web', 'Modifiche'
];

let sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = {
  utente: null,
  richieste: [],
  filtro: 'da_fare',
  bozza: null,
  // richiesta_id → { numero, url, stato, titolo } della sua issue su GitHub.
  // ⚠️ Vive in memoria e non in tabella: la verità è la issue, e una colonna
  // accanto sarebbe una seconda verità che diverge il giorno che una issue si
  // cancella a mano.
  issue: {},
  esiti: {},        // id richiesta → ultimo commento di Claude sulla issue
  esitoAperto: {}
};

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastTimer = null;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

function fmtData(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ============================================================
// PONTE CON L'APK
// ============================================================
// `window.AndroidBridge` esiste solo dentro l'APK «Modifiche». Sul PC non c'è,
// e ogni chiamata passa da qui: una pagina che desse per scontato il ponte
// smetterebbe di funzionare nel browser.
const ponte = () => (typeof window.AndroidBridge !== 'undefined' ? window.AndroidBridge : null);
const creds = () => (typeof window.AndroidCreds !== 'undefined' ? window.AndroidCreds : null);
const app   = () => (typeof window.AndroidApp !== 'undefined' ? window.AndroidApp : null);

// ============================================================
// LOGIN
// ============================================================
// Tre strade per entrare: 🔑 **Google**, email e password, oppure il link via
// email. Google è arrivato con l'issue #21 — fino alla v1.4.0 c'erano solo le
// altre due, e la ragione scritta allora era che questa pagina vive anche
// dentro un'APK a sé, che non ha né il launcher che passa il token né il giro
// del browser esterno. Adesso quel giro ce l'ha: `oauth-callback-modifiche.html`
// più lo schema `garsalmodifiche://`.
//
// ⚠️ Email e password **restano**, e non sono un ripiego: sono l'unica strada
// che l'APK sa rifare **da sola** al riavvio (`CredentialsBridge` le tiene
// cifrate nel Keystore, come in `situazione-rosa.html`). Con Google la
// sessione dura finché dura il refresh token di supabase-js: più a lungo di
// quanto serva, ma il giorno che scade si rientra a mano.
/**
 * 🔑 Entra con Google.
 *
 * ⚠️ **Nel browser e nell'APK sono due strade diverse, e devono esserlo.**
 * Su un PC basta `signInWithOAuth`, che naviga e torna qui. Dentro la WebView
 * no, per due ragioni che si sommano: Google **rifiuta** il login da una
 * WebView incorporata (è lo stesso motivo per cui l'APK nativa apre il browser
 * completo e non una Custom Tab), e il ritorno è un **redirect**, che senza
 * App Links verificati Chrome non consegna a nessuna app. Quindi si apre il
 * browser di sistema e si torna dalla pagina-ponte
 * `oauth-callback-modifiche.html`, che mette il token dietro un pulsante: il
 * tap su `garsalmodifiche://oauth` esce dal browser sempre.
 *
 * ⚠️ L'indirizzo si costruisce a mano invece di chiamare `signInWithOAuth`
 * con `skipBrowserRedirect`: dentro la WebView quella navigherebbe comunque
 * la pagina prima che il ponte possa aprire il browser.
 *
 * ⚠️ `redirect_to` va messo fra i **Redirect URLs di Supabase**, esattamente
 * com'è scritto qui: è l'unico passo che non sta nella repo.
 */
async function accediConGoogle() {
  const a = app();
  const btn = $('#l-google');
  $('#l-msg').textContent = '';
  try {
    if (a && typeof a.apriNelBrowser === 'function') {
      const ponte = 'https://garsal.men/oauth-callback-modifiche.html';
      const url = SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to='
        + encodeURIComponent(ponte);
      a.apriNelBrowser(url);
      $('#l-msg').textContent = 'Ho aperto il browser. Finito il login, tocca «Apri Modifiche».';
      return;
    }
    btn.disabled = true;
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname }
    });
    if (error) throw error;
  } catch (e) {
    $('#l-msg').textContent = 'Non ci sono riuscito: ' + (e.message || e);
  } finally {
    btn.disabled = false;
  }
}

async function accedi() {
  const email = $('#l-email').value.trim();
  const pass  = $('#l-pass').value;
  if (!email) { $('#l-msg').textContent = 'Scrivi l’email.'; return; }

  $('#l-accedi').disabled = true;
  try {
    if (pass) {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      // L'APK se le ricorda cifrate: la prossima volta entra da sé.
      try { creds()?.saveCredentials(email, pass); } catch (e) { console.warn(e); }
      await avviaSessione();
    } else {
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.origin + location.pathname }
      });
      if (error) throw error;
      $('#l-msg').textContent = 'Ti ho mandato un link. Aprilo da questo telefono.';
    }
  } catch (e) {
    $('#l-msg').textContent = 'Non ci sono riuscito: ' + (e.message || e);
  } finally {
    $('#l-accedi').disabled = false;
  }
}

async function rientroAutomatico() {
  const c = creds();
  if (!c) return false;
  let salvate = {};
  try { salvate = JSON.parse(c.getCredentials() || '{}'); } catch (e) { return false; }
  if (!salvate.email || !salvate.password) return false;
  const { error } = await sb.auth.signInWithPassword({
    email: salvate.email, password: salvate.password
  });
  return !error;
}

async function esci() {
  try { creds()?.clearCredentials(); } catch (e) { console.warn(e); }
  await sb.auth.signOut();
  location.reload();
}

// ============================================================
// 📱 VERSIONE APP
// ============================================================
// ⚠️ La versione installata la dice il telefono (`AndroidApp.versione()`,
// dal PackageManager) e non una costante in pagina: dentro la WebView quella
// scritta qui è la versione della PAGINA, che si aggiorna da sé a ogni deploy
// e non dice niente su quale pacchetto è installato.
async function mostraVersione() {
  const box = document.getElementById('i-versione');
  if (!box) return;

  let installata = null;
  try { const a = app(); if (a) installata = JSON.parse(a.versione() || '{}'); } catch (e) { console.warn(e); }

  let scheda = null, motivo = '';
  try {
    const r = await fetch(SCHEDA_APK, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    scheda = await r.json();
  } catch (e) { motivo = e.message || String(e); }

  const righe = [];
  if (installata && installata.version) {
    righe.push(`<div class="riga-dato"><span>Installata</span><b>v${esc(installata.version)} (${esc(installata.versionCode)})</b></div>`);
  }
  if (scheda) {
    const mb = (Number(scheda.bytes) / 1048576).toFixed(1).replace('.', ',');
    righe.push(`<div class="riga-dato"><span>Pubblicata</span><b>v${esc(scheda.version)} (${esc(scheda.versionCode)})</b></div>`);
    righe.push(`<div class="riga-dato"><span>Del</span><span>${esc(fmtData(scheda.builtAt))} \u00b7 ${mb} MB</span></div>`);
  } else {
    // ⚠️ Il pulsante c'è ANCHE senza la scheda, ed è la lezione già pagata
    // dall'APK nativa: legarlo alla scheda vuol dire che una rete lenta o un
    // 404 tolgono di mezzo la sola cosa per cui questo riquadro esiste.
    righe.push(`<div class="esito ko">Non ho letto la scheda della build (${esc(motivo)}).
      Scaricare si può lo stesso, ma non so dirti quale versione prendi.</div>`);
  }

  // ⚠️ `?v=` in coda, o il browser ripropone il pacchetto già scaricato: il
  // nome è fisso (`Modifiche-latest.apk`), quindi da fuori una build vale
  // l'altra.
  const v = scheda?.version || installata?.version || 'x';
  const aggiornato = scheda && installata && Number(scheda.versionCode) <= Number(installata.versionCode);
  righe.push(aggiornato
    ? `<div class="esito ok">Sei aggiornato.</div>`
    : '');
  righe.push(`<div class="azioni">
      <button class="btn ${aggiornato ? 'btn-outline' : 'btn-primary'}"
              onclick="scaricaApk('${esc(v)}')">⬇️ Scarica l\u2019APK</button>
    </div>`);
  // ⚠️ L'indirizzo si SCRIVE, e non sta solo dentro il pulsante: su un'APK
  // vecchia il ponte `AndroidApp` non esiste, `scaricaApk` ripiega su
  // `window.open` — che dentro una WebView non fa assolutamente niente — e
  // senza l'indirizzo a schermo non resta nessuna via per aggiornare l'app
  // che contiene il pulsante. È il cane che si morde la coda del 13 settembre
  // 2026.
  righe.push(`<p class="aiuto">Se il pulsante non fa niente, apri questo indirizzo
    <strong>nel browser del telefono</strong>:<br>
    <code style="word-break:break-all">${esc(PACCHETTO)}?v=${esc(v)}</code></p>`);
  if (!app()) righe.push(`<p class="aiuto">Da qui si scarica il pacchetto per Android: sul computer non serve a niente.</p>`);

  box.innerHTML = righe.join('');
}

// ⚠️ Il download NON resta nella WebView: un APK sceso qui dentro non si
// installa — non c'è nessun gestore di download e nessun modo di lanciare
// l'installer. Lo passa al browser di sistema, che quel giro lo sa fare.
function scaricaApk(v) {
  const url = PACCHETTO + '?v=' + encodeURIComponent(v);
  const a = app();
  if (a && typeof a.apriNelBrowser === 'function') { a.apriNelBrowser(url); toast('Apro il browser…'); return; }
  window.open(url, '_blank');
}

// Un errore dello storage non si mostra grezzo: le due cause vere sono due, e
// il rimedio è diverso. Dirlo è la differenza fra «non funziona» e «ecco cosa
// manca».
function spiegaStorage(error) {
  const t = (error.message || '') + ' ' + (error.error || '') + ' ' + (error.statusCode || '');
  const sql = `<details><summary style="cursor:pointer;margin-top:8px">Il SQL che lo sistema</summary>
      <pre class="sql">${esc(SQL_BUCKET)}</pre>
      <div class="azioni"><button class="btn btn-outline" onclick="copiaSql()">📋 Copia il SQL</button></div>
      <p class="aiuto">Si incolla nel <b>SQL editor</b> di Supabase e si esegue una volta sola.</p>
    </details>`;
  if (/bucket not found/i.test(t)) {
    return `❌ <b>Il bucket <code>mod-immagini</code> non esiste.</b> La migration ha provato a
      crearlo e non ci è riuscita — avvisa e non fallisce, per non fermare tutto il deploy su una
      riga di storage — e nessuno ha letto l\u2019avviso.${sql}`;
  }
  if (/row-level security|violates|not authorized|permission denied/i.test(t)) {
    return `❌ <b>Il bucket c\u2019è, ma le policy no.</b> Lo storage rifiuta la scrittura:
      «${esc(error.message || t)}».${sql}`;
  }
  if (/jwt|401|invalid token/i.test(t)) {
    return `❌ <b>La sessione non vale più.</b> Esci e rientra: «${esc(error.message || t)}».`;
  }
  return `❌ ${esc(error.message || t)}${sql}`;
}

async function copiaSql() {

  catch (e) { toast('Non sono riuscito a copiarlo.'); }
}

async function carica() {
  const { data: righe, error } = await sb
    .from('mod_richieste').select('*').order('created_at', { ascending: false });
  if (error) { toast('Non ho letto le richieste: ' + error.message, 5000); return; }

  const { data: foto } = await sb
    .from('mod_immagini').select('*').order('position', { ascending: true });

  const perRichiesta = {};
  (foto || []).forEach(f => { (perRichiesta[f.richiesta_id] ||= []).push(f); });

  S.richieste = (righe || []).map(r => ({ ...r, immagini: perRichiesta[r.id] || [] }));
  await firmaTutte();
  disegna();
  // ⚠️ Non si aspetta: la pagina è già a schermo e i numeri delle issue sono
  // un di più. Legarli al caricamento vorrebbe dire un elenco che non compare
  // finché GitHub non risponde.
  elencoIssue();
}

// Il bucket è privato: le miniature si guardano con un indirizzo firmato, che
// dura due ore. Un bucket pubblico avrebbe risparmiato questa chiamata e messo
// in chiaro delle schermate che possono contenere qualunque cosa.
async function firmaTutte() {
  const tutte = S.richieste.flatMap(r => r.immagini);
  if (!tutte.length) return;
  const { data, error } = await sb.storage.from(BUCKET)
    .createSignedUrls(tutte.map(i => i.storage_path), 7200);
  if (error) { console.warn('firme:', error); return; }
  const perPercorso = {};
  (data || []).forEach(d => { if (d.signedUrl) perPercorso[d.path] = d.signedUrl; });
  tutte.forEach(i => { i.url = perPercorso[i.storage_path] || null; });
}

// ============================================================
// 🐙 MANDA A CLAUDE CODE — la richiesta diventa una issue
// ============================================================
// ⚠️ Il token di GitHub NON sta qui. Lo tiene l'Edge Function
// `modifiche-issue` nei Secrets di Supabase: in chiaro dentro questa pagina
// sarebbe un token con diritto di scrittura sulla repo di tutte le app, che
// chiunque apra il sorgente si porta via.
//
// ⚠️ E la repo dev'essere PRIVATA: una issue porta dentro le schermate, che
// sono di Finanza, spese e patrimonio.
const FUNZIONE = 'modifiche-issue';

async function chiamaGithub(azione, extra) {
  const { data, error } = await sb.functions.invoke(FUNZIONE, {
    body: { azione, ...(extra || {}) }
  });
  // ⚠️ Il motivo va cercato in tutt'e due i posti. `invoke` mette in `error`
  // il solo fatto che la risposta non era 2xx — il perché sta nel corpo, che
  // va letto da `error.context` — mentre una risposta 200 con `ok: false` (è
  // il caso del secret che manca) in `error` non compare affatto: guardare
  // solo lì vorrebbe dire scrivere «mandata» su una issue che non esiste.
  if (error) {
    let dettaglio = '';
    try { dettaglio = (await error.context?.json())?.error || ''; } catch (e) { /* corpo non leggibile */ }
    throw new Error(dettaglio || error.message || 'la funzione non ha risposto');
  }
  if (!data?.ok) throw new Error([data?.error, data?.rimedio].filter(Boolean).join(' — ') || 'errore sconosciuto');
  return data;
}

// Si chiede una volta sola dopo il caricamento, e **in silenzio**: serve a
// mettere il numero sulle schede, non a far funzionare la pagina. Quando i
// secret non ci sono ancora, a dirlo forte è ⚙️ → 🐙, che è il posto dove si
// va a cercare il perché.
async function elencoIssue() {
  if (!S.richieste.length) return;   // niente da marcare: nessuna chiamata
  try {
    const d = await chiamaGithub('elenco');
    S.issue = d.issue || {};
    await allineaChiuse();
    disegna();
  } catch (e) { console.warn('issue:', e.message); }
}

// Una richiesta cambia stato da sola in tre momenti, e sempre in AVANTI: una
// già più avanti (o scartata a mano) non si riporta mai indietro.
const ORDINE_GIRO = ['aperta', 'inviata', 'in_corso', 'fatta'];
async function avanzaStato(r, nuovo) {
  const da = ORDINE_GIRO.indexOf(r.stato), a = ORDINE_GIRO.indexOf(nuovo);
  if (r.stato === nuovo || (nuovo !== 'scartata' && (da < 0 || da >= a))) return;
  const { error } = await sb.from('mod_richieste')
    .update({ stato: nuovo, updated_at: new Date().toISOString() }).eq('id', r.id);
  if (error) console.warn('stato ' + nuovo + ':', error.message); else r.stato = nuovo;
}

// ⚠️ La RETE della issue chiusa. A chiudere la richiesta è il workflow
// `modifiche-issue-chiusa.yml` appena GitHub chiude la issue — cioè quando
// Claude ha messo `Closes #N` nel commit, e lo mette solo a lavoro finito.
// Qui lo si ripete all'apertura della pagina, per il caso in cui il workflow
// non fosse passato: chiusa come «non pianificata» vuol dire scartata.
async function allineaChiuse() {
  for (const r of S.richieste) {
    const iss = S.issue[r.id];
    if (!iss || iss.stato !== 'closed') continue;
    if (['fatta', 'verificato', 'rigettato', 'scartata'].includes(r.stato)) continue;
    await avanzaStato(r, iss.motivo === 'not_planned' ? 'scartata' : 'fatta');
  }
}

async function mandaAClaude(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  const gia = S.issue[id];

  // ⚠️ Due tocchi non fanno due issue: già mandata, si chiede se aggiungere un
  // aggiornamento. Decide chi legge — una seconda issue sulla stessa cosa la
  // dovrebbe poi chiudere qualcuno a mano.
  let azione = 'manda';
  if (gia) {
    if (!confirm(`Questa richiesta è già la issue #${gia.numero}.\n\nVuoi aggiungerci un aggiornamento con il testo e le schermate di adesso?`)) {
      apriIssue(gia.url);
      return;
    }
    azione = 'aggiorna';
  }

  toast(azione === 'manda' ? 'Apro la issue…' : 'Aggiorno la issue…', 8000);
  try {
    const d = await chiamaGithub(azione, { richiesta_id: id });
    S.issue[id] = d.issue;
    await avanzaStato(r, 'inviata');
    disegna();
    if (d.gia)            toast(`Era già la issue #${d.issue.numero}.`, 4000);
    else if (d.aggiornata) toast(`Aggiornata la issue #${d.issue.numero}.`, 4000);
    else                   toast(`Mandata: issue #${d.issue.numero}.`, 4000);
  } catch (e) {
    console.warn('manda:', e);
    toast('Non l\u2019ho mandata: ' + e.message, 7000);
  }
}

// 🤖 FAI LA FIX — una sessione di Claude Code su GitHub
// L'Edge Function apre la issue (se manca) e ci scrive `@claude …`: quel
// commento sveglia `.github/workflows/claude.yml`. ⚠️ La fix va in produzione
// da sola: Claude lavora su un ramo `claude/…` e `deploy.yml` lo fonde su
// master. Per questo si chiede conferma, e la conferma lo dice.
async function avviaFix(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`Parte una sessione di Claude su GitHub per «${r.titolo}».\n\nLa fix verrà pubblicata SUBITO in produzione, senza revisione.\n\nProcedo?`)) return;
  toast('Avvio Claude…', 8000);
  try {
    const d = await chiamaGithub('fix', { richiesta_id: id });
    S.issue[id] = d.issue;
    // La fix è partita: la richiesta passa a «In corso» (solo se era da fare o
    // inviata — una già fatta o scartata non si riporta indietro da sola).
    await avanzaStato(r, 'in_corso');
    S.esiti[id] = null;   // l'esito di prima non vale più: si rilegge
    disegna();
    toast(`Claude è partito sulla issue #${d.issue.numero}: il suo avanzamento si legge lì.`, 6000);
  } catch (e) {
    console.warn('fix:', e);
    toast('Non l\u2019ho avviato: ' + e.message, 7000);
  }
}

// 🤖 ESITO DELLA FIX — quel che Claude ha scritto sulla issue
// Si legge solo quando si apre il riquadro, e una richiesta per volta: sono
// commenti su GitHub, e chiederli per tutte le schede a ogni apertura della
// pagina sarebbe una chiamata per issue per niente.
// ⚠️ Il testo arriva da GitHub e si mostra ESCAPATO: il Markdown si traduce
// a mano per le sole cose che servono a leggerlo (titoli, grassetto, codice,
// caselle), mai inserendo HTML che venga da fuori.
function testoEsito(md) {
  return esc(md || '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^- \[x\]/gim, '✅').replace(/^- \[ \]/gm, '⬜')
    .replace(/^---$/gm, '');
}

function rigaEsito(r) {
  const iss = S.issue[r.id];
  if (!iss) return '';
  const e = S.esiti[r.id];
  let dentro;
  if (e === undefined || e === null) dentro = '<div class="text-sm text-muted">Tocca per leggerlo…</div>';
  else if (e === 'carico') dentro = '<div class="text-sm text-muted">Leggo la issue…</div>';
  else if (e.errore) dentro = `<div class="text-sm" style="color:#b91c1c">Non l\u2019ho letto: ${esc(e.errore)}</div>
      <button class="btn btn-outline" onclick="riprovaEsito('${r.id}')">↻ Riprova</button>`;
  else if (!e.testo) dentro = '<div class="text-sm text-muted">Claude non ha ancora scritto niente su questa issue.</div>';
  else dentro = `<div class="text-sm text-muted">${esc(fmtData(e.quando))}</div>
      <div class="testo esito-testo">${testoEsito(e.testo)}</div>
      <button class="btn btn-outline" onclick="apriIssue('${esc(e.url || iss.url)}')">🐙 Apri su GitHub</button>
      <textarea id="risp-${r.id}" rows="3" style="width:100%;margin-top:8px" placeholder="Rispondi a Claude…"></textarea>
      <button class="btn btn-primary" id="risp-btn-${r.id}" onclick="rispondiEsito('${r.id}')">💬 Commenta e rimanda a Claude</button>`;
  return `<details class="esito-fix"${S.esitoAperto[r.id] ? ' open' : ''} ontoggle="toggleEsito('${r.id}', this.open)">
      <summary>🤖 Esito della fix</summary>${dentro}</details>`;
}

// 💬 Il commento va sulla issue come `@claude …`: Claude riparte da lì. L'esito
// si rilegge dopo l'invio (Claude scriverà una risposta nuova).
async function rispondiEsito(id) {
  const campo = document.getElementById('risp-' + id);
  const testo = campo ? campo.value.trim() : '';
  if (!testo) { toast('Scrivi la risposta.'); return; }
  const b = document.getElementById('risp-btn-' + id);
  if (b) { b.disabled = true; b.textContent = 'Invio…'; }
  try {
    await chiamaGithub('rispondi', { richiesta_id: id, testo });
    S.esiti[id] = null;
    toast('💬 Inviata a Claude.', 3500);
    toggleEsito(id, true);
  } catch (e) {
    toast('Non inviata: ' + e.message, 5000);
    if (b) { b.disabled = false; b.textContent = '💬 Commenta e rimanda a Claude'; }
  }
}

function riprovaEsito(id) { S.esiti[id] = null; toggleEsito(id, true); }

async function toggleEsito(id, aperto) {
  S.esitoAperto[id] = aperto;
  // ⚠️ Già letto, in lettura o fallito: non si richiede da sé. Il riquadro
  // ridisegnato aperto rilancia `toggle`, e un errore riletto a ogni disegno
  // sarebbe un giro senza fine — si riprova solo col pulsante.
  if (!aperto || S.esiti[id]) return;
  S.esiti[id] = 'carico';
  disegna();
  try {
    const d = await chiamaGithub('esito', { richiesta_id: id });
    S.esiti[id] = { testo: d.testo || '', quando: d.quando, url: d.url };
  } catch (e) {
    S.esiti[id] = { errore: e.message };
  }
  disegna();
}

// ⚙️ 🛠 Comandi — issue #24: la pagina sta di qua e non nel ☰ di AppSphere.
// ⚠️ **Nel browser di sistema e non dentro la WebView**, per la stessa ragione
// del download dell'APK: metà di quella pagina sono pulsanti che scaricano un
// `.apk`, e dentro una WebView un download non fa assolutamente niente — nessun
// gestore, nessun installer, nessun errore. Aprendola qui dentro si vedrebbe una
// pagina di pulsanti che non fanno niente.
// ⚠️ **Il file resta dov'è** e non si ricopia qui: 600 righe fra pannelli APK,
// User Test e SQL, in due posti, sono due pagine che divergono il giorno che una
// delle due si tocca. A spostarsi è la porta, non la stanza.
function apriComandi() {
  const a = app();
  const url = 'https://garsal.men/comandi.html';
  if (a && typeof a.apriNelBrowser === 'function') { a.apriNelBrowser(url); toast('Apro il browser…'); return; }
  window.open(url, '_blank');
}

// ⚠️ GitHub si apre nel browser di sistema e non dentro la WebView: là dentro
// non c'è il login di GitHub, quindi una repo privata risponderebbe con la
// pagina di accesso — cioè un pulsante che sembra rotto. È la stessa strada
// del download dell'APK.
function apriIssue(url) {
  if (!url) return;
  const a = app();
  if (a && typeof a.apriNelBrowser === 'function') { a.apriNelBrowser(url); return; }
  window.open(url, '_blank');
}

// ============================================================
// ELENCO
// ============================================================
const FILTRI = [
  { id: 'da_fare',  nome: '📌 Da fare',  tiene: r => r.stato === 'aperta' || r.stato === 'inviata' || r.stato === 'in_corso' },
  { id: 'in_corso', nome: '🔧 In corso', tiene: r => r.stato === 'in_corso' },
  { id: 'fatte',    nome: '✅ Fatte',    tiene: r => r.stato === 'fatta' },
  { id: 'verificate', nome: '🔎 Verificate', tiene: r => r.stato === 'verificato' },
  { id: 'rigettate',  nome: '↩️ Rigettate',  tiene: r => r.stato === 'rigettato' },
  { id: 'scartate', nome: '🚫 Scartate', tiene: r => r.stato === 'scartata' },
  { id: 'tutte',    nome: 'Tutte',       tiene: () => true }
];

function disegna() {
  $('#filtri').innerHTML = FILTRI.map(f => {
    const n = S.richieste.filter(f.tiene).length;
    return `<button class="chip${S.filtro === f.id ? ' on' : ''}" onclick="cambiaFiltro('${f.id}')">${esc(f.nome)} ${n}</button>`;
  }).join('');

  const viste = S.richieste.filter(FILTRI.find(f => f.id === S.filtro).tiene);
  const banner = bannerBozza();
  if (!viste.length) {
    $('#elenco').innerHTML = banner + `<div class="vuoto">Niente qui.<br>Il ＋ in basso apre una richiesta nuova.</div>`;
    return;
  }
  $('#elenco').innerHTML = banner + viste.map(scheda).join('');
}

function cambiaFiltro(id) { S.filtro = id; disegna(); }

function scheda(r) {
  const st = STATI[r.stato] || STATI.aperta;
  const iss = S.issue[r.id];
  const foto = r.immagini.length
    ? `<div class="strisciaFoto">${r.immagini.map((i, n0) => i.url
        ? `<img src="${esc(i.url)}" alt="" onclick="ingrandisci('${r.id}', ${n0})" />`
        : `<div class="badge scartata" style="align-self:center">immagine illeggibile</div>`).join('')}</div>`
    : '';
  return `
    <div class="scheda ${esc(r.stato)}">
      <div class="meta">
        <span class="badge ${esc(r.stato)}">${st.emoji} ${esc(st.nome)}</span>
        ${appDi(r).map(a => `<span class="badge app">${esc(a)}</span>`).join('')}
        ${iss ? `<span class="badge ${iss.stato === 'closed' ? 'fatta' : 'in_corso'}"
                       onclick="apriIssue('${esc(iss.url)}')" style="cursor:pointer"
                       title="Apri la issue su GitHub">🐙 #${esc(iss.numero)}</span>` : ''}
        <span class="text-sm text-muted">${esc(fmtData(r.created_at))}</span>
      </div>
      <h3>${esc(r.titolo)}</h3>
      ${r.descrizione ? `<div class="testo">${esc(r.descrizione)}</div>` : ''}
      ${foto}
      ${rigaEsito(r)}
      <div class="azioni">
        <button class="btn btn-primary" onclick="mandaAClaude('${r.id}')">🐙 ${iss ? 'Aggiorna la issue' : 'Manda a Claude'}</button>
        <button class="btn btn-primary" onclick="avviaFix('${r.id}')">🤖 Fai la fix</button>
        <button class="btn btn-outline" onclick="condividi('${r.id}')">📤 Condividi il prompt</button>
        <button class="btn btn-outline" onclick="apriEditor('${r.id}')">✏️ Modifica</button>
        ${r.stato === 'fatta' ? `<button class="btn btn-primary" onclick="verifica('${r.id}')">🔎 Verificato</button>
        <button class="btn btn-danger" onclick="rigettaApri('${r.id}')">↩️ Rigettato</button>` : ''}
        <button class="btn btn-outline" onclick="cambiaStato('${r.id}')">${esc(st.emoji)} Stato</button>
        <button class="btn btn-danger" onclick="elimina('${r.id}')">🗑 Elimina</button>
      </div>
    </div>`;
}

function ingrandisci(idRichiesta, n) {
  const i = S.richieste.find(x => x.id === idRichiesta)?.immagini[n];
  if (!i || !i.url) return;
  apriPopup(`
    <h2><span>Schermata</span><button class="btn btn-outline" onclick="chiudiPopup()">✕</button></h2>
    <img src="${esc(i.url)}" alt="" style="width:100%;border-radius:var(--radius-sm)" />
  `);
}

// Lo stato gira fra i quattro invece di aprire una tendina: sono quattro, e
// una finestra per cambiare una parola è una finestra di troppo.
async function cambiaStato(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  // ⚠️ «rigettato» fuori dal giro: si arriva solo da ↩️ Rigettato, che crea
  // anche la richiesta nuova — un salto a mano lascerebbe un rigetto senza figlia.
  const ordine = Object.keys(STATI).filter(k => k !== 'rigettato');
  const nuovo = ordine[(ordine.indexOf(r.stato) + 1) % ordine.length];
  const { error } = await sb.from('mod_richieste')
    .update({ stato: nuovo, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Non cambiato: ' + error.message, 4000); return; }
  r.stato = nuovo;
  disegna();
  toast(STATI[nuovo].emoji + ' ' + STATI[nuovo].nome);
}

// ============================================================
// VERIFICA E RIGETTO (issue #47) — a mano, dopo «fatta»
// ============================================================
async function verifica(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r || r.stato !== 'fatta') return;
  const { error } = await sb.from('mod_richieste')
    .update({ stato: 'verificato', updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Non cambiato: ' + error.message, 4000); return; }
  r.stato = 'verificato';
  disegna();
  toast('🔎 Verificato');
}

function rigettaApri(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  apriPopup(`
    <h2><span>↩️ Rigetta</span><button class="btn btn-outline" onclick="chiudiPopup()">✕</button></h2>
    <p class="aiuto">Cosa non va? Nasce una <b>nuova richiesta</b> con titolo, app, descrizione e schermate di «${esc(r.titolo)}», più questa risposta in coda. L'originale passa a Rigettato.</p>
    <textarea id="f-rigetto" rows="5" style="width:100%" placeholder="La risposta…"></textarea>
    <div id="f-errore"></div>
    <div class="azioni" style="margin-top:10px">
      <button class="btn btn-danger" id="f-rigetta" onclick="rigetta('${r.id}')">↩️ Rigetta e crea la nuova</button>
      <button class="btn btn-outline" onclick="chiudiPopup()">Annulla</button>
    </div>`);
}

// ⚠️ Prima la richiesta nuova (con le sue schermate), poi lo stato dell'originale:
// nell'ordine inverso una rete che cade lascerebbe un rigetto senza figlia.
async function rigetta(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  const risposta = $('#f-rigetto').value.trim();
  if (!risposta) { toast('Scrivi la risposta: è quel che dice cosa non va.'); return; }
  const bottone = $('#f-rigetta');
  bottone.disabled = true;
  bottone.textContent = 'Creo…';
  try {
    const apps = appDi(r);
    const { data, error } = await sb.from('mod_richieste').insert({
      user_id: S.utente.id,
      titolo: r.titolo + ' (rigettata)',
      apps, app: apps[0] || null,
      descrizione: ((r.descrizione || '') + '\n\n--- Risposta dopo il rigetto ---\n' + risposta).trim(),
      stato: 'aperta'
    }).select('id').single();
    if (error) throw error;
    const nuovoId = data.id;
    let pos = 0;
    for (const b of await immaginiClonate(r)) {
      const percorso = `${S.utente.id}/${nuovoId}/${crypto.randomUUID()}.jpg`;
      const { error: e1 } = await sb.storage.from(BUCKET).upload(percorso, b.blob, { contentType: 'image/jpeg' });
      if (e1) throw e1;
      const { error: e2 } = await sb.from('mod_immagini')
        .insert({ user_id: S.utente.id, richiesta_id: nuovoId, storage_path: percorso, position: pos++ });
      if (e2) throw e2;
      URL.revokeObjectURL(b.url);
    }
    const { error: e3 } = await sb.from('mod_richieste')
      .update({ stato: 'rigettato', updated_at: new Date().toISOString() }).eq('id', id);
    if (e3) throw e3;
    chiudiPopup();
    await carica();
    toast('↩️ Rigettata: nuova richiesta creata.', 3500);
  } catch (e) {
    console.error(e);
    const box = document.getElementById('f-errore');
    if (box) { box.className = 'esito ko'; box.innerHTML = spiegaStorage(e); }
    toast('Non rigettata.', 4000);
    bottone.disabled = false;
    bottone.textContent = '↩️ Rigetta e crea la nuova';
  }
}

// ============================================================
// EDITOR
// ============================================================
// Le immagini della bozza sono di due specie: quelle **già in archivio** (con
// il loro `storage_path`) e quelle **appena scelte**, che esistono solo come
// blob in memoria finché non si salva. Tenerle nello stesso elenco, marcate,
// evita di caricare su Drive... su Storage una foto che poi nessuno salva.
// ⚠️ LA BOZZA VIVE ANCHE FUORI DALLA MEMORIA DELLA PAGINA.
// Titolo, app e descrizione stanno in `localStorage` mentre li si scrive.
// Aprire il selettore delle foto vuol dire uscire dall'app, e Android è
// libero di chiudere quel che sta dietro: al rientro la pagina si ricarica e
// tutto quel che era in memoria è andato — cioè si ritrova il foglio bianco
// dopo aver scritto. Quel che si è scritto su un telefono non deve dipendere
// da quanta memoria aveva il telefono in quel momento.
// ⚠️ Le SCHERMATE non ci stanno, e non è una svista: sono blob in memoria, e
// `localStorage` tiene stringhe — metterci dentro dei megabyte in base64 lo
// riempirebbe (il tetto è cinque) facendo fallire anche il salvataggio del
// testo. Il banner lo dice invece di lasciarlo scoprire.
const BOZZA_LOCALE = 'mod_bozza';
const BOZZA_ORE    = 24;

function salvaBozzaLocale() {
  if (!S.bozza) return;
  const b = {
    id:          S.bozza.id,
    titolo:      document.getElementById('f-titolo')?.value ?? S.bozza.titolo,
    apps:        S.bozza.apps.slice(),
    descrizione: document.getElementById('f-descrizione')?.value ?? S.bozza.descrizione,
    quando:      Date.now()
  };
  // Una bozza tutta vuota non è una bozza: non lascia banner dietro di sé.
  if (!b.titolo.trim() && !b.apps.length && !b.descrizione.trim()) { scartaBozzaLocale(); return; }
  try { localStorage.setItem(BOZZA_LOCALE, JSON.stringify(b)); } catch (e) { console.warn(e); }
}

function scartaBozzaLocale() {
  try { localStorage.removeItem(BOZZA_LOCALE); } catch (e) { console.warn(e); }
}

// Torna la bozza in archivio solo se ha ancora senso: più vecchia di un
// giorno è roba dimenticata, e riproporla sarebbe rumore.
function bozzaLocale() {
  try {
    const b = JSON.parse(localStorage.getItem(BOZZA_LOCALE) || 'null');
    if (!b || !b.quando) return null;
    if (Date.now() - b.quando > BOZZA_ORE * 3600e3) { scartaBozzaLocale(); return null; }
    return b;
  } catch (e) { return null; }
}

// ⚠️ Non riapre il form da sé: una finestra che compare all'avvio senza che
// nessuno l'abbia chiesta si chiude per riflesso, e con lei la bozza. Si
// offre, e decide chi legge.
function bannerBozza() {
  const b = bozzaLocale();
  if (!b) return '';
  const che = b.titolo.trim() || (b.apps || []).join(', ') || b.descrizione.trim().slice(0, 40);
  return `<div class="esito ok" style="margin-bottom:12px">
      ✍️ Era rimasta una bozza non salvata: <b>${esc(che)}</b>.
      <br><span class="aiuto">Le schermate non si conservano: quelle vanno riscelte.</span>
      <div class="azioni" style="margin-top:8px">
        <button class="btn btn-primary" onclick="riprendiBozza()">Riprendi</button>
        <button class="btn btn-outline" onclick="scartaBozzaLocale(); disegna();">Butta via</button>
      </div>
    </div>`;
}

function riprendiBozza() {
  const b = bozzaLocale();
  if (!b) { disegna(); return; }
  // Una bozza di una richiesta che nel frattempo è stata cancellata non ha
  // più dove tornare: si riapre come nuova invece di scrivere su un id morto.
  const esiste = b.id && S.richieste.some(r => r.id === b.id);
  S.bozza = {
    id: esiste ? b.id : null,
    titolo: b.titolo || '',
    apps: Array.isArray(b.apps) ? b.apps.slice() : (b.app ? [b.app] : []),
    descrizione: b.descrizione || '',
    immagini: esiste ? S.richieste.find(r => r.id === b.id).immagini.map(i => ({ ...i, nuova: false })) : [],
    daTogliere: []
  };
  disegnaEditor();
}

// Le schermate di una richiesta riscaricate come blob «nuovi»: salvando la copia
// salgono nel bucket col percorso della richiesta nuova, e l'originale non si
// tocca (cancellare una copia non deve portare via le foto dell'altra).
async function immaginiClonate(r) {
  const out = [];
  for (const i of r.immagini) {
    if (!i.url) continue;
    try {
      const blob = await (await fetch(i.url)).blob();
      out.push({ nuova: true, blob, url: URL.createObjectURL(blob) });
    } catch (e) { console.warn('immagine non copiata:', e); }
  }
  return out;
}

async function apriEditor(id) {
  const r = id ? S.richieste.find(x => x.id === id) : null;
  // ⚠️ Una richiesta già partita (in corso o fatta) non si riscrive: la sua
  // issue è già andata avanti sul testo di allora. «Modifica» ne apre quindi una
  // COPIA come richiesta nuova — testo, app **e schermate** (riscaricate e
  // ricaricate sotto la richiesta nuova) — e l'originale resta com'è.
  const clona = !!r && ['in_corso', 'fatta', 'verificato', 'rigettato'].includes(r.stato);
  if (clona) toast('Già partita: ne apro una copia nuova.', 3500);
  const copiate = clona ? await immaginiClonate(r) : [];
  S.bozza = {
    id: r && !clona ? r.id : null,
    titolo: r ? (clona ? r.titolo + ' (copia)' : r.titolo) : '',
    apps: r ? appDi(r) : [],
    descrizione: r ? (r.descrizione || '') : '',
    immagini: r && !clona ? r.immagini.map(i => ({ ...i, nuova: false })) : copiate,
    daTogliere: []
  };
  disegnaEditor();
  // ⚠️ Da qui in poi la bozza in archivio è QUESTA: un form aperto soppianta
  // quello di prima. Senza, chiudendo questo si butterebbe via la bozza di un
  // altro — e il banner sparirebbe per un gesto che con lui non c'entra.
  salvaBozzaLocale();
}

// ⚠️ Il campo delle schermate sta in un DIV e non in un <label>, ed è l'unico
// campo del form a farlo. Dentro un'etichetta il tocco arriva DUE volte — una
// all'input e una all'etichetta, che lo rilancia — quindi la WebView chiede
// due volte il selettore: il secondo giro annulla la callback del primo, e il
// selettore che si vede a schermo è quello la cui risposta non aspetta più
// nessuno. Si legge come «sceglie le foto, torna indietro e non c'è niente»,
// senza nessun errore da nessuna parte — ed è il difetto del 14 settembre 2026.
// ⚠️ Il commento sta QUI e non dentro il template: lì i backtick del codice
// citato chiuderebbero la stringa.
/**
 * Le app di una richiesta, sempre come elenco.
 *
 * ⚠️ **Ripiega su `app` quando `apps` è vuoto**, e non è prudenza generica:
 * la colonna è arrivata dopo le righe, e una richiesta già in archivio che la
 * migration non avesse toccato si vedrebbe altrimenti senza nessuna app —
 * cioè un dato sparito, non un dato mancante. È la stessa ragione per cui il
 * filtro di `riservato` va scritto `eq.false,is.null`.
 */
function appDi(r) {
  if (Array.isArray(r.apps) && r.apps.length) return r.apps;
  return r.app ? [r.app] : [];
}

function pillolaApp(apps) {
  if (!apps.length) return '<p class="aiuto" style="margin:0 0 8px">Nessuna app scelta.</p>';
  return `<div class="pillole-app">` + apps.map((a, i) =>
    `<span class="badge app" style="cursor:pointer" onclick="togliApp(${i})"
           title="Toglila">${esc(a)} ✕</span>`).join('') + `</div>`;
}

/**
 * ⚠️ Non si aggiunge due volte la stessa app, e il confronto è **senza
 * maiuscole e senza spazi ai bordi**: «Finanza» e «finanza » sono la stessa
 * cosa scritta in due modi, e due pillole uguali in fila si leggono come un
 * difetto. Resta scritta **com'è stata digitata la prima volta**: il campo è
 * testo libero, e normalizzarlo d'ufficio riscriverebbe quel che qualcuno ha
 * deciso di scrivere così.
 */
function aggiungiApp(opzioni) {
  const campo = document.getElementById('f-app');
  if (!campo || !S.bozza) return;
  const scritta = campo.value.trim();
  campo.value = '';
  if (!scritta) return;
  const chiave = t => t.trim().toLowerCase();
  if (S.bozza.apps.some(a => chiave(a) === chiave(scritta))) {
    if (!(opzioni && opzioni.zitto)) toast('Quell’app c’è già.');
    return;
  }
  S.bozza.apps.push(scritta);
  ridisegnaApp();
}

function togliApp(i) {
  if (!S.bozza) return;
  S.bozza.apps.splice(i, 1);
  ridisegnaApp();
}

/**
 * ⚠️ Si ridisegna **solo l'elenco delle pillole** e non tutto l'editor: un
 * `disegnaEditor()` sostituirebbe i campi di testo e chi sta scrivendo si
 * vedrebbe sparire il cursore da sotto le dita — è lo stesso inciampo degli
 * step in `obiettivi.html`.
 */
function ridisegnaApp() {
  const box = document.getElementById('f-apps-scelte');
  if (box) box.innerHTML = pillolaApp(S.bozza.apps);
  salvaBozzaLocale();
}

function disegnaEditor() {
  const b = S.bozza;
  apriPopup(`
    <h2><span>${b.id ? '✏️ Modifica' : '＋ Nuova richiesta'}</span>
        <button class="btn btn-outline" onclick="chiudiPopup()">✕</button></h2>
    <label class="campo"><span>Titolo</span>
      <input type="text" id="f-titolo" value="${esc(b.titolo)}" oninput="salvaBozzaLocale()"
             placeholder="Cosa va cambiato, in due parole" /></label>
    <div class="campo"><span>App</span>
      <div id="f-apps-scelte">${pillolaApp(b.apps)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">
        <input type="text" id="f-app" list="app-suggerite" style="flex:1 1 12rem;min-width:0"
               placeholder="Quale app tocca" onkeydown="if(event.key==='Enter'){event.preventDefault();aggiungiApp();}" />
        <button type="button" class="btn btn-outline" onclick="aggiungiApp()">＋ Aggiungi</button>
      </div>
      <datalist id="app-suggerite">${APP_SUGGERITE.map(a => `<option value="${esc(a)}"></option>`).join('')}</datalist>
      <span class="aiuto">Se ne possono mettere più d’una: una richiesta tocca spesso la pagina
        e la sua gemella nativa. La prima è quella che finisce in cima alla issue.</span>
    </div>
    <label class="campo"><span>Descrizione</span>
      <textarea id="f-descrizione" oninput="salvaBozzaLocale()"
                placeholder="Cosa non va, o cosa vorresti al suo posto.">${esc(b.descrizione)}</textarea></label>
    <div class="campo"><span>Schermate</span>
      <input type="file" id="f-foto" accept="image/*" multiple
             onclick="armaSelettore()" onchange="aggiungiFoto(this)" />
      <span class="aiuto">Si riducono a ${LATO_MAX} px prima di partire. Da PC puoi anche incollare un’immagine con Ctrl+V.</span>
    </div>
    <div class="strisciaFoto" id="anteprime">${anteprime()}</div>
    <div class="aiuto" id="f-conta">${contaFoto()}</div>
    <div class="azioni">
      <button class="btn btn-primary" id="f-salva" onclick="salva()">💾 Salva</button>
      <button class="btn btn-outline" onclick="chiudiPopup()">Annulla</button>
    </div>
    <div id="f-errore"></div>
  `);
}

function anteprime() {
  return S.bozza.immagini.map((i, n) => `
    <div class="foto-box">
      <img src="${esc(i.url || '')}" alt="" />
      <button class="togli" onclick="togliFoto(${n})" title="Togli">✕</button>
    </div>`).join('');
}

function aggiornaAnteprime() {
  const a = document.getElementById('anteprime');
  if (a) a.innerHTML = anteprime();
  const c = document.getElementById('f-conta');
  if (c) c.textContent = contaFoto();
}

function liberaAnteprime() {
  (S.bozza?.immagini || []).forEach(i => { if (i.nuova && i.url) URL.revokeObjectURL(i.url); });
}

// ⚠️ Un selettore che torna a mani vuote NON è un annullamento silenzioso.
// Annullando, il `change` non scatta affatto: se siamo qui delle schermate
// sono state scelte, e zero file (o file da zero byte) vuol dire che la
// WebView non le ha potute leggere — `allowContentAccess` spento, cioè
// un'APK precedente alla v1.0.1. Senza questo avviso il `for` non gira, non
// compare nessuna anteprima e non si sa perché: è il difetto per cui il
// pulsante sembrava rotto.
function avvisoSelettore(html, consiglio) {
  const box = document.getElementById('f-errore');
  let quale = '';
  try {
    const a = app();
    const v = a ? JSON.parse(a.versione() || '{}') : null;
    quale = v?.version
      ? `Qui c\u2019è l\u2019APK <b>v${esc(v.version)}</b>.`
      : 'Questa pagina non è dentro l\u2019APK «Modifiche».';
  } catch (e) { /* il ponte non risponde: si dice il resto lo stesso */ }
  const coda = consiglio || `Di solito è l\u2019APK vecchia: dalla <b>v1.0.1</b> la WebView
      legge i <code>content://</code> del selettore. Si aggiorna da ⚙️ → 📱 Versione app.`;
  if (box) {
    box.className = 'esito ko';
    box.innerHTML = `❌ ${html}<br>${coda} ${quale}`;
  }
  toast('Le schermate non sono arrivate.', 5000);
}

// ⚠️ LA SENTINELLA DEL SELETTORE.
// Il caso peggiore non è un errore: è il silenzio. Se il selettore torna
// senza consegnare niente, l'evento `change` non scatta affatto — nessuna
// anteprima, nessun errore, nessun toast — e da fuori è indistinguibile da
// un annullamento voluto. Qui si arma un flag al tocco e si guarda al
// rientro nella pagina: passati due secondi senza `change`, lo si dice.
// I due secondi servono perché `visibilitychange` arriva PRIMA che la
// WebView consegni i file, non dopo.
let attesaScelta = 0;
function armaSelettore() { attesaScelta = Date.now(); }

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !attesaScelta) return;
  const quando = attesaScelta;
  setTimeout(() => {
    if (attesaScelta !== quando) return;   // il `change` è scattato: tutto bene
    attesaScelta = 0;
    if (!S.bozza) return;                  // il form non c'è più: non c'è nessuno a cui dirlo
    avvisoSelettore(
      'Il selettore è tornato <b>senza consegnare nessuna schermata</b>.',
      `Se le avevi scelte davvero, è la WebView che non ha ricevuto la risposta:
       riprova toccando <b>direttamente il pulsante del campo</b>, una volta sola.`);
  }, 2000);
});

// Il numero dice quel che le anteprime da sole non dicono: «sono zero perché
// non ne ho scelte» e «sono zero perché non sono arrivate» si somigliano
// troppo per lasciarle senza didascalia.
function contaFoto() {
  const n = (S.bozza?.immagini || []).length;
  if (!n) return 'Nessuna schermata, per ora.';
  const nuove = S.bozza.immagini.filter(i => i.nuova).length;
  return `${n} schermat${n === 1 ? 'a pronta' : 'e pronte'}${nuove ? ` (${nuove} da caricare)` : ''}.`;
}

async function aggiungiFoto(input) {
  attesaScelta = 0;                      // il selettore ha risposto: sentinella disarmata
  const scelte = [...(input.files || [])];
  input.value = '';                      // così la stessa foto si può riscegliere

  if (!scelte.length) { avvisoSelettore('Il selettore non ha restituito <b>nessuna schermata</b>.'); return; }

  for (const f of scelte) {
    // Un file che c'è ma pesa zero è lo stesso difetto un passo più in là:
    // la WebView lo elenca e non ne legge i byte.
    if (!f.size) {
      avvisoSelettore(`<b>${esc(f.name || 'una schermata')}</b> è arrivata <b>vuota</b> (0 byte).`);
      continue;
    }
    try {
      const blob = await riduci(f);
      S.bozza.immagini.push({ nuova: true, blob, url: URL.createObjectURL(blob) });
    } catch (e) {
      console.warn('immagine:', e);
      // ⚠️ Anche qui l'errore resta scritto: «l'ho scelta e non compare» è il
      // sintomo di cui non si conosce mai la causa, e un toast da quattro
      // secondi la porta via prima che si possa leggerla.
      const box = document.getElementById('f-errore');
      if (box) {
        box.className = 'esito ko';
        box.innerHTML = `❌ <b>${esc(f.name || 'una schermata')}</b> non si è aperta:
          ${esc(e.message || e)}.<br>Se succede con tutte, l\u2019APK è vecchia: aggiornala da
          ⚙️ → 📱 Versione app.`;
      }
      toast('Una immagine non si è aperta.', 4000);
    }
  }
  aggiornaAnteprime();
}

// Ctrl+V: un'immagine negli appunti (uno screenshot, una copia da un'altra
// pagina) entra fra le schermate come se fosse stata scelta dal selettore,
// passando dallo stesso `aggiungiFoto` — riduzione a LATO_MAX compresa.
// ⚠️ Solo a editor aperto (`S.bozza`) e solo se negli appunti c'è davvero
// un'immagine: un incolla di testo nei campi non va toccato.
document.addEventListener('paste', e => {
  if (!S.bozza) return;
  const files = [...(e.clipboardData?.items || [])]
    .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
    .map(it => it.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  aggiungiFoto({ files, value: '' });
});

function togliFoto(n) {
  const i = S.bozza.immagini[n];
  if (!i) return;
  if (i.nuova) { if (i.url) URL.revokeObjectURL(i.url); }
  else S.bozza.daTogliere.push(i);
  S.bozza.immagini.splice(n, 1);
  aggiornaAnteprime();
}

// ⚠️ `imageOrientation: 'from-image'`: una foto scattata col telefono porta
// l'orientamento nell'EXIF, e senza questa riga arriverebbe coricata — la si
// crederebbe una foto storta invece di una foto letta male.
async function riduci(file) {
  // ⚠️ Tre gradini e non uno: `createImageBitmap` con le opzioni è quello
  // giusto, senza opzioni è il ripiego per una WebView vecchia, e l'ultimo è
  // un `<img>` — che non legge l'EXIF ma un'immagine la dà comunque. Senza
  // gradini, una WebView che non conosce quella chiamata non carica NIENTE e
  // non dice perché.
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e1) {
    try { bmp = await createImageBitmap(file); }
    catch (e2) { return await riduciConImg(file); }
  }
  const scala = Math.min(1, LATO_MAX / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scala));
  const h = Math.max(1, Math.round(bmp.height * scala));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close?.();
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', QUALITA));
  if (!blob) throw new Error('non convertita');
  return blob;
}

function riduciConImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scala = Math.min(1, LATO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scala));
        const h = Math.max(1, Math.round(img.naturalHeight * scala));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => b ? res(b) : rej(new Error('non convertita')), 'image/jpeg', QUALITA);
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('immagine illeggibile')); };
    img.src = url;
  });
}

async function salva() {
  const b = S.bozza;
  b.titolo      = $('#f-titolo').value.trim();
  // ⚠️ Quel che è rimasto scritto nella casella senza premere ＋ conta lo
  // stesso: scrivere il nome dell'app e poi Salva è il gesto più naturale che
  // ci sia, e perderlo in silenzio sarebbe il modo peggiore di chiedere un
  // tocco in più.
  aggiungiApp({ zitto: true });
  b.descrizione = $('#f-descrizione').value.trim();
  if (!b.titolo) { toast('Senza titolo la richiesta non si ritrova.'); return; }

  const bottone = $('#f-salva');
  bottone.disabled = true;
  bottone.textContent = 'Salvo…';

  try {
    // 1. la riga. Le foto vengono dopo, perché il percorso nel bucket porta
    //    l'id della richiesta e per una richiesta nuova quell'id non esiste
    //    ancora — è la stessa regola delle foto di Memo.
    let id = b.id;
    const campi = {
      titolo: b.titolo,
      // ⚠️ `apps` è la verità, `app` ne porta la PRIMA e si riscrive a ogni
      //    salvataggio: la legge `modifiche-issue` per l'intestazione della
      //    issue, e le issue già aperte la citano. Nominarla sempre è la
      //    stessa regola di `excluded` in `saveCoverage` — un campo che non
      //    si nomina resta a quel che era, e qui direbbe un'app che non c'è
      //    più nell'elenco.
      apps: b.apps,
      app: b.apps[0] || null,
      descrizione: b.descrizione || null,
      updated_at: new Date().toISOString()
    };
    if (id) {
      const { error } = await sb.from('mod_richieste').update(campi).eq('id', id);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('mod_richieste')
        .insert({ ...campi, user_id: S.utente.id }).select('id').single();
      if (error) throw error;
      id = data.id;
    }
    // ⚠️ La bozza si tiene l'id appena nato: se il caricamento di una
    // schermata fallisce, il form resta aperto e ripremendo Salva si
    // **riprende** invece di creare una seconda richiesta identica.
    b.id = id;

    // 2. le foto nuove
    let pos = 0;
    for (const i of b.immagini) {
      if (!i.nuova) { pos++; continue; }
      const percorso = `${S.utente.id}/${id}/${crypto.randomUUID()}.jpg`;
      const { error: e1 } = await sb.storage.from(BUCKET)
        .upload(percorso, i.blob, { contentType: 'image/jpeg' });
      if (e1) throw e1;
      const { error: e2 } = await sb.from('mod_immagini')
        .insert({ user_id: S.utente.id, richiesta_id: id, storage_path: percorso, position: pos });
      if (e2) throw e2;
      // Quella è passata: ripremendo Salva non si ricarica.
      i.nuova = false;
      i.storage_path = percorso;
      pos++;
    }

    // 3. quelle tolte: ⚠️ prima il file e poi la riga. Nell'ordine inverso una
    //    rete che cade lascia nel bucket un'immagine che nessuna riga nomina,
    //    cioè un file che dall'app non si può più togliere.
    for (const i of b.daTogliere) {
      await sb.storage.from(BUCKET).remove([i.storage_path]);
      await sb.from('mod_immagini').delete().eq('id', i.id);
    }

    liberaAnteprime();
    scartaBozzaLocale();
    S.bozza = null;
    chiudiPopup();
    await carica();
    toast('Salvata.');
  } catch (e) {
    console.error(e);
    // ⚠️ L'errore si scrive NEL form e non in un toast da due secondi: quando
    // a mancare è il bucket, il rimedio è un SQL da incollare — e un rimedio
    // che sparisce da sé non è un rimedio. Il toast resta per chi guardava
    // altrove.
    const box = document.getElementById('f-errore');
    if (box) { box.className = 'esito ko'; box.innerHTML = spiegaStorage(e); }
    toast('Non salvata.', 4000);
    bottone.disabled = false;
    bottone.textContent = '💾 Salva';
  }
}

async function elimina(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  const n = r.immagini.length;
  if (!confirm(`Butto via «${r.titolo}»${n ? ` e le sue ${n} schermate` : ''}?\n\nNon si torna indietro.`)) return;
  // Le righe di `mod_immagini` se ne andrebbero da sé per cascata, ma il
  // bucket quel vincolo non lo conosce: prima i file.
  if (n) await sb.storage.from(BUCKET).remove(r.immagini.map(i => i.storage_path));
  const { error } = await sb.from('mod_richieste').delete().eq('id', id);
  if (error) { toast('Non eliminata: ' + error.message, 4000); return; }
  await carica();
  toast('Eliminata.');
}

// ============================================================
// IL PROMPT
// ============================================================
function costruisciPrompt(r) {
  const righe = [];
  righe.push('Richiesta di modifica per garsal-apps.');
  righe.push('');
  righe.push('Titolo: ' + r.titolo);
  const apps = appDi(r);
  if (apps.length) righe.push((apps.length === 1 ? 'App: ' : 'App: ') + apps.join(', '));
  righe.push('Scritta il ' + fmtData(r.created_at) + '.');
  righe.push('');
  righe.push(r.descrizione || '(nessuna descrizione)');
  const n = r.immagini.length;
  if (n) {
    righe.push('');
    righe.push(n === 1
      ? 'Allego la schermata che lo mostra.'
      : `Allego le ${n} schermate che lo mostrano.`);
  }
  return righe.join('\n');
}

// Le schermate viaggiano **insieme** al testo: condividere il solo prompt e poi
// andarsele a cercare nella galleria è esattamente l'attrito che questa pagina
// esiste per togliere. Si riscaricano dal bucket (sono già ridotte) e si
// passano al ponte in base64, che l'app scrive in cache e allega.
async function immaginiPerCondivisione(r) {
  const fuori = [];
  for (const i of r.immagini) {
    if (!i.url) continue;
    try {
      const blob = await (await fetch(i.url)).blob();
      const dati = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload  = () => res(String(fr.result).split(',')[1] || '');
        fr.onerror = rej;
        fr.readAsDataURL(blob);
      });
      fuori.push({ nome: `schermata-${fuori.length + 1}.jpg`, dati });
    } catch (e) { console.warn('schermata non allegata:', e); }
  }
  return fuori;
}

async function condividi(id) {
  const r = S.richieste.find(x => x.id === id);
  if (!r) return;
  const testo = costruisciPrompt(r);
  const p = ponte();

  try {
    if (p && r.immagini.length && typeof p.condividiConImmagini === 'function') {
      toast('Preparo le schermate…');
      const imgs = await immaginiPerCondivisione(r);
      if (imgs.length) { p.condividiConImmagini(testo, JSON.stringify(imgs)); return; }
    }
    if (p && typeof p.condividi === 'function') { p.condividi(testo); return; }

    // Fuori dall'APK il tasto deve fare comunque qualcosa: il Condividi del
    // browser dove c'è, e gli appunti dove non c'è — un pulsante che sul PC non
    // fa niente si legge come un pulsante rotto.
    if (navigator.share) { await navigator.share({ text: testo }); return; }
    await navigator.clipboard.writeText(testo);
    toast('Prompt copiato negli appunti.');
  } catch (e) {
    if (e && e.name === 'AbortError') return;     // condivisione annullata
    console.warn('condivisione:', e);
    try { await navigator.clipboard.writeText(testo); toast('Prompt copiato negli appunti.'); }
    catch (e2) { toast('Non sono riuscito a condividere.', 4000); }
  }
}

// ============================================================
// AVVIO
// ============================================================
// ⚠️ Il token della home: AppSphere lo tiene in `localStorage.sb_token` (stessa
// origine) e lo passa con `SB_TOKEN`, come a tutte le altre bolle. Si usa solo se
// non scaduto (`exp`, margine 30 s): uno morto darebbe 401 a ogni chiamata.
function decodeJWT(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); }
  catch (e) { return null; }
}
function tokenHome() {
  let t = null;
  try { t = localStorage.getItem('sb_token') || sessionStorage.getItem('sb_token'); } catch (e) {}
  const p = t && decodeJWT(t);
  return (p && p.sub && p.exp && p.exp * 1000 > Date.now() + 30000) ? t : null;
}
async function conTokenHome(token) {
  const p = decodeJWT(token);
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:   { persistSession: false, autoRefreshToken: false },
    global: { headers: { Authorization: 'Bearer ' + token } }
  });
  S.utente = { id: p.sub, email: p.email || '' };
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#fab').classList.remove('hidden');
  await carica();
  return true;
}
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'SB_TOKEN' && e.data.token && !S.utente && decodeJWT(e.data.token)) {
    conTokenHome(e.data.token);
  }
});

async function avviaSessione() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return false;
  S.utente = data.session.user;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#fab').classList.remove('hidden');
  await carica();
  return true;
}

async function avvia() {
  $('#btn-impostazioni').onclick = apriImpostazioni;
  $('#fab').onclick = () => apriEditor(null);
  $('#l-accedi').onclick = accedi;
  $('#l-google').onclick = accediConGoogle;
  $('#l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') accedi(); });

  if (await avviaSessione()) return;
  const th = tokenHome();
  if (th && await conTokenHome(th)) return;
  if (await rientroAutomatico() && await avviaSessione()) return;

  // niente sessione: resta la schermata di accesso
  const c = creds();
  if (c) { try { $('#l-email').value = (JSON.parse(c.getCredentials() || '{}').email || ''); } catch (e) {} }
}

sb.auth.onAuthStateChange((evento, sessione) => {
  if (evento === 'SIGNED_IN' && sessione && !S.utente) avviaSessione();
});

avvia();

/* ⚠️ IL TASTO INDIETRO DI ANDROID DENTRO UN POPUP
   Aprendo un popup si spinge una voce di cronologia; l'indietro la consuma e qui sotto si chiude
   il popup invece di lasciare la pagina. Chiudendolo col ✕ la voce si consuma da sé, o ogni
   apri-e-chiudi ne lascerebbe una dietro e dopo cinque popup servirebbero cinque indietro per
   uscire.

   ⚠️ L'apertura NON si intercetta avvolgendo le funzioni che aprono i popup: in queste pagine
   sono decine, alcune sono `onclick` scritti nell'HTML e altre non hanno nemmeno un nome. Si
   guarda invece quando l'overlay diventa visibile — l'unica cosa che tutti i popup hanno in
   comune, comunque siano stati aperti — e si riconosce dallo stile calcolato, non dal nome della
   classe, che in queste pagine è ora `hidden`, ora `active`, ora `open`.

   ⚠️ La voce si spinge UNA SOLA VOLTA anche con più popup aperti uno sopra l'altro: sono
   contenuti nella stessa finestra, non schermate, e due voci vorrebbero dire due indietro per
   chiudere una cosa sola. L'indietro chiude l'ultimo aperto.

   ⚠️ Il consumo controlla `history.state`: se nel frattempo la pagina ha spinto una voce sua (un
   cambio di vista) la nostra non è più in cima, e un `history.back()` cieco tornerebbe indietro
   di una schermata invece di togliere la voce del popup.

   ⚠️ Questo blocco è UGUALE in tutte le app della suite: se lo correggi qui, portalo anche
   nelle altre (l'elenco dei popup è l'unica cosa che cambia). */
(function guardiaIndietroPopup(elenco) {
  const visibile = el => el && getComputedStyle(el).display !== 'none';
  const aperti = () => elenco.flatMap(p =>
    [...document.querySelectorAll(p.sel)].filter(visibile).map(el => ({ el, chiudi: p.chiudi })));

  let spinta = false;

  function controlla() {
    const n = aperti().length;
    if (n && !spinta) { spinta = true; history.pushState({ __popup: true }, ''); }
    else if (!n && spinta) {
      spinta = false;
      if (history.state && history.state.__popup) history.back();
    }
  }

  function avvia() {
    const osservatore = new MutationObserver(controlla);
    elenco.forEach(p => document.querySelectorAll(p.sel).forEach(el =>
      osservatore.observe(el, { attributes: true, attributeFilter: ['class', 'style'] })));
    controlla();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia);
  else avvia();

  window.addEventListener('popstate', () => {
    const a = aperti();
    if (!a.length) return;          // nessun popup: l'indietro fa quel che ha sempre fatto
    spinta = false;
    const ultimo = a[a.length - 1];
    try { ultimo.chiudi(ultimo.el); } catch (err) { console.warn('indietro:', err); }
  });
})([
  { sel: '#velo', chiudi: () => chiudiPopup() },
]);
</script>
