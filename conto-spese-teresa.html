<script>

    'background:#4f46e5;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',

const SUPABASE_URL = 'https://jajlmmdsjlvzgcxiiypk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphamxtbWRzamx2emdjeGlpeXBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTU0NjYsImV4cCI6MjA4NTUzMTQ2Nn0.ikaipwxOvIn43epayQ4mSZQkXtin3aaGEPouafwJFxU';

const S = { session: null, view: 'dashboard', transactions: [], charts: {}, selectedYear: null };

const tok = () => S.session?.access_token || SUPABASE_ANON_KEY;
function sbH(extra = {}) {
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${tok()}`, 'Content-Type': 'application/json', ...extra };
}
async function sbQ(table, params = '') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: sbH() });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}
async function sbIns(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST', headers: sbH({ 'Prefer': 'return=representation' }), body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return (await r.json())[0];
}
async function sbUpd(table, filter, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH', headers: sbH({ 'Prefer': 'return=representation' }), body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}
async function sbDel(table, filter) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { method: 'DELETE', headers: sbH() });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
}
async function sbFn(name, payload) {
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: 'POST', headers: sbH(), body: JSON.stringify(payload),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data?.error) throw new Error(data?.error?.message || r.statusText);
  return data;
}

const loadSession = () => { try { return JSON.parse(localStorage.getItem('garsal_session')); } catch { return null; } };
async function initFromSbToken(token) {
  try {
    const user = await (await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` },
    })).json();
    if (user?.id) {
      return { access_token: token, refresh_token: null, expires_at: Date.now() + 3600_000, user };
    }
  } catch {}
  return null;
}
async function refreshSession(session) {
  if (!session?.refresh_token) return null;
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!r.ok) return null;
    const d = await r.json();
    const ns = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + d.expires_in * 1000, user: d.user };
    localStorage.setItem('garsal_session', JSON.stringify(ns));
    return ns;
  } catch { return null; }
}

}

function calcolaQuote(anno) {
  const txs = S.transactions.filter(t => t.anno === anno);
  const bonTeresa = txs.filter(t => t.tipo === 'BONIFICO' && t.persona === 'TERESA').reduce((s, t) => s + +t.importo, 0);
  const bonSalva = txs.filter(t => t.tipo === 'BONIFICO' && t.persona === 'SALVATORE').reduce((s, t) => s + +t.importo, 0);
  const altTeresa = txs.filter(t => t.tipo === 'ALTRO' && t.persona === 'TERESA').reduce((s, t) => s + +t.importo, 0);
  const altSalva = txs.filter(t => t.tipo === 'ALTRO' && t.persona === 'SALVATORE').reduce((s, t) => s + +t.importo, 0);
  const mensa = txs.filter(t => t.tipo === 'MENSA').reduce((s, t) => s + +t.importo, 0);
  const versatoTeresa = bonTeresa + altTeresa;
  const versatoSalva = bonSalva + altSalva + mensa;
  const totaleSpeso = versatoTeresa + versatoSalva;
  const quotaTeresa = anno <= 2023 ? totaleSpeso * 2 / 5 : totaleSpeso / 3;
  const quotaSalva = totaleSpeso - quotaTeresa;
  const diffTeresa = versatoTeresa - quotaTeresa;
  const diffSalva = versatoSalva - quotaSalva;
  return { anno, bonTeresa, bonSalva, altTeresa, altSalva, mensa, versatoTeresa, versatoSalva, totaleSpeso, quotaTeresa, quotaSalva, diffTeresa, diffSalva };
}

function calcolaTotaliGenerali() {
  const anni = getAnni();
  const initTot = () => ({ bonTeresa:0, bonSalva:0, altTeresa:0, altSalva:0, mensa:0, versatoTeresa:0, versatoSalva:0, totaleSpeso:0, quotaTeresa:0, quotaSalva:0, diffTeresa:0, diffSalva:0 });
  const p1 = initTot(); // Periodo <= 2023
  const p2 = initTot(); // Periodo >= 2024
  const tot = initTot(); // Gran totale
  
  for (const a of anni) {
    const q = calcolaQuote(a);
    const target = a <= 2023 ? p1 : p2;
    
    [target, tot].forEach(t => {
      t.bonTeresa += q.bonTeresa;
      t.bonSalva += q.bonSalva;
      t.altTeresa += q.altTeresa;
      t.altSalva += q.altSalva;
      t.mensa += q.mensa;
      t.versatoTeresa += q.versatoTeresa;
      t.versatoSalva += q.versatoSalva;
      t.totaleSpeso += q.totaleSpeso;
      t.quotaTeresa += q.quotaTeresa;
      t.quotaSalva += q.quotaSalva;
      t.diffTeresa += q.diffTeresa;
      t.diffSalva += q.diffSalva;
    });
  }
  return { p1, p2, tot };
}

function getAnni() {
  return [...new Set(S.transactions.map(t => t.anno))].sort((a, b) => b - a);
}

function drawChart(id, labels, data, colors) {
  if (S.charts[id]) { S.charts[id].destroy(); delete S.charts[id]; }
  const canvas = document.getElementById(id);
  if (!canvas || !data.some(v => v > 0)) return;
  const PALETTE = ['#4f46e5','#16a34a','#d97706','#dc2626','#0891b2'];
  S.charts[id] = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: (colors || PALETTE).slice(0, data.length), borderWidth: 2, borderColor: '#fff' }] },
    options: { cutout: '60%', plugins: { legend: { position: 'right', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11, padding: 12 } } }, animation: { duration: 400 } },
  });
}

// ══════════ IMPORT DAL CONTO BANCARIO ══════════
// La contribuzione si alimenta dallo STESSO conto che alimenta Spese Famiglia: i conti sono
// quelli di cm_bank_connections con 'cost_analysis' fra gli uses, collegati e battezzati in
// Finanza → Configurazione → 🏦 Banche e Conti.
//
// enable-banking-transactions legge e basta: non scrive niente nel database, quindi il filtro
// (solo bonifici entranti), l'attribuzione a Teresa o Salvatore e il controllo dei doppioni
// restano qui, dove si sa com'è fatta questa contabilità.

const PERSONE = ['TERESA', 'SALVATORE'];

const normText = s => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const normIban = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const isIbanLike = s => /^[A-Z]{2}[0-9]{2}[A-Z0-9]{8,}$/.test(normIban(s));

// Indizi che riconoscono chi ha versato: un IBAN (chiave sicura) o un pezzo di nome. I valori
// di partenza sono quelli che usava l'import da CSV; si cambiano da Impostazioni e restano nel
// browser, perché sono una preferenza di lettura e non un dato della contabilità.
const PERSON_HINTS_KEY = 'cst_person_hints';
const DEFAULT_PERSON_HINTS = { TERESA: ['TERESA', 'GARSIA'], SALVATORE: ['SALVATORE'] };
function personHints() {
  try {
    const saved = JSON.parse(localStorage.getItem(PERSON_HINTS_KEY));
    if (saved && PERSONE.every(p => Array.isArray(saved[p]))) return saved;
  } catch {}
  return DEFAULT_PERSON_HINTS;
}
function savePersonHints(hints) {
  localStorage.setItem(PERSON_HINTS_KEY, JSON.stringify(hints));
}

// Chi ha versato si decide in tre gradini, dal segnale più affidabile al più fragile: IBAN
// della controparte, nome della controparte, e solo per ultimo il testo della causale — che è
// quello su cui sbagliava l'import da CSV, dove un "bonifico per Teresa" scritto da Salvatore
// diventava un versamento di Teresa. Se nessuno risponde, o rispondono in due, la riga resta
// "da attribuire" e la si sceglie a mano nell'anteprima invece di indovinare.
function guessPersona(tx) {
  const hints = personHints();
  const hitsIban = p => (hints[p] || []).some(h => isIbanLike(h) && normIban(h) === normIban(tx.counterpartyIban));
  const hitsText = (p, hay) => (hints[p] || []).some(h => (h || '').trim() && !isIbanLike(h) && hay.includes(normText(h)));

  if (tx.counterpartyIban) {
    const perIban = PERSONE.filter(hitsIban);
    if (perIban.length === 1) return { persona: perIban[0], via: 'IBAN' };
  }
  const nome = normText(tx.counterpartyName);
  if (nome) {
    const perNome = PERSONE.filter(p => hitsText(p, nome));
    if (perNome.length === 1) return { persona: perNome[0], via: 'nome' };
  }
  const testo = normText(`${tx.counterpartyName || ''} ${tx.description || ''}`);
  const perTesto = PERSONE.filter(p => hitsText(p, testo));
  if (perTesto.length === 1) return { persona: perTesto[0], via: 'causale' };
  return { persona: null, via: null };
}

// Solo bonifici: i pagamenti carta, i prelievi e gli addebiti che passano sullo stesso conto
// sono spese, non contribuzioni. Enable Banking espone il codice ISO 20022 (domain/family/
// sub_family): i bonifici stanno in ICDT (inviati) e RCDT (ricevuti), la carta in CCRD/POSD, il
// prelievo in CWDL. I codici veri di questo conto non sono verificati su una risposta reale:
// quando il codice manca si ripiega sul testo e sulla presenza di un IBAN di controparte, e
// quello che resta fuori è comunque contato e mostrabile con una spunta, così se il filtro
// sbaglia si vede invece di perdere movimenti in silenzio.
const CODICE_BONIFICO = /\b(ICDT|RCDT)\b/;
const CODICE_NON_BONIFICO = /\b(CCRD|CWDL|POSD)\b/;
const TESTO_NON_BONIFICO = /(PRELIEVO|BANCOMAT|\bATM\b|\bPOS\b|CARTA|COMMISSION|CANONE|IMPOSTA|BOLLO)/i;
function isBonifico(tx) {
  const code = (tx.bankTransactionCode || '').toUpperCase();
  if (CODICE_NON_BONIFICO.test(code)) return false;
  if (CODICE_BONIFICO.test(code)) return true;
  if (TESTO_NON_BONIFICO.test(`${tx.description || ''} ${tx.counterpartyName || ''}`)) return false;
  return !!tx.counterpartyIban;
}

function bankTxDescription(tx) {
  const parts = [tx.description, tx.counterpartyName].map(s => (s || '').trim()).filter(Boolean);
  // Causale e nome della controparte spesso si ripetono: scriverlo due volte non aiuta.
  const uniq = parts.filter((p, i) => !parts.slice(0, i).some(q => q.toLowerCase().includes(p.toLowerCase())));
  return uniq.join(' · ') || tx.bankTransactionCode || 'Bonifico';
}

async function loadBankMovements() {
  const bankConnectionId = $('bank-import-conn').value;
  const dateFrom = $('bank-import-from').value || undefined;
  const mostraTutto = $('bank-import-all').checked;
  $('modal-body').innerHTML = '<p class="import-note">Leggo i movimenti dalla banca…</p>';
  try {
    const res = await sbFn('enable-banking-transactions', { bankConnectionId, dateFrom });
    // Solo entrate: un bonifico in uscita da questo conto è una spesa, non una contribuzione.
    const entrate = (res.transactions || []).filter(t => t.amount > 0 && (t.bookingDate || t.valueDate));
    const scartati = entrate.filter(t => !isBonifico(t));
    const candidati = mostraTutto ? entrate : entrate.filter(isBonifico);
    if (!candidati.length) {
      $('modal-body').innerHTML = `
        <p class="text-sm">Nessun bonifico in entrata nel periodo scelto${scartati.length ? ` (${scartati.length} entrate scartate perché non sembrano bonifici)` : ''}.</p>
        <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
      return;
    }

    // Doppioni: stessa data, stesso importo e stessa descrizione è la stessa riga, e rileggere
    // un periodo già importato è la normalità. Stessa data e stesso importo con descrizione
    // diversa è quasi sempre la stessa contribuzione già entrata da CSV con un'altra dicitura:
    // qui si tratta di soldi che entrano nelle quote, quindi si parte deselezionata e la si
    // rimette a mano, invece di raddoppiare un versamento in silenzio.
    const chiave = t => `${t.data}|${Math.abs(+t.importo).toFixed(2)}`;
    const esatti = new Set(S.transactions.map(t => `${chiave(t)}|${(t.descrizione || '').trim().toLowerCase()}`));
    const stessoGiornoImporto = new Set(S.transactions.map(chiave));

    const items = candidati.map(t => {
      const data = (t.bookingDate || t.valueDate).slice(0, 10);
      const descrizione = bankTxDescription(t);
      const importo = Math.abs(t.amount);
      const k = `${data}|${importo.toFixed(2)}`;
      const duplicato = esatti.has(`${k}|${descrizione.trim().toLowerCase()}`);
      const g = guessPersona(t);
      return {
        data, descrizione, importo,
        persona: g.persona, via: g.via,
        bonifico: isBonifico(t),
        counterpartyName: t.counterpartyName || '',
        duplicato,
        simile: !duplicato && stessoGiornoImporto.has(k),
      };
    }).sort((a, b) => a.data.localeCompare(b.data));

    _bankImport = { items, account: res.account };
    const nuovi = items.filter(i => !i.duplicato && !i.simile).length;
    const daAttribuire = items.filter(i => !i.persona).length;
    $('modal-body').innerHTML = `
      <p class="import-note">
        ${items.length} movimenti da <strong>${res.account?.aspspName || 'banca'}</strong> —
        ${nuovi} nuovi, ${items.length - nuovi} già presenti o sospetti (deselezionati).
        ${scartati.length && !mostraTutto ? `<br/>${scartati.length} entrate scartate perché non sembrano bonifici.` : ''}
        ${daAttribuire ? `<br/>⚠️ ${daAttribuire} da attribuire: controlla la persona prima di importare.` : ''}
        ${res.truncated ? '<br/>⚠️ Elenco troncato: restringi il periodo per vederli tutti.' : ''}
      </p>
      <div style="max-height:46vh;overflow-y:auto;margin:12px 0">
        <table class="import-table">
          <thead><tr><th></th><th>Data</th><th>Descrizione</th><th class="text-right">Importo</th><th>Da</th></tr></thead>
          <tbody>${items.map((it, i) => `
            <tr class="${it.duplicato || it.simile ? 'is-dup' : ''}">
              <td><input type="checkbox" data-bank-idx="${i}" ${it.duplicato || it.simile ? '' : 'checked'} /></td>
              <td class="mono" style="white-space:nowrap">${fmtDate(it.data)}</td>
              <td>${it.descrizione.replace(/</g, '&lt;')}
                ${it.duplicato ? '<span class="text-muted"> · già presente</span>' : ''}
                ${it.simile ? '<span style="color:var(--c-warning)"> · ⚠️ stessa data e importo di un movimento presente</span>' : ''}
                ${it.bonifico ? '' : '<span style="color:var(--c-warning)"> · ⚠️ non sembra un bonifico</span>'}</td>
              <td class="mono text-right" style="white-space:nowrap">${fmtEUR(it.importo)}</td>
              <td>
                <select class="form-input form-select" data-bank-persona="${i}" style="padding:3px 6px;font-size:.78rem">
                  ${PERSONE.map(p => `<option value="${p}" ${it.persona === p ? 'selected' : ''}>${p === 'TERESA' ? 'Teresa' : 'Salvatore'}</option>`).join('')}
                </select>
                <div class="import-note">${it.persona ? `da ${it.via}` : '⚠️ da attribuire'}</div>
              </td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-action="close-modal">Annulla</button>
        <button class="btn btn-primary" data-action="bank-import-confirm">Importa selezionati</button>
      </div>`;
  } catch (e) {
    $('modal-body').innerHTML = `<p class="text-sm neg">Errore: ${e.message}</p>
      <div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Chiudi</button></div>`;
  }
}

async function confirmBankImport() {
  if (!_bankImport) return;
  const scelti = [];
  document.querySelectorAll('#modal-body input[data-bank-idx]').forEach(cb => {
    if (!cb.checked) return;
    const i = parseInt(cb.dataset.bankIdx, 10);
    const sel = document.querySelector(`#modal-body [data-bank-persona="${i}"]`);
    scelti.push({ ..._bankImport.items[i], persona: sel ? sel.value : 'SALVATORE' });
  });
  if (!scelti.length) { alert('Nessun movimento selezionato.'); return; }
  $('modal-body').innerHTML = '<p class="import-note">Importo…</p>';
  let importati = 0;
  const errori = [];
  for (const it of scelti) {
    try {
      await sbIns('acct_transactions', {
        user_id: S.session.user.id,
        anno: parseInt(it.data.slice(0, 4), 10),
        data: it.data,
        persona: it.persona,
        tipo: 'BONIFICO',
        importo: it.importo,
        descrizione: it.descrizione,
        causale: 'Importato dal conto Spese Famiglia',
        provenienza: 'IMPORTATO',
      });
      importati++;
    } catch (e) {
      errori.push(`${fmtDate(it.data)} ${fmtEUR(it.importo)}: ${e.message}`);
    }
  }
  closeModal();
  _bankImport = null;
  alert(`✅ Importazione completata\n\nMovimenti caricati: ${importati}` +
    (errori.length ? `\n\n⚠️ Non caricati: ${errori.length}\n${errori.slice(0, 5).join('\n')}` : ''));
  await reload();
}

async function handleRevolutCSV(file) {
  const text = await file.text();
  // Rimuovi eventuali caratteri invisibili (BOM) all'inizio
  const cleanText = text.trim().replace(/^\uFEFF/, '');
  
  // Rileva separatore (virgola o punto e virgola)
  const firstLine = cleanText.split('\n')[0];
  const sep = firstLine.includes(';') ? ';' : ',';
  
  const rows = cleanText.split('\n').map(r => r.split(sep).map(c => c.trim().replace(/^"|"$/g, '')));
  if (rows.length < 2) return;
  
  const header = rows[0].map(h => h.toLowerCase());
  console.log('[Revolut Import] Header rilevati:', header);

  const findIdx = (names) => {
    for (const name of names) {
      const i = header.indexOf(name.toLowerCase());
      if (i !== -1) return i;
    }
    return -1;
  };

  const idx = {
    type:   findIdx(['Type', 'Tipo']),
    date:   findIdx(['Started Date', 'Data di inizio', 'Completed Date', 'Data di completamento', 'Data']),
    amount: findIdx(['Amount', 'Importo']),
    desc:   findIdx(['Description', 'Descrizione']),
    state:  findIdx(['State', 'Stato'])
  };

  console.log('[Revolut Import] Mappatura colonne:', idx);

  if (idx.type === -1 || idx.amount === -1) {
    console.error('[Revolut Import] Header mancanti. Type:', idx.type, 'Amount:', idx.amount);
    alert('Formato CSV Revolut non riconosciuto.\n\nAssicurati che il file contenga le colonne: Tipo, Data, Importo, Descrizione.');
    return;
  }

  const dataRows = rows.slice(1).filter(r => r.length >= Math.max(...Object.values(idx)));

  let imported = 0;
  let skipped = 0;

  for (const r of dataRows) {
    const status = (r[idx.state] || '').toUpperCase();
    if (status !== 'COMPLETED' && status !== 'COMPLETATO') continue;
    
    const type = (r[idx.type] || '').toUpperCase();
    const rawAmount = parseFloat(r[idx.amount]);
    const amount = Math.abs(rawAmount);
    const dateStr = r[idx.date].split(' ')[0]; // Prende solo la data YYYY-MM-DD
    const desc = r[idx.desc] || '';
    
    // Solo bonifici entranti (ricariche sul conto)
    if (!type.includes('RICARICA')) continue;
    const tipo = 'BONIFICO';

    // Logica di auto-assegnazione intelligente
    let persona = 'SALVATORE'; // Default
    const upperDesc = desc.toUpperCase();
    if (upperDesc.includes('TERESA') || upperDesc.includes('GARSIA')) persona = 'TERESA';
    if (upperDesc.includes('SALVATORE')) persona = 'SALVATORE';

    // Controllo duplicati base (data + importo + descrizione)
    const isDup = S.transactions.some(t => 
      t.data === dateStr && 
      Math.abs(parseFloat(t.importo)) === amount &&
      t.descrizione === desc
    );

    if (isDup) {
      skipped++;
      continue;
    }

    const payload = {
      user_id: S.session.user.id,
      anno: new Date(dateStr).getFullYear(),
      data: dateStr,
      persona: persona,
      tipo: tipo,
      importo: amount,
      descrizione: desc,
      causale: 'Importato da Revolut',
      provenienza: 'IMPORTATO'
    };

    await sbIns('acct_transactions', payload);
    imported++;
  }

  alert(`Importazione completata!\n\n✅ Transazioni caricate: ${imported}\n⏭️ Saltate (già presenti): ${skipped}`);
  await reload();
}

// ══════════ NAV / EVENTS ══════════

function navigate(view) {
  S.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const vEl = $(`view-${view}`);
  if (vEl) vEl.classList.add('active');
  const nEl = document.querySelector(`.nav-item[data-view="${view}"]`);
  if (nEl) nEl.classList.add('active');
  $('sidebar')?.classList.remove('open');
  $('mobile-nav-overlay')?.classList.remove('open');
  history.pushState({ view }, '');
  render();
}

window.addEventListener('popstate', e => {
  if (!e.state) return;
  const view = e.state.view || 'dashboard';
  S.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const vEl = $(`view-${view}`);
  if (vEl) vEl.classList.add('active');
  const nEl = document.querySelector(`.nav-item[data-view="${view}"]`);
  if (nEl) nEl.classList.add('active');
  render();
});

function render() {
  switch (S.view) {
    case 'dashboard': renderDashboard(); break;
    case 'bonifici': renderBonifici(); break;
    case 'spese': renderSpese(); break;
    case 'report': renderReport(); break;
    case 'import': renderImport(); break;
    case 'impostazioni': renderImpostazioni(); break;
  }
}

async function reload() {
  await loadData();
  render();
}

// ══════════ EVENTS ══════════

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'nav') {
    navigate(btn.dataset.view);
  } else if (action === 'close-modal') {
    closeModal();
  } else if (action === 'new-transaction') {
    openNewTxModal(null, btn.dataset.tipo || null);
  } else if (action === 'edit-tx') {
    openNewTxModal(btn.dataset.id);
  } else if (action === 'del-tx') {
    if (confirm('Eliminare questo movimento?')) {
      sbDel('acct_transactions', `id=eq.${btn.dataset.id}`).then(reload);
    }
  } else if (action === 'del-imported-all') {
    if (confirm('Eliminare TUTTE le transazioni importate (banca e CSV) per quest\'anno?')) {
      const ids = S.transactions.filter(t => t.provenienza === 'IMPORTATO' && t.anno === S.selectedYear).map(t => t.id);
      if (ids.length === 0) return;
      Promise.all(ids.map(id => sbDel('acct_transactions', `id=eq.${id}`))).then(reload);
    }
  } else if (action === 'bank-import') {
    openBankImport();
  } else if (action === 'bank-import-read') {
    loadBankMovements();
  } else if (action === 'bank-import-confirm') {
    confirmBankImport();
  } else if (action === 'save-hints') {
    savePersonHintsFromForm();
  } else if (action === 'logout') {
    logout();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'revolut-csv-input') {
    const file = e.target.files[0];
    if (file) {
      const label = e.target.closest('label');
      const oldText = label ? label.textContent : '';
      if (label) { label.textContent = '⌛ Elaborazione...'; label.style.pointerEvents = 'none'; }
      try {
        await handleRevolutCSV(file);
      } finally {
        if (label) { label.textContent = oldText; label.style.pointerEvents = ''; }
        e.target.value = '';
      }
    }
  }
  if (e.target.matches('[data-action="year-filter"]')) {
    S.selectedYear = parseInt(e.target.value);
    render();
  }
});

document.getElementById('btn-hamburger').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobile-nav-overlay').classList.toggle('open');
});
document.getElementById('mobile-nav-overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-nav-overlay').classList.remove('open');
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

async function init() {
  let session = null;

  // 1. Token condiviso da AppSphere launcher (sb_token in localStorage)
  const sbToken = localStorage.getItem('sb_token');
  if (sbToken) session = await initFromSbToken(sbToken);

  // 2. Sessione propria salvata
  if (!session) {
    session = loadSession();
    if (session && session.expires_at < Date.now()) {
      session = await refreshSession(session);
    }
  }

  if (!session) {
    location.href = 'finanza.html';
    return;
  }
  S.session = session;

  // BroadcastChannel AppSphere
  const _authChannel = new BroadcastChannel('appsphere_auth');
  _authChannel.onmessage = (e) => {
    if (!e.data) return;
    if (e.data.type === 'LOGOUT') {
      localStorage.removeItem('sb_token');
      location.href = 'finanza.html';
    } else if (e.data.type === 'TOKEN_REFRESH' && e.data.sbToken) {
      localStorage.setItem('sb_token', e.data.sbToken);
      if (S.session) S.session.access_token = e.data.sbToken;
    }
  };

  const u = session.user;
  // (nome non mostrato)
  if (u.user_metadata?.avatar_url) {
    $('user-avatar').innerHTML = `<img src="${u.user_metadata.avatar_url}" alt="" />`;
  } else {
    $('user-avatar').textContent = (u.user_metadata?.full_name || u.email || 'U')[0].toUpperCase();
  }

  try {
    await loadData();
  } catch (err) {
    console.error('Errore caricamento dati:', err);
  }

  $('screen-app').classList.remove('hidden');
  $('screen-app').style.display = 'flex';
  $('loading-overlay').classList.add('hidden');

  const anni = getAnni();
  $('footer-info').textContent = `${S.transactions.length} transazioni · ${anni.length} anni`;

  navigate('dashboard');
  history.replaceState({ view: 'dashboard' }, '');
}

init();

/* ── Il tasto «indietro» di Android e i popup ──────────────────────────────
   ⚠️ Dentro un popup l'indietro usciva dalla PAGINA: la WebView non ha niente in cronologia,
   quindi tornava ad AppSphere buttando via quel che si stava scrivendo. Un popup non è una
   pagina, ma su Android deve comportarsi come tale — l'indietro è il gesto con cui si chiude
   qualunque cosa si sia aperta.

   Aprendo un popup si spinge una voce di cronologia; l'indietro la consuma e qui sotto si chiude
   il popup invece di lasciare la pagina. Chiudendolo col ✕ la voce si consuma da sé, o ogni
   apri-e-chiudi ne lascerebbe una dietro e dopo cinque popup servirebbero cinque indietro per
   uscire.

   ⚠️ L'apertura NON si intercetta avvolgendo le funzioni che aprono i popup: in queste pagine
   sono decine, alcune sono `onclick` scritti nell'HTML e altre non hanno nemmeno un nome. Si
   guarda invece quando l'overlay diventa visibile — l'unica cosa che tutti i popup hanno in
   comune, comunque siano stati aperti — e si riconosce dallo stile calcolato, non dal nome della
   classe, che in queste pagine è ora `hidden`, ora `active`, ora `open`.

   ⚠️ La voce si spinge UNA SOLA VOLTA anche con più popup aperti uno sopra l'altro: sono
   contenuti nella stessa finestra, non schermate, e due voci vorrebbero dire due indietro per
   chiudere una cosa sola. L'indietro chiude l'ultimo aperto.

   ⚠️ Il consumo controlla `history.state`: se nel frattempo la pagina ha spinto una voce sua (un
   cambio di vista) la nostra non è più in cima, e un `history.back()` cieco tornerebbe indietro
   di una schermata invece di togliere la voce del popup.

   ⚠️ Questo blocco è UGUALE in tutte le app della suite: se lo correggi qui, portalo anche
   nelle altre (l'elenco dei popup è l'unica cosa che cambia). */
(function guardiaIndietroPopup(elenco) {
  const visibile = el => el && getComputedStyle(el).display !== 'none';
  const aperti = () => elenco.flatMap(p =>
    [...document.querySelectorAll(p.sel)].filter(visibile).map(el => ({ el, chiudi: p.chiudi })));

  let spinta = false;

  function controlla() {
    const n = aperti().length;
    if (n && !spinta) { spinta = true; history.pushState({ __popup: true }, ''); }
    else if (!n && spinta) {
      spinta = false;
      if (history.state && history.state.__popup) history.back();
    }
  }

  function avvia() {
    const osservatore = new MutationObserver(controlla);
    elenco.forEach(p => document.querySelectorAll(p.sel).forEach(el =>
      osservatore.observe(el, { attributes: true, attributeFilter: ['class', 'style'] })));
    controlla();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia);
  else avvia();

  window.addEventListener('popstate', () => {
    const a = aperti();
    if (!a.length) return;          // nessun popup: l'indietro fa quel che ha sempre fatto
    spinta = false;
    const ultimo = a[a.length - 1];
    try { ultimo.chiudi(ultimo.el); } catch (err) { console.warn('indietro:', err); }
  });
})([
  { sel: '#modal-overlay', chiudi: () => closeModal() },
]);
</script>
