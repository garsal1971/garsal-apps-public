<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario di studio v1.2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica — avvisi in cima, poi un riquadro per giorno da oggi all'ultima verifica */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1b2333; --muted:#5d6779; --line:#dde2ea; --accent:#2f5bd3; --on-accent:#ffffff; --ok:#2e8b57; --danger:#c0392b; --warn:#b36b0a;
  --compiti:#7c3aed; --studio:#0891b2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f; --ok:#5cc48a; --danger:#ef7a6b; --warn:#e5a84a;
  --compiti:#b18cf5; --studio:#4cc3dc; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f; --card:#1a2030; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2b3346; --accent:#7d9ff0; --on-accent:#12161f; --ok:#5cc48a; --danger:#ef7a6b; --warn:#e5a84a; --compiti:#b18cf5; --studio:#4cc3dc; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 0}
.sub a{color:var(--accent)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.avvisi{display:grid;gap:6px}
.avviso{background:var(--card);border:1px solid var(--warn);border-left:6px solid var(--warn);border-radius:10px;padding:10px 12px}
.avviso.ok{border-color:var(--ok)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.days{display:grid;gap:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px}
.day-h b{font-family:var(--display);font-size:18px}
.day-h .cap{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day-h .cap b{font-family:var(--body);font-size:13px;color:var(--fg)}
.fasce{font-size:12px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.ver{font-size:13px;font-weight:600;color:var(--danger)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
li{display:flex;align-items:baseline;gap:8px}
li .n{flex:1;min-width:0}
li .n small{color:var(--muted)}
li .m{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none}
li.fatto .n{text-decoration:line-through;color:var(--muted)}
.free{font-size:13px;color:var(--muted)}
.over{font-size:13px;color:var(--warn);font-weight:600}
.loading,.empty{color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.switch button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.weeknav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.weeknav b{font-family:var(--display);font-size:16px}
.ghost{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.ghost:disabled{opacity:.4;cursor:default}
.wrap.largo{max-width:1180px}
.days.griglia{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.day.fuori{opacity:.55}
.wtot{font-size:13px;color:var(--muted)}
.wtot b{color:var(--fg);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <header class="head">
    <div>
      <h1>Calendario di studio</h1>
      <p class="sub">Prima i compiti, poi le ore degli argomenti fino alla verifica. <a href="impostazioni-ada.html">Fasce e pausa →</a></p>
    </div>
  </header>
  <div class="avvisi" id="avvisi"></div>
  <div class="ctrl">
    <div class="switch" role="group" aria-label="Vista"><button type="button" data-vista="tutti" aria-pressed="true">Tutti i giorni</button><button type="button" data-vista="settimana" aria-pressed="false">Settimana</button></div>
    <div class="weeknav" id="weeknav" hidden>
      <button class="ghost" type="button" id="prev" aria-label="Settimana precedente">‹</button>
      <b id="week-label"></b>
      <button class="ghost" type="button" id="next" aria-label="Settimana successiva">›</button>
      <button class="ghost" type="button" id="questa">Questa settimana</button>
    </div>
  </div>
  <div class="wtot" id="wtot" hidden></div>
  <div class="legenda"><span><span class="dot" style="background:var(--compiti)"></span>Compiti</span><span><span class="dot" style="background:var(--studio)"></span>Studio per le verifiche</span></div>
  <div class="days" id="days"><p class="loading">Carico…</p></div>
</div>

<script src="scuola-ada.js"></script>
<script>
var APP_VERSION = 'v1.2.0';
var BUILD_TIME  = '2026-11-11T16:40:00Z';
console.log('%c CALENDARIO ADA ' + APP_VERSION + ' %c build: ' + BUILD_TIME,
  'background:#0891b2;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',
  'background:#222;color:#aaa;padding:2px 6px;border-radius:0 3px 3px 0');

const FULL = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI_MIN = 7; // il calendario guarda almeno una settimana anche senza verifiche

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const piu = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const oggi = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}` : `${m} min`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const minuti = t => { const [h, m] = String(t || '').split(':').map(Number); return isNaN(h) ? 0 : h * 60 + (m || 0); };
const dataBreve = s => { const d = parse(s); return `${FULL[d.getDay()].slice(0, 3).toLowerCase()} ${d.getDate()} ${MESI[d.getMonth()]}`; };

// Vista: tutti i giorni oppure una settimana (lunedì → domenica) alla volta.
const V = { dati: null, vista: 'tutti', lunedi: null };
try { if (localStorage.getItem('sc_cal_vista') === 'settimana') V.vista = 'settimana'; } catch (e) {}
const lunediDi = d => piu(d, -((d.getDay() + 6) % 7));

async function carica() {
  const t = oggi(), oggiIso = iso(t);
  try {
    const [materie, orario, fatti, ver, args, imp] = await Promise.all([
      SC.db('sc_materie?select=id,nome,minuti'),
      SC.db('sc_orario?select=id,giorno,ora,materia_id,senza_compiti&order=giorno,ora'),
      SC.db(`sc_compiti_fatti?select=giorno,orario_id&giorno=gte.${oggiIso}`),
      SC.db(`sc_verifiche?select=id,data,materia,tipo&data=gte.${oggiIso}&order=data,created_at`),
      SC.db('sc_argomenti?select=id,verifica_id,titolo,ore,studiato,posizione&order=posizione'),
      SC.db('sc_impostazioni?select=*&limit=1')
    ]);
    V.dati = { materie, orario, fatti, ver, args, imp: imp[0] || { fasce: {}, pausa_minuti: 0 } };
    ridisegna();
  } catch (e) { document.getElementById('days').innerHTML = `<p class="empty">Non riesco a leggere i dati: ${esc(e.message)}</p>`; }
}

// ── Il piano ──────────────────────────────────────────────────────────────
// Per ogni giorno da oggi: tempo utile = fasce × 60 / (60 + pausa ogni ora); prima i compiti (quelli
// delle lezioni di domani, come in compiti-ada.html, meno quelli già spuntati);
// nel tempo che avanza le ore degli argomenti non ancora «studiati», dalla
// verifica più vicina, e solo nei giorni prima della verifica.
function piano({ materie, orario, fatti, ver, args, imp }, finoA) {
  const t = oggi(), mat = new Map(materie.map(m => [m.id, m]));
  const fatto = new Set(fatti.map(f => f.giorno + '|' + f.orario_id));
  const ultima = ver.length ? parse(ver[ver.length - 1].data) : t;
  const fine = new Date(Math.max(piu(ultima, -1), piu(t, GIORNI_MIN - 1), finoA || 0));
  const pausa = imp.pausa_minuti || 0, fasce = imp.fasce || {};

  // Gli argomenti da studiare, in ordine di scadenza.
  const daFare = [];
  for (const v of ver) for (const a of args.filter(a => a.verifica_id === v.id).sort((x, y) => x.posizione - y.posizione))
    if (!a.studiato && Number(a.ore) > 0) daFare.push({ v, a, resto: Number(a.ore) * 60 });

  const giorni = [];
  for (let d = new Date(t); d <= fine; d = piu(d, 1)) {
    const g = d.getDay(), giornoIso = iso(d), domani = piu(d, 1).getDay();
    const lf = fasce[g] || [];
    const lordo = lf.reduce((a, f) => a + Math.max(0, minuti(f[1]) - minuti(f[0])), 0);
    const cap = Math.floor(lordo * 60 / (60 + pausa)); // gemella di utile() in impostazioni-ada.html
    const compiti = domani >= 1 && domani <= 6 ? orario
      .filter(o => o.giorno === domani && !o.senza_compiti && (mat.get(o.materia_id)?.minuti || 0) > 0)
      .map(o => ({ nome: mat.get(o.materia_id).nome, min: mat.get(o.materia_id).minuti, ok: fatto.has(giornoIso + '|' + o.id) })) : [];
    const minCompiti = compiti.filter(c => !c.ok).reduce((a, c) => a + c.min, 0);
    let libero = Math.max(0, cap - minCompiti);
    const studio = [];
    for (const x of daFare) {
      if (libero <= 0) break;
      if (x.resto <= 0 || x.v.data <= giornoIso) continue; // si studia prima del giorno della verifica
      const q = Math.min(x.resto, libero);
      x.resto -= q; libero -= q;
      studio.push({ v: x.v, a: x.a, min: q });
    }
    giorni.push({ d, giornoIso, lf, cap, compiti, minCompiti, studio, libero, sopra: Math.max(0, minCompiti - cap),
      verifiche: ver.filter(v => v.data === giornoIso) });
  }
  // Quello che non ci sta, per verifica.
  const mancano = new Map();
  for (const x of daFare) if (x.resto > 0) mancano.set(x.v.id, { v: x.v, min: (mancano.get(x.v.id)?.min || 0) + x.resto });
  return { giorni, mancano: [...mancano.values()], senzaFasce: !Object.values(fasce).some(l => l && l.length), daFare };
}

// Il piano parte sempre da oggi (lo studio si distribuisce da qui): la vista
// Settimana ne mostra un pezzo, e i giorni già passati restano sbiaditi.
function ridisegna() {
  if (!V.dati) return;
  const sett = V.vista === 'settimana';
  if (!V.lunedi) V.lunedi = lunediDi(oggi());
  const domenica = piu(V.lunedi, 6);
  const p = piano(V.dati, sett ? domenica : null);
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', b.dataset.vista === V.vista ? 'true' : 'false'));
  document.getElementById('weeknav').hidden = !sett;
  document.getElementById('app').classList.toggle('largo', sett);
  document.getElementById('days').classList.toggle('griglia', sett);
  if (sett) {
    document.getElementById('week-label').textContent = `${V.lunedi.getDate()} ${MESI[V.lunedi.getMonth()]} – ${domenica.getDate()} ${MESI[domenica.getMonth()]}`;
    document.getElementById('prev').disabled = V.lunedi <= lunediDi(oggi());
    const daIso = iso(V.lunedi), aIso = iso(domenica), mappa = new Map(p.giorni.map(g => [g.giornoIso, g]));
    const giorni = [];
    for (let i = 0; i < 7; i++) { const d = piu(V.lunedi, i), k = iso(d); giorni.push(mappa.get(k) || { d, giornoIso: k, passato: true }); }
    const tc = giorni.reduce((a, g) => a + (g.minCompiti || 0), 0), ts = giorni.reduce((a, g) => a + (g.studio || []).reduce((x, s) => x + s.min, 0), 0);
    const w = document.getElementById('wtot'); w.hidden = false;
    w.innerHTML = `Nella settimana: compiti <b>${fmt(tc)}</b> · studio <b>${fmt(ts)}</b> · disponibili <b>${fmt(giorni.reduce((a, g) => a + (g.cap || 0), 0))}</b>`;
    render(p, giorni);
  } else { document.getElementById('wtot').hidden = true; render(p, p.giorni); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.vista) { V.vista = b.dataset.vista; try { localStorage.setItem('sc_cal_vista', V.vista); } catch (err) {} ridisegna(); }
  else if (b.id === 'prev' || b.id === 'next') { V.lunedi = piu(V.lunedi, b.id === 'prev' ? -7 : 7); ridisegna(); }
  else if (b.id === 'questa') { V.lunedi = lunediDi(oggi()); ridisegna(); }
});

function render(p, giorni) {
  const av = [];
  if (p.senzaFasce) av.push(`<div class="avviso">Non ci sono fasce orarie: senza, non c'è tempo in cui mettere lo studio. <a href="impostazioni-ada.html">Imposta le fasce →</a></div>`);
  for (const m of p.mancano)
    av.push(`<div class="avviso">⚠️ ${esc(m.v.materia)} (${dataBreve(m.v.data)}): <b>mancano ${fmt(m.min)}</b> di studio che non entrano nelle fasce.</div>`);
  if (!p.senzaFasce && !p.mancano.length && p.daFare.length) av.push(`<div class="avviso ok">✅ Tutte le ore di studio entrano prima delle verifiche.</div>`);
  document.getElementById('avvisi').innerHTML = av.join('');

  const oggiIso = iso(oggi());
  document.getElementById('days').innerHTML = giorni.map(g => {
    if (g.passato) return `<div class="day fuori"><div class="day-h"><b>${FULL[g.d.getDay()]} ${g.d.getDate()} ${MESI[g.d.getMonth()]}</b></div><div class="free">Passato</div></div>`;
    const usatoStudio = g.studio.reduce((a, s) => a + s.min, 0);
    const base = Math.max(g.cap, g.minCompiti) || 1;
    const bar = g.cap || g.minCompiti ? `<div class="bar"><i style="width:${g.minCompiti / base * 100}%;background:var(--compiti)"></i><i style="width:${usatoStudio / base * 100}%;background:var(--studio)"></i></div>` : '';
    const comp = g.compiti.map(c => `<li class="${c.ok ? 'fatto' : ''}"><span class="dot" style="background:var(--compiti)"></span><span class="n">${esc(c.nome)}</span><span class="m">${c.ok ? '✅' : fmt(c.min)}</span></li>`).join('');
    const stud = g.studio.map(s => `<li><span class="dot" style="background:var(--studio)"></span><span class="n">${esc(s.v.materia)} · ${esc(s.a.titolo)} <small>· per ${dataBreve(s.v.data)}</small></span><span class="m">${fmt(s.min)}</span></li>`).join('');
    const coda = g.sopra ? `<div class="over">I compiti superano le fasce di ${fmt(g.sopra)}</div>`
      : g.cap ? `<div class="free">Libero: ${fmt(g.libero)}</div>` : (comp ? '' : `<div class="free">Nessuna fascia di studio</div>`);
    return `<div class="day${g.giornoIso === oggiIso ? ' today' : ''}">
      <div class="day-h"><b>${g.giornoIso === oggiIso ? 'Oggi · ' : ''}${FULL[g.d.getDay()]} ${g.d.getDate()} ${MESI[g.d.getMonth()]}</b>
        <span class="cap">${g.cap ? `disponibili <b>${fmt(g.cap)}</b>` : ''}</span></div>
      ${g.lf.length ? `<div class="fasce">${g.lf.map(f => `${f[0]}–${f[1]}`).join(' · ')}</div>` : ''}
      ${g.verifiche.map(v => `<div class="ver">📝 ${v.tipo === 'interrogazione' ? 'Interrogazione' : 'Compito'} di ${esc(v.materia)}</div>`).join('')}
      ${bar}${comp || stud ? `<ul>${comp}${stud}</ul>` : ''}${coda}</div>`;
  }).join('');
}

SC.avvia('calendario-ada.html', carica);
</script>
</body>
</html>
