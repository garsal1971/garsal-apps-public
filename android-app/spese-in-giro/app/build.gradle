plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.garsal.speseingiro'
    compileSdk 36

    defaultConfig {
        applicationId "com.garsal.speseingiro"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "1.0.7"
    }

    // Le pagine HTML scelgono fra dev e produzione dall'hostname (_IS_DEV); qui un
    // hostname non c'è, quindi la scelta la fa il build type e nel codice non
    // compare nessun if sull'ambiente — si legge BuildConfig e basta.
    buildTypes {
        debug {
            buildConfigField "String", "SUPABASE_URL", '"https://hcmmywitrbmcsmytjbaf.supabase.co"'
            buildConfigField "String", "SUPABASE_ANON_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbW15d2l0cmJtY3NteXRqYmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODE1NDUsImV4cCI6MjA4OTM1NzU0NX0.pAtj6THjWXibrMulU1IVGH-BFx4YkjkNT_x07lNUfWE"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SUPABASE_URL", '"https://jajlmmdsjlvzgcxiiypk.supabase.co"'
            buildConfigField "String", "SUPABASE_ANON_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphamxtbWRzamx2emdjeGlpeXBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTU0NjYsImV4cCI6MjA4NTUzMTQ2Nn0.ikaipwxOvIn43epayQ4mSZQkXtin3aaGEPouafwJFxU"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    // ⚠️ NON aggiungere `material-icons-extended`: migliaia di icone compilate come
    // codice Kotlin, che senza minificazione finiscono tutte nel DEX — in
    // appsphere-native da sola aveva portato l'APK a 51 MB. Qui le icone sono
    // emoji dentro del testo e quelle di material-icons-core che arriva con material3.
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // OCR dello scontrino — ML Kit nella variante **non incorporata**: il modello lo
    // tiene Google Play Services e lo scarica all'installazione (vedi il meta-data
    // nel manifest). ⚠️ `com.google.mlkit:text-recognition` porterebbe dentro l'APK
    // il modello per tutte e quattro le ABI: in appsphere-native ha portato il
    // pacchetto da 30 a 73 MB in un colpo solo.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
